# Isolated local verification; no host ports, checkout mounts or operator env.
name: erpx-local-verification
services:
  workspace:
    image: erpx-local-verification:local
    command: ["sleep", "infinity"]
    working_dir: /workspace/erpx
    environment:
      CARGO_TARGET_DIR: /cache/cargo-target
      BUN_INSTALL_CACHE_DIR: /root/.bun/install/cache
    volumes:
      - source:/workspace/erpx
      - cargo-target:/cache/cargo-target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - bun-cache:/root/.bun/install/cache
      - secrets:/run/erpx-verification-secrets:ro
      - scanner-socket:/run/erpx-scanner:ro
      - scanner-definitions:/run/erpx-clamav-definitions:ro
  postgres:
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    network_mode: service:workspace
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        printf '%s\n' "listen_addresses = '127.0.0.1'" 'max_pred_locks_per_transaction = 256' 'max_pred_locks_per_relation = 32' 'max_pred_locks_per_page = 2' > /tmp/erpx-verification-postgresql.conf
        exec docker-entrypoint.sh postgres -c config_file=/tmp/erpx-verification-postgresql.conf
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/erpx-verification-secrets/postgres
    volumes:
      - postgres-data:/var/lib/postgresql
      - secrets:/run/erpx-verification-secrets:ro
volumes:
  source:
    name: erpx-verify-${ERPX_VERIFY_KEY:?Set ERPX_VERIFY_KEY}-source
  cargo-target:
    name: erpx-verify-${ERPX_VERIFY_KEY:?Set ERPX_VERIFY_KEY}-rust1.99.1-target
  cargo-registry:
    name: erpx-verify-${ERPX_VERIFY_KEY:?Set ERPX_VERIFY_KEY}-rust1.99.1-registry
  cargo-git:
    name: erpx-verify-${ERPX_VERIFY_KEY:?Set ERPX_VERIFY_KEY}-rust1.99.1-git
  bun-cache:
    name: erpx-verify-${ERPX_VERIFY_KEY:?Set ERPX_VERIFY_KEY}-bun1.4.3-cache
  postgres-data:
    name: erpx-verify-${ERPX_VERIFY_KEY:?Set ERPX_VERIFY_KEY}-postgres
  secrets:
    external: true
    name: erpx-verify-${ERPX_VERIFY_KEY:?Set ERPX_VERIFY_KEY}-secrets
  scanner-socket:
    external: true
    name: erpx-opensource-dev-services_scanner-socket
  scanner-definitions:
    external: true
    name: erpx-opensource-dev-services_scanner-definitions
