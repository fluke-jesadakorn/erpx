syntax = "proto3";

package erpx.projects;

import "erpx/common/context.proto";

enum ProjectClass {
  PROJECT_CLASS_UNSPECIFIED = 0;
  PROJECT_CLASS_CLIENT_SERVICES = 1;
  PROJECT_CLASS_INTERNAL = 2;
  PROJECT_CLASS_CAPITAL = 3;
}

enum ProjectStatus {
  PROJECT_STATUS_UNSPECIFIED = 0;
  PROJECT_STATUS_PROPOSED = 1;
  PROJECT_STATUS_APPROVED = 2;
  PROJECT_STATUS_ACTIVE = 3;
  PROJECT_STATUS_PAUSED = 4;
  PROJECT_STATUS_COMPLETED = 5;
  PROJECT_STATUS_CLOSED = 6;
  PROJECT_STATUS_CANCELLED = 7;
  PROJECT_STATUS_ARCHIVED = 8;
}

enum ProjectNodeKind {
  PROJECT_NODE_KIND_UNSPECIFIED = 0;
  PROJECT_NODE_KIND_PHASE = 1;
  PROJECT_NODE_KIND_EPIC = 2;
  PROJECT_NODE_KIND_TASK = 3;
  PROJECT_NODE_KIND_MILESTONE = 4;
  PROJECT_NODE_KIND_DELIVERABLE = 5;
  PROJECT_NODE_KIND_RISK = 6;
  PROJECT_NODE_KIND_ISSUE = 7;
  PROJECT_NODE_KIND_DECISION = 8;
  PROJECT_NODE_KIND_CHANGE_REQUEST = 9;
}

enum ProjectDependencyKind {
  PROJECT_DEPENDENCY_KIND_UNSPECIFIED = 0;
  PROJECT_DEPENDENCY_KIND_FINISH_TO_START = 1;
  PROJECT_DEPENDENCY_KIND_START_TO_START = 2;
  PROJECT_DEPENDENCY_KIND_FINISH_TO_FINISH = 3;
  PROJECT_DEPENDENCY_KIND_START_TO_FINISH = 4;
}

enum ProjectDependencySide {
  PROJECT_DEPENDENCY_SIDE_UNSPECIFIED = 0;
  PROJECT_DEPENDENCY_SIDE_SOURCE = 1;
  PROJECT_DEPENDENCY_SIDE_TARGET = 2;
}

enum ProjectHandoffKind {
  PROJECT_HANDOFF_KIND_UNSPECIFIED = 0;
  PROJECT_HANDOFF_KIND_FINANCE_INVOICE = 1;
  PROJECT_HANDOFF_KIND_FINANCE_BILLING = 2;
  PROJECT_HANDOFF_KIND_LEGAL_CONTRACT = 3;
  PROJECT_HANDOFF_KIND_OPERATIONS_ACTION = 4;
  PROJECT_HANDOFF_KIND_ASSET_CAPITALIZATION = 5;
  PROJECT_HANDOFF_KIND_SALES_BILLING = 6;
  PROJECT_HANDOFF_KIND_PROCUREMENT_REQUISITION = 7;
}

message ProjectsMutationResponse {
  erpx.common.CommandReceipt receipt = 1;
  string record_type = 2;
  string record_id = 3;
}

message CreateProjectRequest {
  erpx.common.CommandContext context = 1;
  string project_id = 2;
  erpx.common.AuthorityScope scope = 3;
  string code = 4;
  string name = 5;
  ProjectClass project_class = 6;
  string policy_ref = 7;
  string workflow_template_id = 8;
  string owner_principal_id = 9;
}

message TransitionProjectRequest {
  erpx.common.CommandContext context = 1;
  string project_id = 2;
  ProjectStatus target_status = 3;
  optional string close_evidence_digest = 4;
}

message AddProjectNodeRequest {
  erpx.common.CommandContext context = 1;
  string project_id = 2;
  string node_id = 3;
  optional string parent_node_id = 4;
  ProjectNodeKind kind = 5;
  string title = 6;
  string owner_principal_id = 7;
  repeated string assignee_principal_ids = 8;
  string workflow_state = 9;
  optional string planned_start_date = 10;
  optional string planned_end_date = 11;
  optional string source_thread_id = 12;
  optional string source_comment_id = 13;
  optional uint64 source_comment_revision = 14;
}

message MoveProjectNodeRequest {
  erpx.common.CommandContext context = 1;
  string project_id = 2;
  string node_id = 3;
  optional string new_parent_node_id = 4;
}

message TransitionProjectNodeRequest {
  erpx.common.CommandContext context = 1;
  string project_id = 2;
  string node_id = 3;
  string target_workflow_state = 4;
}

message AttachProjectNodeReferenceRequest {
  erpx.common.CommandContext context = 1;
  string project_id = 2;
  string node_id = 3;
  string referenced_record_id = 4;
  string referenced_context = 5;
  string referenced_record_type = 6;
}

message AddProjectNodeAttachmentRequest {
  erpx.common.CommandContext context = 1;
  string project_id = 2;
  string node_id = 3;
  string attachment_id = 4;
  string object_ref = 5;
  string content_digest = 6;
}

message RecordProjectNodeTimeRequest {
  erpx.common.CommandContext context = 1;
  string project_id = 2;
  string node_id = 3;
  string time_fact_id = 4;
  string worker_record_id = 5;
  uint64 minutes = 6;
  string occurred_on = 7;
  string evidence_record_id = 8;
  uint64 evidence_version = 9;
}

message RecordProjectNodeCostRequest {
  erpx.common.CommandContext context = 1;
  string project_id = 2;
  string node_id = 3;
  string cost_fact_id = 4;
  sint64 amount_minor = 5;
  string currency = 6;
  string category = 7;
  string occurred_on = 8;
  string evidence_record_id = 9;
  uint64 evidence_version = 10;
}

message ProjectDependencyEndpoint {
  string project_id = 1;
  uint64 project_version = 2;
  string node_id = 3;
  uint64 node_version = 4;
  erpx.common.AuthorityScope scope = 5;
  string owner_principal_id = 6;
}

message ProposeProjectDependencyRequest {
  erpx.common.CommandContext context = 1;
  string dependency_id = 2;
  ProjectDependencyEndpoint source = 3;
  ProjectDependencyEndpoint target = 4;
  ProjectDependencyKind kind = 5;
  string proposed_by_principal_id = 6;
}

message DecideProjectDependencyRequest {
  erpx.common.CommandContext context = 1;
  string dependency_id = 2;
  ProjectDependencySide side = 3;
  string owner_principal_id = 4;
  bool accept = 5;
}

message EndProjectDependencyRequest {
  erpx.common.CommandContext context = 1;
  string dependency_id = 2;
  string owner_principal_id = 3;
}

message ProposeProjectHandoffRequest {
  erpx.common.CommandContext context = 1;
  string handoff_id = 2;
  string project_id = 3;
  string node_id = 4;
  erpx.common.AuthorityScope scope = 5;
  ProjectHandoffKind kind = 6;
  string payload_digest = 7;
  string owner_principal_id = 8;
}

message ProjectHandoffActionRequest {
  erpx.common.CommandContext context = 1;
  string handoff_id = 2;
  optional string owner_receipt_id = 3;
  optional uint64 owner_record_version = 4;
  optional string rejection_reason = 5;
}

message GetProjectRequest {
  erpx.common.QueryContext context = 1;
  string project_id = 2;
}

enum ProjectRecordKind {
  PROJECT_RECORD_KIND_UNSPECIFIED = 0;
  PROJECT_RECORD_KIND_PHASE = 1;
  PROJECT_RECORD_KIND_ITEM = 2;
  PROJECT_RECORD_KIND_WORKFLOW_TEMPLATE = 3;
  PROJECT_RECORD_KIND_HANDOFF = 4;
}

message GetProjectRecordRequest {
  erpx.common.QueryContext context = 1;
  ProjectRecordKind record_kind = 2;
  string record_id = 3;
}

message ProjectRecordSummary {
  string record_id = 1;
  uint64 source_version = 2;
  ProjectRecordKind record_kind = 3;
  string title = 4;
  string lifecycle_status = 5;
  optional string project_id = 6;
  string updated_at = 7;
}

message GetProjectRecordResponse {
  optional ProjectRecordSummary record = 1;
  erpx.common.ProjectionMetadata projection = 2;
}

message ListProjectsRequest {
  erpx.common.QueryContext context = 1;
  uint32 page_size = 2;
  optional string cursor = 3;
}

message ProjectSummary {
  string project_id = 1;
  uint64 source_version = 2;
  erpx.common.AuthorityScope scope = 3;
  string code = 4;
  string name = 5;
  ProjectClass project_class = 6;
  ProjectStatus status = 7;
  string owner_principal_id = 8;
  string workflow_template_id = 9;
  uint64 workflow_template_version = 10;
  string updated_at = 11;
}

message ProjectNodeSummary {
  string node_id = 1;
  uint64 source_version = 2;
  optional string parent_node_id = 3;
  ProjectNodeKind kind = 4;
  string title = 5;
  string owner_principal_id = 6;
  repeated string assignee_principal_ids = 7;
  string workflow_state = 8;
  string core_state = 9;
  uint32 depth = 10;
}

message GetProjectResponse {
  optional ProjectSummary project = 1;
  erpx.common.ProjectionMetadata projection = 2;
}

message GetProjectGraphResponse {
  optional ProjectSummary project = 1;
  repeated ProjectNodeSummary nodes = 2;
  erpx.common.ProjectionMetadata projection = 3;
}

message ListProjectsResponse {
  repeated ProjectSummary projects = 1;
  optional string next_cursor = 2;
  erpx.common.ProjectionMetadata projection = 3;
}

service ProjectsCommandService {
  rpc CreateProject(CreateProjectRequest) returns (ProjectsMutationResponse);
  rpc TransitionProject(TransitionProjectRequest) returns (ProjectsMutationResponse);
  rpc AddNode(AddProjectNodeRequest) returns (ProjectsMutationResponse);
  rpc MoveNode(MoveProjectNodeRequest) returns (ProjectsMutationResponse);
  rpc TransitionNode(TransitionProjectNodeRequest) returns (ProjectsMutationResponse);
  rpc AttachNodeReference(AttachProjectNodeReferenceRequest) returns (ProjectsMutationResponse);
  rpc AddNodeAttachment(AddProjectNodeAttachmentRequest) returns (ProjectsMutationResponse);
  rpc RecordNodeTime(RecordProjectNodeTimeRequest) returns (ProjectsMutationResponse);
  rpc RecordNodeCost(RecordProjectNodeCostRequest) returns (ProjectsMutationResponse);
  rpc ProposeDependency(ProposeProjectDependencyRequest) returns (ProjectsMutationResponse);
  rpc DecideDependency(DecideProjectDependencyRequest) returns (ProjectsMutationResponse);
  rpc CancelDependency(EndProjectDependencyRequest) returns (ProjectsMutationResponse);
  rpc RevokeDependency(EndProjectDependencyRequest) returns (ProjectsMutationResponse);
  rpc ProposeHandoff(ProposeProjectHandoffRequest) returns (ProjectsMutationResponse);
  rpc ApproveHandoff(ProjectHandoffActionRequest) returns (ProjectsMutationResponse);
  rpc MarkHandoffReady(ProjectHandoffActionRequest) returns (ProjectsMutationResponse);
  rpc MarkHandoffUncertain(ProjectHandoffActionRequest) returns (ProjectsMutationResponse);
  rpc CancelHandoff(ProjectHandoffActionRequest) returns (ProjectsMutationResponse);
  rpc ReconcileHandoff(ProjectHandoffActionRequest) returns (ProjectsMutationResponse);
}

service ProjectsQueryService {
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc GetProjectGraph(GetProjectRequest) returns (GetProjectGraphResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetRecord(GetProjectRecordRequest) returns (GetProjectRecordResponse);
}
