syntax = "proto3";

package erpx.platform_administration.data_plane_agent;

import "erpx/platform_administration/data_plane.proto";

// Customer-hosted host-agent protocol. This infrastructure-only service is
// owned by Platform Administration and is intentionally outside the 65
// business Command/Query/Stream service catalog.
service DataPlaneAgentService {
  rpc Enroll(erpx.platform_administration.EnrollDataPlaneAgentRequest)
      returns (erpx.platform_administration.EnrollDataPlaneAgentResponse);
  rpc ReportObservation(erpx.platform_administration.ReportDataPlaneObservationRequest)
      returns (erpx.platform_administration.ReportDataPlaneObservationResponse);
  rpc Connect(stream erpx.platform_administration.DataPlaneAgentEnvelope)
      returns (stream erpx.platform_administration.ControlPlaneEnvelope);
}
