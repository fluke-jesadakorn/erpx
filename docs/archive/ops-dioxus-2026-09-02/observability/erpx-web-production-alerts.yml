groups:
  - name: erpx-web-production
    interval: 30s
    rules:
      - alert: ErpxServerUnavailable
        expr: erpx_server_up != 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: ERPX server is unavailable
          runbook: ops/runbooks/web-production-incident.md#server-unavailable

      - alert: ErpxWebHighServerErrorRate
        expr: |
          sum(rate(erpx_http_responses_total{class="5xx"}[5m]))
          /
          clamp_min(sum(rate(erpx_http_responses_total[5m])), 1) > 0.02
        for: 10m
        labels: { severity: high }
        annotations:
          summary: ERPX HTTP 5xx rate exceeds 2 percent
          runbook: ops/runbooks/web-production-incident.md#http-errors

      - alert: ErpxAuthenticationFailureSpike
        expr: sum(rate(erpx_auth_failures_total[5m])) > 5
        for: 10m
        labels: { severity: high }
        annotations:
          summary: ERPX authentication failures are elevated
          runbook: ops/runbooks/web-production-incident.md#authentication-failures

      - alert: ErpxProjectionLagHigh
        expr: max(erpx_projection_lag_seconds) > 60
        for: 10m
        labels: { severity: high }
        annotations:
          summary: ERPX projection lag exceeds the production objective
          runbook: ops/runbooks/web-production-incident.md#projection-lag

      - alert: ErpxProjectionDeadLetters
        expr: sum(erpx_projection_dead_letters) > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: ERPX projection dead letters are present
          runbook: ops/runbooks/web-production-incident.md#dead-letters

      - alert: ErpxAuditOutboxDeadLetters
        expr: sum(erpx_outbox_dead_letters) > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: ERPX audit or domain outbox dead letters are present
          runbook: ops/runbooks/web-production-incident.md#dead-letters

      - alert: ErpxWorkerHeartbeatStale
        expr: sum(erpx_worker_heartbeats{state="stale_or_unavailable"}) > 0
        for: 5m
        labels: { severity: high }
        annotations:
          summary: One or more ERPX worker heartbeats are stale
          runbook: ops/runbooks/web-production-incident.md#worker-heartbeat

      - alert: ErpxBackupEvidenceStale
        expr: time() - erpx_last_verified_backup_timestamp_seconds > 90000
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: ERPX has no verified backup within 25 hours
          runbook: ops/runbooks/web-production-recovery.md#backup-restore

      - alert: ErpxPitrEvidenceStale
        expr: time() - erpx_last_verified_pitr_timestamp_seconds > 2678400
        for: 30m
        labels: { severity: high }
        annotations:
          summary: ERPX PITR rehearsal is older than 31 days
          runbook: ops/runbooks/web-production-recovery.md#postgresql-pitr
