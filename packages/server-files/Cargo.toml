[package]
name = "erpx-server-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[package.metadata.erpx]
verification-roots = ["../../fixtures/files/rust-media", "../../scripts/testing/fixtures/generate-files-media-goldens.ts", "../../fixtures/files/preview", "../../scripts/testing/fixtures/generate-files-preview-goldens.ts", "../../fixtures/files/scan-lifecycle", "../../scripts/testing/fixtures/generate-files-scan-intents.mjs", "../../tests/support/files/scan-facts.rs"]

[features]
contracts = []
preview-provider = ["dep:libvips", "dep:pkg-config", "erpx-server-runtime/owned-process"]

[dependencies]
time.workspace = true
uuid.workspace = true
libvips = { workspace = true, optional = true }
erpx-server-shared.workspace = true
erpx-server-runtime.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "canonical_original"
path = "../../tests/unit/files/rust-canonical-original.test.rs"

[[test]]
name = "canonical_original_postgres"
path = "../../tests/integration/files/rust-canonical-original-postgres.test.rs"

[[test]]
name = "media_validation"
path = "../../tests/unit/files/rust-media-validation.test.rs"

[[test]]
name = "malware_scanner"
path = "../../tests/unit/files/rust-malware-scanner.test.rs"

[[test]]
name = "clamav_provider"
path = "../../tests/provider/files/rust-clamav.test.rs"

[lints]
workspace = true

[build-dependencies]
pkg-config = { workspace = true, optional = true }

[[bin]]
name = "erpx-render-preview"
path = "src/adapters/preview_cli.rs"
required-features = ["preview-provider"]

[[test]]
name = "preview"
path = "../../tests/unit/files/rust-preview.test.rs"

[[test]]
name = "preview_provider"
path = "../../tests/provider/files/rust-preview-provider.test.rs"
required-features = ["preview-provider"]

[[bin]]
name = "erpx-preview-tool-fixture"
path = "../../tests/support/files/preview-tool-fixture.rs"
required-features = ["preview-provider", "contracts"]

[[test]]
name = "preview_process"
path = "../../tests/provider/files/rust-preview-process.test.rs"
required-features = ["preview-provider", "contracts"]

[[test]]
name = "attachment_scan_policy"
path = "../../tests/unit/files/rust-attachment-scan-policy.test.rs"

[[test]]
name = "sanitization_io"
path = "../../tests/unit/files/rust-sanitization-io.test.rs"

[[test]]
name = "attachment_scan_postgres"
path = "../../tests/integration/files/rust-attachment-scan-postgres.test.rs"
