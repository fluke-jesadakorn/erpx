[package]
name = "erpx-server-collaboration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[package.metadata.erpx]
verification-roots = ["../../fixtures/collaboration/rust-maintenance-notifications", "../../scripts/testing/fixtures/generate-collaboration-notifications-oracle.ts", "src/adapters/maintenance-notifications.ts", "../server-maintenance/src/adapters/collaboration-notification-snapshot-sources.ts"]

[features]
push-provider = ["dep:ring", "dep:base64", "dep:url", "dep:reqwest", "dep:rustls", "dep:webpki-roots"]

[dependencies]
ring = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
url = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
erpx-server-shared.workspace = true
erpx-server-runtime.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
uuid.workspace = true

[[test]]
name = "maintenance_notifications"
path = "../../tests/unit/collaboration/rust-maintenance-notifications.test.rs"

[[test]]
name = "maintenance_notifications_postgres"
path = "../../tests/integration/collaboration/rust-maintenance-notifications-postgres.test.rs"

[lints]
workspace = true

[[test]]
name = "service_count_flow_notification_postgres"
path = "../../tests/integration/collaboration/rust-service-count-flow-notification-postgres.test.rs"

[[test]]
name = "collaboration_work"
path = "../../tests/unit/collaboration/rust-collaboration-work.test.rs"

[[test]]
name = "collaboration_work_postgres"
path = "../../tests/integration/collaboration/rust-collaboration-work-postgres.test.rs"
