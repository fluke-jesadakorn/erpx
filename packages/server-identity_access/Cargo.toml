[package]
name = "erpx-server-identity-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[package.metadata.erpx]
verification-roots = ["../../fixtures/identity_access/account-security", "../../scripts/testing/fixtures/generate-account-security-oracle.ts", "resources", "../../fixtures/identity_access/permissions", "../../scripts/testing/fixtures/generate-work-admission-oracle.ts"]

[lib]
path = "src/lib.rs"

[features]
contracts = ["dep:ts-rs", "dep:utoipa"]
mail-resend = ["dep:reqwest", "dep:rustls", "dep:webpki-roots"]
mail-smtp = ["dep:lettre"]
mail-providers = ["mail-resend", "mail-smtp"]

[dependencies]
futures-util.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
base64.workspace = true
url.workspace = true
ring.workspace = true
subtle.workspace = true
erpx-server-shared.workspace = true
erpx-server-organization.workspace = true
erpx-server-people-payroll.workspace = true
erpx-server-runtime.workspace = true
erpx-server-manage-erpx.workspace = true
argon2.workspace = true
getrandom.workspace = true
sha2.workspace = true
hex.workspace = true
time.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio.workspace = true
sqlx.workspace = true
ts-rs = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
uuid.workspace = true
tower.workspace = true

[[example]]
name = "export-account-contracts"
path = "../../scripts/docs/export-account-contracts.rs"
required-features = ["contracts"]

