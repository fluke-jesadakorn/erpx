[package]
name = "erpx-server-legal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "erpx-validate-pdf"
path = "src/main.rs"

[features]
default = []
vendored-openssl = ["openssl/vendored"]

[dependencies]
openssl.workspace = true
lopdf.workspace = true
cms.workspace = true
der.workspace = true
x509-cert.workspace = true
x509-tsp.workspace = true
x509-ocsp.workspace = true
const-oid.workspace = true
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[[test]]
name = "pdf_validation"
path = "../../tests/unit/legal/rust-pdf-validation.test.rs"

[lints]
workspace = true
