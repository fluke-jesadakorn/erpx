[package]
name = "erpx-collaboration-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[package.metadata.erpx]
verification-roots = ["../../../fixtures/collaboration/rust-maintenance-notifications"]

[features]
push-provider = ["dep:ring", "dep:base64", "dep:reqwest", "dep:rustls", "dep:webpki-roots"]

[dependencies]
ring = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
url.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
erpx-platform-shared-server.workspace = true
erpx-platform-runtime-server.workspace = true
erpx-commercial-server.workspace = true
erpx-organization-server.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tokio.workspace = true
uuid.workspace = true
erpx-quality-server.workspace = true
erpx-identity-access-server.workspace = true
erpx-crm-server.workspace = true

