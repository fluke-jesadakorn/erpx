<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{app_title}</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b1117;
        font-family: Inter, "Noto Sans Thai", Tahoma, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #dx-toast {
        position: fixed;
        inset: 1rem 1rem auto auto;
        z-index: 2147483647;
        max-width: min(24rem, calc(100vw - 2rem));
        transition: opacity 120ms ease, transform 120ms ease;
      }

      #dx-toast[aria-hidden="true"] {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-0.5rem);
      }

      #erpx-bootstrap {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        color: #f1f5f9;
        background:
          radial-gradient(circle at 25% 20%, rgb(103 232 249 / 14%), transparent 30%),
          #0b1117;
      }

      .erpx-bootstrap-card {
        display: grid;
        width: min(100%, 28rem);
        justify-items: center;
        gap: 0.9rem;
        border: 1px solid #2d4453;
        border-radius: 1rem;
        padding: 2rem;
        box-sizing: border-box;
        background: #111a22;
        text-align: center;
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 28%);
      }

      .erpx-bootstrap-mark {
        display: grid;
        width: 2.75rem;
        height: 2.75rem;
        place-items: center;
        border: 1px solid #67e8f9;
        border-radius: 0.75rem;
        color: #67e8f9;
        font-weight: 800;
      }

      .erpx-bootstrap-spinner {
        width: 1.5rem;
        height: 1.5rem;
        border: 0.18rem solid #2d4453;
        border-top-color: #67e8f9;
        border-radius: 999px;
        animation: erpx-bootstrap-spin 800ms linear infinite;
      }

      .erpx-bootstrap-card h1 { margin: 0; font-size: 1.25rem; }
      .erpx-bootstrap-card p { margin: 0; color: #a8bac7; font-size: 0.875rem; line-height: 1.6; }
      .erpx-bootstrap-retry {
        min-height: 2.5rem;
        border: 1px solid #3b5667;
        border-radius: 0.65rem;
        padding: 0.55rem 0.9rem;
        color: #f1f5f9;
        background: #1b2833;
        cursor: pointer;
      }
      .erpx-bootstrap-retry[hidden] { display: none; }
      html[data-locale="th"] .erpx-copy-en,
      html:not([data-locale="th"]) .erpx-copy-th { display: none; }

      @keyframes erpx-bootstrap-spin { to { transform: rotate(360deg); } }

      #dx-toast-inner {
        display: grid;
        grid-template-columns: 0.35rem 1fr;
        overflow: hidden;
        color: #f1f5f9;
        background: #111a22;
        border: 1px solid #3b4f5e;
        border-radius: 0.75rem;
        box-shadow: 0 1rem 2rem rgb(0 0 0 / 32%);
      }

      #dx-toast-decor {
        background: #67e8f9;
      }

      #dx-toast-decor.success {
        background: #4ade80;
      }

      #dx-toast-decor.error {
        background: #f87171;
      }

      .dx-toast-content {
        padding: 0.75rem 0.9rem;
      }

      #dx-toast-text,
      #dx-toast-msg {
        margin: 0;
      }

      #dx-toast-text {
        font-size: 0.875rem;
      }

      #dx-toast-msg {
        margin-top: 0.25rem;
        color: #a8bac7;
        font-size: 0.75rem;
        line-height: 1.4;
      }

      @media (prefers-reduced-motion: reduce) {
        #dx-toast {
          transition: none;
        }
      }
    </style>
    <script>
      (() => {
        const storageKey = "SCHEDULED-DX-TOAST";
        const localeKey = "erpx.ui.locale.v1";
        const copy = {
          en: {
            developmentServer: "ERPX development server",
            rebuilding: "The console is rebuilding.",
          },
          th: {
            developmentServer: "เซิร์ฟเวอร์พัฒนา ERPX",
            rebuilding: "คอนโซลกำลังสร้างใหม่",
          },
        };
        let closeTimer;

        let locale = "en";
        try {
          const stored = String(localStorage.getItem(localeKey) ?? "").toLowerCase();
          if (stored === "th") {
            locale = "th";
          } else if (stored === "en") {
            locale = "en";
          } else {
            const deviceLanguages = Array.isArray(navigator.languages) && navigator.languages.length
              ? navigator.languages
              : [navigator.language];
            if (deviceLanguages.some((language) => String(language ?? "").toLowerCase().startsWith("th"))) {
              locale = "th";
            }
          }
        } catch (_) {
          locale = String(navigator.language ?? "").toLowerCase().startsWith("th") ? "th" : "en";
        }
        document.documentElement.lang = locale;
        document.documentElement.dataset.locale = locale;

        window.closeDXToast = () => {
          const toast = document.getElementById("dx-toast");
          if (toast) toast.setAttribute("aria-hidden", "true");
          if (closeTimer) window.clearTimeout(closeTimer);
        };

        window.showDXToast = (heading, message, level, durationMs) => {
          const toast = document.getElementById("dx-toast");
          const title = document.getElementById("dx-toast-text");
          const body = document.getElementById("dx-toast-msg");
          const decor = document.getElementById("dx-toast-decor");
          if (!toast || !title || !body || !decor) return;
          title.textContent = String(heading ?? copy[locale].developmentServer);
          body.textContent = String(message ?? copy[locale].rebuilding);
          decor.className = String(level ?? "info");
          toast.removeAttribute("aria-hidden");
          if (closeTimer) window.clearTimeout(closeTimer);
          closeTimer = window.setTimeout(window.closeDXToast, Number(durationMs) || 5000);
        };

        window.scheduleDXToast = (heading, message, level, durationMs) => {
          try {
            sessionStorage.setItem(
              storageKey,
              JSON.stringify({ heading, message, level, durationMs }),
            );
          } catch (_) {
            // The development notice is non-essential and may fail closed.
          }
        };

        window.addEventListener("DOMContentLoaded", () => {
          const bootstrap = document.getElementById("erpx-bootstrap");
          const bootstrapStatus = document.getElementById("erpx-bootstrap-status");
          const bootstrapRetry = document.getElementById("erpx-bootstrap-retry");
          const main = document.getElementById("main");
          const dismissBootstrapWhenMounted = () => {
            const appSurface = main?.querySelector(":scope > main, :scope > .ui-shell, :scope > .sign-in-surface");
            if (!bootstrap?.isConnected || !appSurface) return false;
            bootstrap.remove();
            return true;
          };
          const mountObserver = new MutationObserver(() => {
            if (dismissBootstrapWhenMounted()) mountObserver.disconnect();
          });
          if (main && !dismissBootstrapWhenMounted()) {
            mountObserver.observe(main, { childList: true });
          }
          if (bootstrapRetry) {
            bootstrapRetry.addEventListener("click", () => window.location.reload());
          }
          window.setTimeout(() => {
            if (!bootstrap?.isConnected) return;
            bootstrap.dataset.delayed = "true";
            if (bootstrapStatus) {
              bootstrapStatus.querySelector(".erpx-copy-en").textContent =
                "The first development load downloads the application runtime over Tailscale and may take a little longer.";
              bootstrapStatus.querySelector(".erpx-copy-th").textContent =
                "การเปิด dev ครั้งแรกต้องดาวน์โหลด application runtime ผ่าน Tailscale จึงอาจใช้เวลานานขึ้นเล็กน้อย";
            }
            if (bootstrapRetry) bootstrapRetry.hidden = false;
          }, 8000);

          try {
            const scheduled = sessionStorage.getItem(storageKey);
            if (!scheduled) return;
            sessionStorage.removeItem(storageKey);
            const notice = JSON.parse(scheduled);
            window.showDXToast(
              notice.heading,
              notice.message,
              notice.level,
              notice.durationMs,
            );
          } catch (_) {
            // Ignore malformed or unavailable development-only state.
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="dx-toast" role="status" aria-live="polite" aria-hidden="true">
      <div id="dx-toast-inner">
        <div id="dx-toast-decor" class="info" aria-hidden="true"></div>
        <div class="dx-toast-content">
          <strong id="dx-toast-text"></strong>
          <p id="dx-toast-msg"></p>
        </div>
      </div>
    </div>
    <div id="main">
      <div id="erpx-bootstrap" role="status" aria-live="polite">
        <div class="erpx-bootstrap-card">
          <div class="erpx-bootstrap-mark" aria-hidden="true">ER</div>
          <div class="erpx-bootstrap-spinner" aria-hidden="true"></div>
          <h1>
            <span class="erpx-copy-en">Loading ERPX Platform</span>
            <span class="erpx-copy-th">กำลังโหลด ERPX Platform</span>
          </h1>
          <p id="erpx-bootstrap-status">
            <span class="erpx-copy-en">Establishing the secure console session…</span>
            <span class="erpx-copy-th">กำลังเชื่อมต่อ secure console…</span>
          </p>
          <button id="erpx-bootstrap-retry" class="erpx-bootstrap-retry" type="button" hidden>
            <span class="erpx-copy-en">Retry</span>
            <span class="erpx-copy-th">ลองใหม่</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
