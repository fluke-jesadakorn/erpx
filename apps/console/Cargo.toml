[package]
name = "erpx-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["web"]
web-split = ["dioxus/wasm-split"]
web = [
    "dioxus/web",
    "dioxus/fullstack",
    "dioxus/router",
    "dioxus/lib",
    "dioxus/launch",
    "dioxus/devtools",
    "erpx-ui-core/web",
    "erpx-ui-kit/web",
    "dep:reqwest",
]
server = [
    "dioxus/server",
    "dioxus/fullstack",
    "dioxus/router",
    "dioxus/lib",
    "dioxus/launch",
    "dep:base64",
    "dep:erpx-web-session",
    "dep:erpx-web-session-sqlx",
    "dep:reqwest",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:erpx-console-bff",
]
native = [
    "dioxus/native",
    "dioxus/router",
    "dioxus/lib",
    "dioxus/launch",
    "dioxus/devtools",
    "dep:reqwest",
    "dep:tokio",
]

[dependencies]
async-trait.workspace = true
base64 = { workspace = true, optional = true }
chrono.workspace = true
dioxus = { workspace = true, features = ["signals"] }
