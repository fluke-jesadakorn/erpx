<title>ERPX — Social ERP Mockup</title>

<style>
:root{--background:#fff;--foreground:#09090b;--card:#fff;--primary:#6758e5;--primary-fg:#fff;
--secondary:#f4f4f5;--muted:#f4f4f5;--muted-fg:#71717a;--accent:#eeeafe;--destructive:#ef4444;
--border:#e4e4e7;--success:#16a34a;--warning:#d97706;--info:#0284c7;--radius:10px}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
background:var(--background);color:var(--foreground);font-size:14px}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:280px;flex:none;background:var(--card);border-right:1px solid var(--border);
display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:20px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--primary);color:#fff;
display:flex;align-items:center;justify-content:center;font-weight:700}
.brand b{font-size:16px}.nav{padding:0 12px 12px;display:flex;flex-direction:column;gap:2px}
.nav .g{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg);
padding:12px 12px 4px}
.nitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted-fg);font-weight:500}
.nitem svg{flex:none}.nitem:hover{background:var(--secondary)}
.nitem.on{background:var(--accent);color:var(--foreground)}
.nitem.on svg{color:var(--primary)}
.side .ft{margin-top:auto;padding:16px;border-top:1px solid var(--border);color:var(--muted-fg);font-size:13px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:var(--card);border-bottom:1px solid var(--border);
display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:5}
.search{display:flex;align-items:center;gap:8px;background:var(--muted);border-radius:8px;
padding:8px 14px;width:360px;max-width:40vw;color:var(--muted-fg)}
.search input{border:0;background:none;outline:none;width:100%;font:inherit;color:var(--foreground)}
.top .sp{flex:1}.iconbtn{position:relative;border:1px solid var(--border);background:var(--card);
border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.iconbtn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--destructive)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;
display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.dd{position:absolute;top:60px;right:24px;width:340px;background:var(--card);border:1px solid var(--border);
border-radius:var(--radius);box-shadow:0 12px 32px rgba(0,0,0,.12);padding:8px;display:none;z-index:9}
.dd.open{display:block}.dd h4{margin:6px 10px;font-size:13px;color:var(--muted-fg)}
.nrow{display:flex;gap:10px;padding:10px;border-radius:8px;align-items:flex-start}
.nrow:hover{background:var(--muted)}.nrow small{color:var(--muted-fg)}
.content{padding:28px;display:flex;gap:24px;align-items:flex-start;max-width:1240px;width:100%;margin:0 auto}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.rail{width:340px;flex:none;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h3{margin:0 0 4px;font-size:16px}.muted{color:var(--muted-fg)}
h1{font-size:24px;margin:0}.sub{color:var(--muted-fg);margin:6px 0 0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* buttons/badges/chips */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;
font-weight:500;background:var(--primary);color:var(--primary-fg)}
.btn.sec{background:var(--secondary);color:var(--foreground)}
.btn.gho{background:none;color:var(--muted-fg)}
.btn.dan{background:var(--destructive);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}
.b-ok{background:var(--success);color:#fff}.b-warn{background:var(--warning);color:#fff}
.b-def{background:var(--secondary);color:var(--foreground)}
.b-out{background:var(--card);border:1px solid var(--border);color:var(--muted-fg)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--primary);
border-radius:8px;padding:4px 10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;margin:2px 4px 2px 0}
.scope{display:inline-flex;align-items:center;gap:6px;background:var(--muted);color:var(--muted-fg);
border-radius:8px;padding:6px 10px;font-size:12px}
/* metrics */
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.met{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px}
.met small{color:var(--muted-fg);font-size:13px}.met b{display:block;font-size:26px;margin-top:4px}
/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:13px;color:var(--muted-fg);background:var(--muted);padding:10px 16px}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px}
.tbl tr:last-child td{border-bottom:0}.tbl tr[data-href]{cursor:pointer}
.tbl tr[data-href]:hover td{background:var(--muted)}
/* feed */
.lane{border:1px solid var(--border);border-left:4px solid var(--warning);border-radius:var(--radius);
background:var(--card);padding:14px 16px}
.lane b{font-size:13px}.lane .why{font-size:12px;color:var(--muted-fg)}
.post{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.post .ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post .ph .avatar{border-radius:8px}
.post .pt{font-weight:600}.post .pm{font-size:12px;color:var(--muted-fg)}
.post .pb{margin:8px 0}.post .pf{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.react{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 12px;
font-size:13px;color:var(--muted-fg);display:inline-flex;gap:6px;align-items:center}
.react.on{background:var(--accent);color:var(--primary);border-color:var(--primary)}
.cmt{border-top:1px solid var(--border);margin-top:12px;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.cmt .c{background:var(--muted);border-radius:8px;padding:8px 12px;font-size:13px}
.cmt .c b{font-size:13px}
.composer{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);
border-radius:var(--radius);padding:12px 16px}
.composer input{flex:1;border:0;outline:none;font:inherit}
.ai{border:1px dashed var(--primary)}
.ai .prov{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted-fg)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.kv small{color:var(--muted-fg);font-size:12px;display:block}.kv b{font-size:14px;font-weight:500}
.tagrow{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:13px;background:var(--card)}
.tag b{color:var(--primary)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#09090b;color:#fff;
padding:12px 20px;border-radius:10px;display:none;z-index:50;font-size:14px}
.menu{display:none}
@media(max-width:1100px){.rail{display:none}.mets{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.side{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:.2s}
body.navopen .side{transform:none}.menu{display:inline-flex}.content{padding:16px}.mets{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
