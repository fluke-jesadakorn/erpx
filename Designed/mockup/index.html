<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {
      border: "hsl(var(--border))", input: "hsl(var(--input))", ring: "hsl(var(--ring))",
      background: "hsl(var(--background))", foreground: "hsl(var(--foreground))",
      primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
      secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))" },
      muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
      accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
      destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--destructive-foreground))" },
      card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))" },
      popover: { DEFAULT: "hsl(var(--popover))", foreground: "hsl(var(--popover-foreground))" },
    },
    borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
    fontFamily: { sans: ["Inter","-apple-system","Segoe UI","Roboto","Noto Sans Thai","sans-serif"],
      mono: ["ui-monospace","Menlo","monospace"] },
    boxShadow: { soft: "0 1px 2px rgba(28,20,12,.06)",
      lift: "0 2px 8px rgba(28,20,12,.10)" },

<style>
/* shadcn token system — paper + ink + persimmon (flat editorial, no gradients) */
:root{--background:36 30% 97%;--foreground:24 14% 13%;--card:0 0% 100%;--card-foreground:24 14% 13%;
--popover:0 0% 100%;--popover-foreground:24 14% 13%;--primary:12 64% 42%;--primary-foreground:36 40% 98%;
--secondary:36 22% 93%;--secondary-foreground:24 14% 18%;--muted:36 20% 93%;--muted-foreground:24 8% 42%;
--accent:14 55% 92%;--accent-foreground:12 64% 35%;--destructive:0 70% 48%;--destructive-foreground:0 0% 98%;
--border:30 14% 87%;--input:30 14% 82%;--ring:12 64% 42%;--radius:.625rem;
--success:150 55% 32%;--warning:32 95% 44%;--info:199 89% 40%}
.dark{--background:24 13% 9%;--foreground:36 18% 89%;--card:24 11% 13%;--card-foreground:36 18% 89%;
--popover:24 11% 13%;--popover-foreground:36 18% 89%;--primary:14 70% 58%;--primary-foreground:24 13% 10%;
--secondary:24 9% 19%;--secondary-foreground:36 18% 89%;--muted:24 9% 16%;--muted-foreground:30 9% 60%;
--accent:14 32% 22%;--accent-foreground:14 72% 74%;--destructive:0 62% 54%;--destructive-foreground:0 0% 98%;
--border:24 9% 21%;--input:24 9% 21%;--ring:14 70% 58%;
--success:150 48% 48%;--warning:32 95% 55%;--info:199 89% 60%}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
/* mesh backdrop + motion + bits utilities can't express cleanly */
.mesh{background-color:hsl(var(--background))}
.dark .mesh{background-color:hsl(var(--background))}
.anim{animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
.anim-d1{animation-delay:.05s}.anim-d2{animation-delay:.1s}.anim-d3{animation-delay:.15s}
.anim-d4{animation-delay:.2s}.anim-d5{animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop2{40%{transform:scale(1.45)}}
.react.pop svg{animation:pop2 .3s ease}
.pulse{width:8px;height:8px;border-radius:50%;background:#34d399;flex:none;
  box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pl 2.2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.side-ink{background:#1c1814}
.nitem{transition:.15s}
.nitem.on{background:rgba(255,255,255,.08);color:#fff!important;

.composer-glow:focus-within{border-color:hsl(var(--primary))!important;
  box-shadow:0 0 0 3px hsl(var(--primary)/.15)}

.tblrow:hover td{background:hsl(var(--accent)/.45)}

.met{position:relative;overflow:hidden}
.met::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:hsl(var(--primary))}
.lucide{flex:none}
.badge-dot::before{content:"";height:6px;width:6px;border-radius:50%;background:currentColor}
/* deep layer */
.stepper{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px}
.sdot{width:26px;height:26px;border-radius:50%;border:1.5px solid hsl(var(--border));background:hsl(var(--card));
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:hsl(var(--muted-foreground));flex:none}
.step.done .sdot{background:hsl(var(--primary));border-color:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.step.cur .sdot{border-color:hsl(var(--primary));color:hsl(var(--primary));box-shadow:0 0 0 3px hsl(var(--primary)/.18)}
.step.neg .sdot{border-color:hsl(var(--destructive));color:hsl(var(--destructive))}
.slab{font-size:12px;font-weight:600;color:hsl(var(--muted-foreground))}
.step.cur .slab{color:hsl(var(--foreground))}
.sline{width:26px;height:1.5px;background:hsl(var(--border));margin:0 7px;flex:none}
.edgechip{display:inline-flex;align-items:center;gap:7px;background:hsl(var(--card));border:1px solid hsl(var(--border));

.storyrow{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.story{flex:none;width:118px;border-radius:14px;border:1px solid hsl(var(--border));background:hsl(var(--card));padding:10px;cursor:pointer;transition:.15s;box-shadow:0 1px 2px rgba(28,20,12,.06)}
.story:hover{transform:translateY(-2px);box-shadow:0 2px 8px rgba(28,20,12,.10);border-color:hsl(var(--primary))}
.story .ring{width:44px;height:44px;border-radius:50%;padding:2.5px;background:conic-gradient(hsl(var(--primary)),hsl(var(--warning)),hsl(var(--primary)));margin-bottom:8px}
.story .ring>span{display:flex;width:100%;height:100%;border-radius:50%;background:hsl(var(--card));align-items:center;justify-content:center;border:2px solid hsl(var(--card))}

.pact{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:1;border-radius:9px;padding:8px 6px;font-size:13px;font-weight:600;color:hsl(var(--muted-foreground));border:0;background:none;transition:.13s}
.pact:hover{background:hsl(var(--muted));color:hsl(var(--primary))}
.pact.on{color:hsl(var(--primary))}
.cover{display:flex;align-items:center;gap:14px;border-radius:18px;border:1px solid hsl(var(--border));background:hsl(var(--card));padding:18px 20px;box-shadow:0 1px 2px rgba(28,20,12,.06)}
.cicon{width:52px;height:52px;flex:none;border-radius:15px;display:flex;align-items:center;justify-content:center;background:hsl(var(--primary));color:hsl(var(--primary-foreground));box-shadow:0 1px 2px rgba(28,20,12,.25)}
.contact{display:flex;align-items:center;gap:10px;border-radius:10px;padding:7px 9px;transition:.13s;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit;color:inherit}
.contact:hover{background:hsl(var(--muted))}
.dot{width:9px;height:9px;border-radius:50%;background:#31a24c;border:2.5px solid hsl(var(--card));margin-left:-16px;margin-top:20px;flex:none}
#dock{position:fixed;right:18px;bottom:18px;z-index:65;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#chatpanel{position:fixed;right:18px;bottom:86px;z-index:66;width:330px;max-width:calc(100vw - 36px);border-radius:16px;border:1px solid hsl(var(--border));background:hsl(var(--card));box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden}
.chathead{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;border:2.5px solid hsl(var(--card))}
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;border-top:1px solid hsl(var(--border));background:hsl(var(--card)/.92);backdrop-filter:blur(14px);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#bottombar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:10px;font-size:10.5px;font-weight:600;color:hsl(var(--muted-foreground));text-decoration:none}
#bottombar a.on{color:hsl(var(--primary))}
.skel{position:relative;overflow:hidden;background:hsl(var(--muted));border-radius:10px;min-height:14px}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,hsl(var(--card)/.7),transparent);animation:sh 1.1s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.prog{height:6px;border-radius:99px;background:hsl(var(--muted));overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:hsl(var(--primary))}
@media(max-width:1100px){.fbtabs a{padding:0 10px}.fbtabs a span.lbl{display:none}}
@media(max-width:820px){#bottombar{display:flex}#dock{bottom:76px}}
@media(prefers-reduced-motion:reduce){.anim{animation:none}.skel::after{animation:none}}
:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px}
</style>
<style>
.btn-primary{display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:10px 18px;
  font-weight:600;font-size:13.5px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));

.btn-sec:hover{transform:translateY(-1px);border-color:hsl(var(--primary));color:hsl(var(--primary))}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9px;background:hsl(var(--accent));

.input{width:100%;border-radius:11px;border:1px solid hsl(var(--input));background:hsl(var(--muted));

<script>
"use strict";
/* ---------- data (from docs/plan/MAP.md + 02/03 specs + 04-social-paradigm.md) ---------- */
const GROUPS=[
/* Real business departments, ordered by daily-use priority (money-in first, systems last).
   Contexts inside each dept follow the real workflow order (e.g. Sales: POS checkout → quote → online → pipeline). */
["Sales & Revenue",["pos","sales","ecommerce","crm"],"shopping-cart"],
["Marketing & Brand",["marketing","brand"],"megaphone"],
["Customer & Service",["customer_360","support","field_service","customer_authority"],"life-buoy"],
["Operations & Supply",["planning","procurement","inventory","operations","manufacturing","projects"],"boxes"],
["Quality & Assets",["quality","maintenance","assets"],"badge-check"],
["Finance & Legal",["commercial","finance","legal"],"wallet"],
["People & Talent",["talent","people_payroll","learning","benefits"],"users"],
["Platform & IT",["organization","identity_access","platform_administration","agent","collaboration"],"server"]];
function groupOf(ctx){return GROUPS.findIndex(g=>g[1].includes(ctx))}
let NAVCOL={};try{NAVCOL=JSON.parse(localStorage.getItem("erpx-nav")||"{}")||{}}catch(e){NAVCOL={}}
let lastGi=-1;
function saveNav(){try{localStorage.setItem("erpx-nav",JSON.stringify(NAVCOL))}catch(e){}}
/* lucide icon per context (lucide@latest UMD) */
const LICON={brand:"palette",commercial:"credit-card",identity_access:"shield-check",organization:"building-2",
platform_administration:"server",customer_360:"users",customer_authority:"key-round",support:"life-buoy",
finance:"wallet",sales:"file-text",pos:"shopping-cart",assets:"package",inventory:"boxes",maintenance:"wrench",

rail.innerHTML=`<div class="card anim !p-4"><h3 class="mb-1 text-[15px] font-bold">Your events</h3><p class="text-[13px] text-muted-foreground">2 going · 1 maybe · invites from followed groups land here.</p></div>`;bindCommon();bindFeed();icons();return}
location.hash="#/today"}
function bindCommon(){
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>say("Demo — wired to owner command + HumanDecisionProof in production"));
document.querySelectorAll("[data-proof]").forEach(b=>b.onclick=()=>say("HumanDecisionProof required — demo only"));
document.querySelectorAll("[data-href]").forEach(tr=>tr.onclick=()=>{dd.classList.add("hidden");const rd=$("roledd");if(rd)rd.classList.add("hidden");location.hash=tr.dataset.href});
document.querySelectorAll("[data-pill]").forEach(p=>p.onclick=()=>{feedFilter=p.dataset.pill;views("feed")});
document.querySelectorAll("[data-count]").forEach(el=>countUp(el,el.dataset.count));
document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const[k,id,label,to,proof]=b.dataset.act.split("|");doAct(k,id,label,to,proof==="1")});
document.querySelectorAll("[data-emv]").forEach(b=>b.onclick=()=>{const[k,id,i,d]=b.dataset.emv.split("|");const es=EDGES[k];const j=+i+ +d;
  if(j>=0&&j<es.length){const t=es[i];es[i]=es[j];es[j]=t;audit(k,id).unshift({by:"You",t:"Reordered reference chips (explicit).",time:"now"});views((location.hash||"").replace("#/",""));icons()}});
document.querySelectorAll("[data-sug]").forEach(b=>b.onclick=()=>{const[key,op]=b.dataset.sug.split(/\|(?=[^|]*$)/);
  if(op==="rerun"){SUG[key]={st:"Running"};views((location.hash||"").replace("#/",""));icons();
    setTimeout(()=>{SUG[key]={st:"Ready",d:Math.floor(Math.random()*65536).toString(16)};views((location.hash||"#/today").replace("#/",""));icons()},900);return}
  if(op==="drift"){SUG[key]={st:"Conflicted"};say("Source drifted — suggestion Conflicted, nothing applied")}
  else if(op==="apply"){const[k,id]=key.split("#")[0].split("/");
  if(!canAct(k,1)){say(`Requires ${needRole(k)} — you are ${roleLabel(ME.role)}. Switch role via avatar.`);return}
  SUG[key]={st:"Applied",d:"a1b2"};audit(k,id).unshift({by:"You",t:"Applied AI suggestion · version re-validated, digest a1b2.",time:"now"});say("Applied — version re-validated")}
  else{SUG[key]={st:"Rejected"};say("Rejected — nothing written")}
  views((location.hash||"#/today").replace("#/",""));icons()});
document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{const[k,id]=b.dataset.save.split("|");const o=formVal(k);if(!o)return;
  audit(k,id).unshift({by:"You",t:`Fields saved (${Object.keys(o).length} per schema, digested).`,time:"now"});say("Fields saved — audited");views((location.hash||"").replace("#/",""));icons()});
document.querySelectorAll("[data-bool]").forEach(b=>b.onclick=()=>{b.textContent=b.textContent==="On"?"Off":"On"});
document.querySelectorAll("[data-rpost]").forEach(b=>b.onclick=()=>{const[k,id]=b.dataset.rpost.split("|");
  const i=document.querySelector(`[data-rci="${k}|${id}"]`);if(i&&i.value.trim()){audit(k,id).unshift({by:"You",t:i.value.trim()+" (typed @, audited)",time:"now"});say("Comment posted (typed @, audited)");views((location.hash||"").replace("#/",""));icons()}});
document.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>openForm(b.dataset.new));
document.querySelectorAll("[data-lane]").forEach(b=>b.onclick=()=>{const[ctx,id,label,proof]=b.dataset.lane.split("|");
  if(!canAct(ctx,proof==="1")){say(`Requires ${needRole(ctx)} — you are ${roleLabel(ME.role)}. Switch role via avatar.`);return}
  DONE_LANE[ctx+id]=label;audit(ctx,id).unshift({by:"You",t:`${label} from approval lane${proof==="1"?" · HumanDecisionProof attached":""}.`,time:"now"});
  FEED.unshift({ctx,t:`${id} ${label.toLowerCase()} — proof attached.`,tags:CTX[ctx].tags.slice(0,1),time:"0m",likes:0,by:"You",av:"YO",rr:id,cm:[]});
  const left=myLanes().length;say((proof==="1"?"Proof attached — approved":"Done")+(left?` · ${left} more waiting`:" · queue clear"));views((location.hash||"#/today").replace("#/",""));icons()});
document.querySelectorAll("[data-lane-all]").forEach(b=>b.onclick=()=>{const ls=myLanes();if(!ls.length)return;let n=0;
  for(const l of ls){if(!canAct(l.ctx,1))continue;DONE_LANE[l.ctx+l.id]="Approved";audit(l.ctx,l.id).unshift({by:"You",t:"Approved from Approve-all · HumanDecisionProof attached.",time:"now"});n++}
  if(!n){say(`Requires decision roles — you are ${roleLabel(ME.role)}. Switch role via avatar.`);return}
  FEED.unshift({ctx:"collaboration",t:`${n} approval${n===1?"":"s"} cleared in one go — proofs attached.`,tags:["#win"],time:"0m",likes:0,by:"You",av:"YO",rr:null,cm:[]});
  say(`Proof attached — ${n} approved${myLanes().length?` · ${myLanes().length} more waiting`:" · queue clear"}`);views((location.hash||"#/today").replace("#/",""));icons()});
document.querySelectorAll("[data-contact]").forEach(b=>b.onclick=()=>{setRole(b.dataset.contact)});
document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>say("You're going (demo) — posted to feed"));
bindAt(document)}
function bindFeed(){
document.querySelectorAll("[data-like]").forEach(b=>b.onclick=()=>{const s=b.querySelector("span");let n=parseInt(s.textContent);const on=b.classList.toggle("on");s.textContent=n+(on?1:-1);b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");say(on?"Reaction recorded (signal only — moves no workflow)":"Reaction removed")});
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const d=document.getElementById("cm"+b.dataset.c);d.classList.toggle("hidden");d.classList.toggle("flex")});
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const on=b.classList.toggle("on");b.innerHTML=on?'<i data-lucide="check" class="h-[15px] w-[15px]"></i> Following':'<i data-lucide="plus" class="h-[15px] w-[15px]"></i> Follow';icons();say(on?"Following — feed + notifications on":"Unfollowed")});
document.querySelectorAll("[data-post]").forEach(b=>b.onclick=()=>{const i=document.querySelector(`[data-ci="${b.dataset.post}"]`);if(i&&i.value.trim()){say("Comment posted (typed @, audited)");i.value=""}});
const cp=$("composer");if(cp){if(cp.tagName==="BUTTON"){cp.onclick=openComposer;const btn=$("composerBtn");if(btn)btn.onclick=openComposer}else{const post=()=>{if(cp.value.trim()){FEED.unshift({ctx:"sales",t:cp.value.trim(),tags:["#note"],time:"0m",likes:0,by:ME.name,av:ME.av,rr:null,cm:[]});views("feed");say("Posted to Following (human-published, audited)")}};cp.onkeydown=e=>{if(e.key==="Enter")post()};const btn=$("composerBtn");if(btn)btn.onclick=post}}}
/* ---------- command palette ---------- */
const pal=$("pal"),palQ=$("palQ"),palRes=$("palRes");let palSel=0,palItems=[];
function palAll(q){
q=(q||"").toLowerCase();const out=[];
const push=(g,label,sub,href)=>{if(!q||label.toLowerCase().includes(q)||(sub||"").toLowerCase().includes(q))out.push({g,label,sub,href})};
push("Approvals","Review approvals","decision queue","#/today");push("Actions","Go to Feed","newest first","#/feed");
push("Actions","Browse Tags","scoped vocabularies","#/tags");
push("Actions","Walk Journeys","cross-context edges","#/journeys");
push("Actions","Browse Events","demo RSVPs","#/events");
push("Actions","Toggle theme",document.documentElement.classList.contains("dark")?"switch to light":"switch to dark","!theme");
for(const k in CTX)push("Contexts",CTX[k].n,CTX[k].lane,"#/ctx/"+k);
for(const k in CTX)for(const x of CTX[k].rows)push("Records",x[0],x[1]+" · "+CTX[k].n,"#/rec/"+k+"/"+encodeURIComponent(x[0]));
["#month-close","#win","#po","#sla","#quote","#incident","#project","#hiring"].forEach(t=>push("Tags",t,"trending in holding","#/tags"));
return out.slice(0,40)}
function palRender(){const q=palQ.value;palItems=palAll(q);palSel=0;
let g="",h="";palItems.forEach((it,i)=>{if(it.g!==g){g=it.g;h+=`<div class="px-3 pb-1 pt-2.5 text-[11px] font-bold uppercase tracking-wider text-muted-foreground">${g}</div>`}
h+=`<button class="flex w-full items-center gap-3 rounded-[11px] p-2.5 text-left text-sm ${i===0?"bg-accent":""}" data-pi="${i}"><i data-lucide="${it.g==="Approvals"?"shield-check":it.g==="Contexts"?"package":it.g==="Records"?"file-text":it.g==="Tags"?"tag":"sparkles"}" class="h-4 w-4"></i><span>${it.label}</span><small class="ml-auto text-xs text-muted-foreground">${it.sub||""}</small></button>`});
palRes.innerHTML=h||'<div class="p-3 text-muted-foreground">No matches</div>';icons();
palRes.querySelectorAll("[data-pi]").forEach(b=>b.onclick=()=>palGo(+b.dataset.pi))}
function palGo(i){const it=palItems[i];if(!it)return;pal.classList.add("hidden");
if(it.href==="!theme"){$("themeBtn").onclick();return}location.hash=it.href}
function palOpen(){pal.classList.remove("hidden");palQ.value="";palRender();setTimeout(()=>palQ.focus(),30)}
palQ.oninput=palRender;
palQ.onkeydown=e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();
palSel=(palSel+(e.key==="ArrowDown"?1:-1)+palItems.length)%Math.max(1,palItems.length);
palRes.querySelectorAll("[data-pi]").forEach((b,i)=>b.classList.toggle("bg-accent",i===palSel))}
if(e.key==="Enter")palGo(palSel);if(e.key==="Escape")pal.classList.add("hidden")};
pal.onclick=e=>{if(e.target===pal)pal.classList.add("hidden")};
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();pal.classList.contains("hidden")?palOpen():pal.classList.add("hidden")}});
$("searchBox").onclick=e=>{if(e.target.tagName!=="INPUT")palOpen()};
/* ---------- boot ---------- */
document.body.insertAdjacentHTML("beforeend",'<div id="pick"></div><div id="modal"></div>');
icons();
$("q").oninput=()=>{const h=(location.hash||"").replace("#/","");if(h.startsWith("ctx/"))views(h)};
window.onhashchange=()=>{document.body.classList.remove("navopen");views((location.hash||"#/today").replace("#/",""))};
views((location.hash||"#/today").replace("#/",""));
renderDock();
icons();
</script>
