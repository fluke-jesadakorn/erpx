[workspace]
members = [
  "crates/domain",
  "crates/identity",
  "crates/application",
  "crates/infrastructure",
  "crates/proto",
  "crates/migration",
  "crates/android-bridge",
  "crates/ui",
  "apps/server",
  "apps/worker",
  "apps/console",
  "apps/migrator",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Proprietary"

[workspace.dependencies]
aes-gcm = "0.10.3"
async-trait = "0.1.91"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
dioxus = { version = "0.7.3", default-features = false }
hex = "0.4.3"
hmac = "0.12.1"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
prost = "0.14.4"
prost-types = "0.14.4"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23.31", default-features = false, features = ["logging", "std", "tls12", "ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
tonic-web = "0.14.6"
tower-http = { version = "0.6.11", features = ["cors"] }
sha2 = "0.10.9"
subtle = "2.6.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4", "v5", "serde"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
