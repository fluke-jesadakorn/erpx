[alias]
xtask = "run --offline -p xtask --no-default-features --bin xtask --target-dir .runtime/erpx/xtask-target --"
check-fast = "run --offline -p xtask --no-default-features --bin xtask --target-dir .runtime/erpx/xtask-target -- check-fast"
