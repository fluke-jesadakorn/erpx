[package]
name = "dioxus-primitives"
version = "0.0.1"
edition = "2021"
rust-version = "1.80.0"
readme = "README.md"
keywords = ["gui", "dioxus", "components", "primitives"]
categories = ["gui", "wasm"]
authors = ["Dioxus Labs", "DogeDark"]
license = "MIT OR Apache-2.0"
homepage = "https://dioxuslabs.com"
repository = "https://github.com/DioxusLabs/dioxus-components"

[dependencies]
dioxus = { version = "=0.8.0-alpha.1", default-features = false, features = ["asset", "document", "html", "hooks", "macro", "signals"] }
dioxus-attributes = { path = "../dioxus-attributes" }
dioxus-sdk-time = { path = "../../dioxus-sdk-time" }
time = { version = "0.3.44", features = ["std", "macros", "parsing", "local-offset"] }
num-integer = "0.1.46"
tracing = "0.1.44"
serde = { version = "1.0", features = ["derive"] }
palette = "0.7.6"

[build-dependencies]
lazy-js-bundle = "=0.8.0-alpha.1"

[dev-dependencies]
dioxus-ssr = "=0.8.0-alpha.1"

[features]
default = ["router"]
router = ["dioxus/router"]
web = ["time/wasm-bindgen"]
