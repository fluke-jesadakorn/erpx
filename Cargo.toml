erpx-legal-sqlx = { path = "crates/adapters/legal-sqlx" }
erpx-maintenance = { path = "crates/contexts/maintenance" }
erpx-maintenance-sqlx = { path = "crates/adapters/maintenance-sqlx" }
erpx-marketing = { path = "crates/contexts/marketing" }
erpx-marketing-sqlx = { path = "crates/adapters/marketing-sqlx" }
erpx-migration = { path = "crates/migration" }
erpx-operations = { path = "crates/contexts/operations" }
erpx-operations-sqlx = { path = "crates/adapters/operations-sqlx" }
erpx-organization = { path = "crates/contexts/organization" }
erpx-organization-sqlx = { path = "crates/adapters/organization-sqlx" }
