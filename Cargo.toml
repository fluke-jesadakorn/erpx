[workspace]
members = ["modules/crm/server", "modules/work-projection/server", "modules/brand/server", "modules/pos/server", "modules/projects/server", "modules/procurement/server", "modules/sales/server", "modules/manufacturing/server", "modules/ecommerce/server", "modules/marketing/server", "modules/customer-360/server", "modules/customer-authority/server", "modules/billing/server", "modules/benefits/server", "modules/talent/server", "modules/learning/server", "modules/operations/server", "modules/records/server", "modules/field-service/server", "modules/support/server","modules/collaboration/server", "modules/assets/server", "modules/maintenance/server", "modules/commerce/server", "modules/quality/server", "modules/inventory/server", "platform/shared/server", "platform/runtime/server", "modules/legal/server", "platform/composition", "modules/finance/server", "modules/identity-access/server", "modules/organization/server", "modules/people-payroll/server", "modules/files/server", "modules/manage-erpx/server", "modules/commercial/server", "modules/platform-administration/server", "modules/pms/server", "modules/workflow/server", "modules/planning/server", "modules/agent/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
erpx-work-projection-server = { path = "modules/work-projection/server" }
erpx-brand-server = { path = "modules/brand/server" }
erpx-pos-server = { path = "modules/pos/server" }
erpx-operations-server = { path = "modules/operations/server" }
erpx-records-server = { path = "modules/records/server" }
erpx-learning-server = { path = "modules/learning/server" }
erpx-field-service-server = { path = "modules/field-service/server" }
erpx-support-server = { path = "modules/support/server" }
ml-dsa = { version = "=0.1.1", default-features = false }
rsa = { version = "=0.9.10", default-features = false }
p521 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
erpx-collaboration-server = { path = "modules/collaboration/server" }
erpx-assets-server = { path = "modules/assets/server" }
erpx-benefits-server = { path = "modules/benefits/server" }
erpx-billing-server = { path = "modules/billing/server" }
erpx-maintenance-server = { path = "modules/maintenance/server" }
erpx-manufacturing-server = { path = "modules/manufacturing/server" }
erpx-marketing-server = { path = "modules/marketing/server" }
erpx-customer-360-server = { path = "modules/customer-360/server" }
erpx-customer-authority-server = { path = "modules/customer-authority/server" }
erpx-ecommerce-server = { path = "modules/ecommerce/server" }
erpx-talent-server = { path = "modules/talent/server" }
libvips = "=2.3.0"
pkg-config = "=0.3.34"
ldap3_proto = "=0.8.1"
bytes = "=1.12.1"
tracing = "=0.1.44"
tokio-util = { version = "=0.7.20", default-features = false, features = ["codec"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
erpx-commerce-server = { path = "modules/commerce/server" }
erpx-crm-server = { path = "modules/crm/server" }
erpx-quality-server = { path = "modules/quality/server" }
erpx-sales-server = { path = "modules/sales/server" }
erpx-procurement-server = { path = "modules/procurement/server" }
erpx-projects-server = { path = "modules/projects/server" }
erpx-inventory-server = { path = "modules/inventory/server" }
erpx-platform-shared-server = { path = "platform/shared/server" }
erpx-platform-runtime-server = { path = "platform/runtime/server" }
erpx-finance-server = { path = "modules/finance/server" }
erpx-identity-access-server = { path = "modules/identity-access/server" }
erpx-organization-server = { path = "modules/organization/server" }
erpx-people-payroll-server = { path = "modules/people-payroll/server" }
erpx-files-server = { path = "modules/files/server" }
erpx-manage-erpx-server = { path = "modules/manage-erpx/server" }
erpx-commercial-server = { path = "modules/commercial/server" }
erpx-platform-administration-server = { path = "modules/platform-administration/server" }
erpx-pms-server = { path = "modules/pms/server" }
erpx-workflow-server = { path = "modules/workflow/server" }
erpx-planning-server = { path = "modules/planning/server" }
erpx-agent-server = { path = "modules/agent/server" }
erpx-legal-server = { path = "modules/legal/server" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "process", "io-util", "time", "sync", "fs"] }
tower = { version = "=0.5.3", features = ["util"] }
openssl = "=0.10.81"
lopdf = { version = "=0.46.0", default-features = false }
cms = "=0.2.3"
der = { version = "=0.7.10", features = ["derive", "alloc"] }
x509-cert = "=0.2.5"
x509-tsp = "=0.1.0"
x509-ocsp = "=0.2.1"
const-oid = "=0.9.6"
sha2 = "=0.10.9"
hex = "=0.4.3"
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
syn = { version = "=2.0.119", features = ["full", "visit"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "json", "time", "uuid"] }
uuid = { version = "=1.29.0", default-features = false, features = ["v4"] }
tempfile = "=3.27.0"
ring = "=0.17.14"
subtle = "=2.6.1"
docx-rs = { version = "=0.4.22", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.11"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
url = "=2.5.8"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
roxmltree = { version = "=0.21.2", default-features = false, features = ["std"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
argon2 = { version = "=0.6.0", features = ["getrandom"] }
scrypt = "=0.10.0"
getrandom = "=0.4.3"
ts-rs = "=12.0.1"
utoipa = "=6.0.0"
icu_collator = { version = "=2.1.0", default-features = false, features = ["compiled_data"] }
icu_collator_data = { version = "=2.1.0", default-features = false }
icu_locale = { version = "=2.1.1", default-features = false }
num-bigint = { version = "=0.5.1", default-features = false }
num-traits = { version = "=0.2.19", default-features = false }
ryu-js = "=1.0.3"
nix = { version = "=0.31.3", default-features = false, features = ["resource", "fs", "signal", "process", "user"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
