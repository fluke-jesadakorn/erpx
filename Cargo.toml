[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = 0
incremental = true
split-debuginfo = "off"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false
split-debuginfo = "off"

[profile.test.package."*"]
debug = false

# Dioxus selects this profile for the browser half of `dx build --release`.
# Favor generated-code runtime speed; wasm-opt performs the final debug stripping.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
