erpx-brand-sqlx = { path = "crates/adapters/brand-sqlx" }
erpx-commercial = { path = "crates/contexts/commercial" }
erpx-commercial-sqlx = { path = "crates/adapters/commercial-sqlx" }
erpx-cqrs = { path = "crates/cqrs" }
erpx-cqrs-sqlx = { path = "crates/adapters/cqrs-sqlx" }
erpx-crm = { path = "crates/contexts/crm" }
erpx-crm-sqlx = { path = "crates/adapters/crm-sqlx" }
erpx-customer-360 = { path = "crates/contexts/customer-360" }
