resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Proprietary"

[workspace.dependencies]
aes-gcm = "0.10.3"
async-trait = "0.1.91"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
dioxus = { version = "=0.7.9", default-features = false }
erpx-android-bridge = { path = "crates/android-bridge" }
erpx-application = { path = "crates/application" }
erpx-assets = { path = "crates/contexts/assets" }
erpx-assets-sqlx = { path = "crates/adapters/assets-sqlx" }
