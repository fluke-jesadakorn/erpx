erpx-quality-sqlx = { path = "crates/adapters/quality-sqlx" }
erpx-sales = { path = "crates/contexts/sales" }
erpx-sales-sqlx = { path = "crates/adapters/sales-sqlx" }
erpx-support = { path = "crates/contexts/support" }
erpx-support-sqlx = { path = "crates/adapters/support-sqlx" }
erpx-ui = { path = "crates/ui" }
erpx-ui-foundation = { path = "crates/ui-foundation" }
