[workspace]
members = ["packages/server-shared", "packages/server-runtime", "packages/server-legal"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
erpx-server-shared = { path = "packages/server-shared" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "=0.5.3", features = ["util"] }
openssl = "=0.10.81"
lopdf = { version = "=0.46.0", default-features = false }
cms = "=0.2.3"
der = { version = "=0.7.10", features = ["derive", "alloc"] }
x509-cert = "=0.2.5"
x509-tsp = "=0.1.0"
x509-ocsp = "=0.2.1"
const-oid = "=0.9.6"
sha2 = "=0.10.9"
hex = "=0.4.3"
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
syn = { version = "=2.0.119", features = ["full", "visit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
