tokio-stream = "0.1.17"
tungstenite = "=0.29.0"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-web = "0.14.6"
tonic-web-wasm-client = { version = "=0.8.0", path = "third_party/tonic-web-wasm-client" }
tower-http = { version = "0.6.11", features = ["compression-br", "compression-gzip", "cors"] }
time = { version = "=0.3.54", features = ["std", "macros", "parsing", "local-offset"] }
sha2 = "0.10.9"
subtle = "2.6.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
uuid = { version = "1.18.1", features = ["v4", "v5", "serde"] }
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = "0.3.103"
webauthn-rs = "=0.5.5"
webauthn-rs-proto = "=0.5.5"
