[workspace]
members = ["packages/server-shared", "packages/server-runtime", "packages/server-legal", "src/composition", "packages/server-finance", "packages/server-identity_access", "packages/server-organization", "packages/server-people_payroll", "packages/server-files", "packages/server-manage_erpx", "packages/server-commercial", "packages/server-platform_administration", "packages/server-pms", "packages/server-workflow"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
erpx-server-shared = { path = "packages/server-shared" }
erpx-server-runtime = { path = "packages/server-runtime" }
erpx-server-finance = { path = "packages/server-finance" }
erpx-server-identity-access = { path = "packages/server-identity_access" }
erpx-server-organization = { path = "packages/server-organization" }
erpx-server-people-payroll = { path = "packages/server-people_payroll" }
erpx-server-files = { path = "packages/server-files" }
erpx-server-manage-erpx = { path = "packages/server-manage_erpx" }
erpx-server-commercial = { path = "packages/server-commercial" }
erpx-server-platform-administration = { path = "packages/server-platform_administration" }
erpx-server-pms = { path = "packages/server-pms" }
erpx-server-workflow = { path = "packages/server-workflow" }
erpx-server-legal = { path = "packages/server-legal" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "process", "io-util", "time", "sync", "fs"] }
tower = { version = "=0.5.3", features = ["util"] }
openssl = "=0.10.81"
lopdf = { version = "=0.46.0", default-features = false }
cms = "=0.2.3"
der = { version = "=0.7.10", features = ["derive", "alloc"] }
x509-cert = "=0.2.5"
x509-tsp = "=0.1.0"
x509-ocsp = "=0.2.1"
const-oid = "=0.9.6"
sha2 = "=0.10.9"
hex = "=0.4.3"
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
syn = { version = "=2.0.119", features = ["full", "visit"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "json", "time", "uuid"] }
uuid = { version = "=1.29.0", default-features = false, features = ["v4"] }
tempfile = "=3.27.0"
ring = "=0.17.14"
subtle = "=2.6.1"
docx-rs = { version = "=0.4.22", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.11"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
url = "=2.5.8"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
roxmltree = { version = "=0.21.2", default-features = false, features = ["std"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
argon2 = { version = "=0.6.0", features = ["getrandom"] }
getrandom = "=0.4.3"
ts-rs = "=12.0.1"
utoipa = "=6.0.0"
icu_collator = { version = "=2.1.0", default-features = false, features = ["compiled_data"] }
icu_collator_data = { version = "=2.1.0", default-features = false }
icu_locale = { version = "=2.1.1", default-features = false }
num-bigint = { version = "=0.5.1", default-features = false }
num-traits = { version = "=0.2.19", default-features = false }
ryu-js = "=1.0.3"
nix = { version = "=0.31.3", default-features = false, features = ["resource", "fs", "signal", "process"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
