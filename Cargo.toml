  "crates/contexts/assets",
  "crates/contexts/commercial",
  "crates/contexts/brand",
  "crates/contexts/crm",
  "crates/contexts/customer-360",
  "crates/contexts/customer-authority",
  "crates/contexts/finance",
  "crates/contexts/identity-access",
  "crates/contexts/inventory",
  "crates/contexts/legal",
  "crates/contexts/marketing",
  "crates/contexts/maintenance",
  "crates/contexts/organization",
  "crates/contexts/operations",
  "crates/contexts/people-payroll",
  "crates/contexts/platform-administration",
  "crates/contexts/pos",
  "crates/contexts/procurement",
  "crates/contexts/quality",
  "crates/contexts/sales",
