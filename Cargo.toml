  "crates/kernel",
  "crates/cqrs",
  "crates/integration-contracts",
  "crates/web-session",
  "crates/ui-foundation",
  "crates/adapters/cqrs-sqlx",
  "crates/adapters/finance-sqlx",
  "crates/adapters/legal-sqlx",
  "crates/adapters/brand-sqlx",
  "crates/adapters/assets-sqlx",
  "crates/adapters/commercial-sqlx",
  "crates/adapters/crm-sqlx",
