fs2 = "0.4.3"
hex = "0.4.3"
hmac = "0.12.1"
jni = "0.21.1"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
ndk-context = "0.1.1"
prost = "0.14.4"
prost-types = "0.14.4"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17.14"
rustls = { version = "0.23.31", default-features = false, features = ["logging", "std", "tls12", "ring"] }
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-web = "0.14.6"
tonic-web-wasm-client = "=0.8.0"
tower-http = { version = "0.6.11", features = ["cors"] }
sha2 = "0.10.9"
subtle = "2.6.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4", "v5", "serde"] }
web-sys = "0.3.103"
webauthn-rs = "=0.5.5"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = "line-tables-only"
incremental = true
split-debuginfo = "off"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false
split-debuginfo = "off"

[profile.test.package."*"]
debug = false
