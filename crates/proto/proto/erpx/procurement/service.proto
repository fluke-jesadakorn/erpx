syntax = "proto3";

package erpx.procurement;

import "erpx/common/context.proto";

enum PurchaseOrderStatus {
  PURCHASE_ORDER_STATUS_UNSPECIFIED = 0;
  PURCHASE_ORDER_STATUS_DRAFT = 1;
  PURCHASE_ORDER_STATUS_RELEASED = 2;
  PURCHASE_ORDER_STATUS_CANCELLED = 3;
}
enum PurchaseRequisitionStatus {
  PURCHASE_REQUISITION_STATUS_UNSPECIFIED = 0;
  PURCHASE_REQUISITION_STATUS_DRAFT = 1;
  PURCHASE_REQUISITION_STATUS_SUBMITTED = 2;
  PURCHASE_REQUISITION_STATUS_APPROVED = 3;
  PURCHASE_REQUISITION_STATUS_REJECTED = 4;
  PURCHASE_REQUISITION_STATUS_CANCELLED = 5;
}
enum GoodsReceiptStatus {
  GOODS_RECEIPT_STATUS_UNSPECIFIED = 0;
  GOODS_RECEIPT_STATUS_PENDING_ACCEPTANCE = 1;
  GOODS_RECEIPT_STATUS_ACCEPTED = 2;
  GOODS_RECEIPT_STATUS_REJECTED = 3;
  GOODS_RECEIPT_STATUS_CANCELLED = 4;
}
message RecordVersionRef {
  string record_id = 1;
  uint64 version = 2;
  string owner_context = 3;
  string record_type = 4;
}
message PurchaseOrderLineRecord {
  string line_id = 1;
  string item_code = 2;
  int64 ordered_quantity = 3;
  int64 unit_price_minor = 4;
  string currency = 5;
  string destination_code = 6;
}
message PurchaseOrderRecord {
  string purchase_order_id = 1;
  uint64 source_version = 2;
  erpx.common.AuthorityScope scope = 3;
  string order_code = 4;
  string supplier_id = 5;
  string currency = 6;
  repeated PurchaseOrderLineRecord lines = 7;
  PurchaseOrderStatus status = 8;
  string created_at = 9;
  string updated_at = 10;
  string projected_at = 11;
  // Absent only on bounded historical projections. New writes require this
  // exact approved requisition source and legacy-unlinked orders cannot release.
  optional RecordVersionRef source_requisition = 12;
  optional RecordVersionRef contract = 13;
}
message CreatePurchaseOrderRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string purchase_order_id = 2;
  erpx.common.AuthorityScope scope = 3;
  string order_code = 4;
  string supplier_id = 5;
  string currency = 6;
  repeated PurchaseOrderLineRecord lines = 7;
  RecordVersionRef source_requisition = 8;
  optional RecordVersionRef contract = 9;
}
message ReleasePurchaseOrderRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string purchase_order_id = 2;
}
message CancelPurchaseOrderRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string purchase_order_id = 2;
}
message PurchaseOrderMutationResponse {
  erpx.common.CommandReceipt receipt = 1;
  PurchaseOrderRecord order = 2;
}
message GetPurchaseOrderRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  string purchase_order_id = 2;
}
message GetPurchaseOrderResponse {
  optional PurchaseOrderRecord order = 1;
  erpx.common.QueryMetadata metadata = 2;
}
message ListPurchaseOrdersRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  optional PurchaseOrderStatus status = 2;
  optional string supplier_id = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}
message ListPurchaseOrdersResponse {
  repeated PurchaseOrderRecord orders = 1;
  optional string next_cursor = 2;
  erpx.common.QueryMetadata metadata = 3;
}

message PurchaseRequisitionLineRecord {
  string line_id = 1;
  string item_code = 2;
  int64 requested_quantity = 3;
  int64 estimated_unit_price_minor = 4;
  string currency = 5;
  string destination_code = 6;
}
message PurchaseRequisitionRecord {
  string requisition_id = 1;
  uint64 source_version = 2;
  erpx.common.AuthorityScope scope = 3;
  string requisition_code = 4;
  string requesting_department_code = 5;
  // Absent only while reading a bounded historical snapshot. A new or
  // approvable requisition always carries explicit budget evidence.
  optional string budget_code = 6;
  string currency = 7;
  repeated PurchaseRequisitionLineRecord lines = 8;
  PurchaseRequisitionStatus status = 9;
  string created_at = 10;
  string updated_at = 11;
  string projected_at = 12;
}
message GoodsReceiptLineRecord {
  string line_id = 1;
  string purchase_order_line_id = 2;
  string inventory_stock_item_id = 3;
  int64 received_quantity = 4;
}
message GoodsReceiptRecord {
  string goods_receipt_id = 1;
  uint64 source_version = 2;
  erpx.common.AuthorityScope scope = 3;
  string receipt_code = 4;
  RecordVersionRef source_purchase_order = 5;
  repeated GoodsReceiptLineRecord lines = 6;
  GoodsReceiptStatus status = 7;
  string created_at = 8;
  string updated_at = 9;
  string projected_at = 10;
}
message CreatePurchaseRequisitionRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string requisition_id = 2;
  erpx.common.AuthorityScope scope = 3;
  string requisition_code = 4;
  string requesting_department_code = 5;
  string budget_code = 6;
  string currency = 7;
  repeated PurchaseRequisitionLineRecord lines = 8;
}
message PurchaseRequisitionIdentityRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string requisition_id = 2;
}
message PurchaseRequisitionMutationResponse {
  erpx.common.CommandReceipt receipt = 1;
  PurchaseRequisitionRecord requisition = 2;
}
message CreateGoodsReceiptRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string goods_receipt_id = 2;
  erpx.common.AuthorityScope scope = 3;
  string receipt_code = 4;
  RecordVersionRef source_purchase_order = 5;
  repeated GoodsReceiptLineRecord lines = 6;
}
message GoodsReceiptIdentityRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string goods_receipt_id = 2;
}
message GoodsReceiptMutationResponse {
  erpx.common.CommandReceipt receipt = 1;
  GoodsReceiptRecord goods_receipt = 2;
}
message GetPurchaseRequisitionRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  string requisition_id = 2;
}
message GetPurchaseRequisitionResponse {
  optional PurchaseRequisitionRecord requisition = 1;
  erpx.common.QueryMetadata metadata = 2;
}
message GetGoodsReceiptRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  string goods_receipt_id = 2;
}
message GetGoodsReceiptResponse {
  optional GoodsReceiptRecord goods_receipt = 1;
  erpx.common.QueryMetadata metadata = 2;
}

service ProcurementCommandService {
  rpc Create(CreatePurchaseOrderRequest) returns (PurchaseOrderMutationResponse);
  rpc Release(ReleasePurchaseOrderRequest) returns (PurchaseOrderMutationResponse);
  rpc Cancel(CancelPurchaseOrderRequest) returns (PurchaseOrderMutationResponse);
  rpc CreateRequisition(CreatePurchaseRequisitionRequest) returns (PurchaseRequisitionMutationResponse);
  rpc SubmitRequisition(PurchaseRequisitionIdentityRequest) returns (PurchaseRequisitionMutationResponse);
  rpc ApproveRequisition(PurchaseRequisitionIdentityRequest) returns (PurchaseRequisitionMutationResponse);
  rpc RejectRequisition(PurchaseRequisitionIdentityRequest) returns (PurchaseRequisitionMutationResponse);
  rpc CancelRequisition(PurchaseRequisitionIdentityRequest) returns (PurchaseRequisitionMutationResponse);
  rpc CreateGoodsReceipt(CreateGoodsReceiptRequest) returns (GoodsReceiptMutationResponse);
  rpc AcceptGoodsReceipt(GoodsReceiptIdentityRequest) returns (GoodsReceiptMutationResponse);
  rpc RejectGoodsReceipt(GoodsReceiptIdentityRequest) returns (GoodsReceiptMutationResponse);
  rpc CancelGoodsReceipt(GoodsReceiptIdentityRequest) returns (GoodsReceiptMutationResponse);
}

service ProcurementQueryService {
  rpc Get(GetPurchaseOrderRequest) returns (GetPurchaseOrderResponse);
  rpc List(ListPurchaseOrdersRequest) returns (ListPurchaseOrdersResponse);
  rpc GetRequisition(GetPurchaseRequisitionRequest) returns (GetPurchaseRequisitionResponse);
  rpc GetGoodsReceipt(GetGoodsReceiptRequest) returns (GetGoodsReceiptResponse);
}
