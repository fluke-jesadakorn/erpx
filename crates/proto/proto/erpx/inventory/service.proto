syntax = "proto3";

package erpx.inventory;

import "erpx/common/context.proto";

enum InventoryReservationStatus {
  INVENTORY_RESERVATION_STATUS_UNSPECIFIED = 0;
  INVENTORY_RESERVATION_STATUS_ACTIVE = 1;
  INVENTORY_RESERVATION_STATUS_RELEASED = 2;
}
message ProcurementLineReference {
  string purchase_order_line_id = 1;
}
message InventoryReservationRecord {
  string reservation_id = 1;
  int64 quantity = 2;
  string demand_reference = 3;
  InventoryReservationStatus status = 4;
}
message StockItemRecord {
  string stock_item_id = 1;
  uint64 source_version = 2;
  erpx.common.AuthorityScope scope = 3;
  string warehouse_id = 4;
  string item_code = 5;
  int64 on_hand = 6;
  int64 reserved = 7;
  int64 available = 8;
  repeated InventoryReservationRecord reservations = 9;
  string created_at = 10;
  string updated_at = 11;
  string projected_at = 12;
}
message RegisterStockItemRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string stock_item_id = 2;
  erpx.common.AuthorityScope scope = 3;
  string warehouse_id = 4;
  string item_code = 5;
}
message ReceiveStockRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string stock_item_id = 2;
  string movement_id = 3;
  int64 quantity = 4;
  optional ProcurementLineReference procurement_line = 5;
}
message IssueStockRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string stock_item_id = 2;
  string movement_id = 3;
  int64 quantity = 4;
}
message ReserveInventoryRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string stock_item_id = 2;
  string reservation_id = 3;
  int64 quantity = 4;
  string demand_reference = 5;
}
message ReleaseInventoryReservationRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string stock_item_id = 2;
  string reservation_id = 3;
}
message StockItemMutationResponse {
  erpx.common.CommandReceipt receipt = 1;
  StockItemRecord item = 2;
}
message GetStockItemRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  string stock_item_id = 2;
}
message GetStockItemResponse {
  optional StockItemRecord item = 1;
  erpx.common.QueryMetadata metadata = 2;
}
message ListStockItemsRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  optional string warehouse_id = 2;
  optional string item_code = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}
message ListStockItemsResponse {
  repeated StockItemRecord items = 1;
  optional string next_cursor = 2;
  erpx.common.QueryMetadata metadata = 3;
}

service InventoryCommandService {
  rpc Register(RegisterStockItemRequest) returns (StockItemMutationResponse);
  rpc Receive(ReceiveStockRequest) returns (StockItemMutationResponse);
  rpc Issue(IssueStockRequest) returns (StockItemMutationResponse);
  rpc Reserve(ReserveInventoryRequest) returns (StockItemMutationResponse);
  rpc ReleaseReservation(ReleaseInventoryReservationRequest)
      returns (StockItemMutationResponse);
}

service InventoryQueryService {
  rpc Get(GetStockItemRequest) returns (GetStockItemResponse);
  rpc List(ListStockItemsRequest) returns (ListStockItemsResponse);
}
