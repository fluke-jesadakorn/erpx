syntax = "proto3";

package erpx.ecommerce.v2;

import "erpx/common/v2/context.proto";

enum CommerceRealm {
  COMMERCE_REALM_UNSPECIFIED = 0;
  COMMERCE_REALM_GUEST = 1;
  COMMERCE_REALM_CUSTOMER = 2;
}

enum CommerceChannelStatus {
  COMMERCE_CHANNEL_STATUS_UNSPECIFIED = 0;
  COMMERCE_CHANNEL_STATUS_DRAFT = 1;
  COMMERCE_CHANNEL_STATUS_APPROVED = 2;
  COMMERCE_CHANNEL_STATUS_ACTIVE = 3;
  COMMERCE_CHANNEL_STATUS_SUSPENDED = 4;
  COMMERCE_CHANNEL_STATUS_RETIRED = 5;
}

enum CommerceDecisionStatus {
  COMMERCE_DECISION_STATUS_UNSPECIFIED = 0;
  COMMERCE_DECISION_STATUS_ACCEPTED = 1;
  COMMERCE_DECISION_STATUS_REJECTED = 2;
  COMMERCE_DECISION_STATUS_UNCERTAIN = 3;
}

message MoneyAmount {
  sint64 minor_units = 1;
  string currency = 2;
}

message CommerceOwnerRef {
  CommerceRealm realm = 1;
  string principal_id = 2;
  optional RecordRef verified_customer = 3;
}

message RecordRef {
  string record_id = 1;
  string owner_context = 2;
  string record_type = 3;
}

message EcommerceMutationResponse {
  erpx.common.v2.CommandReceipt receipt = 1;
  string record_type = 2;
  string record_id = 3;
  string lifecycle_status = 4;
}

message CreateCommerceChannelRequest {
  erpx.common.v2.CommandContext context = 1;
  string channel_id = 2;
  erpx.common.v2.TenantScope scope = 3;
  string code = 4;
  repeated string locales = 5;
  repeated string currencies = 6;
  string proposed_by_principal_id = 7;
}

message ApproveCommerceChannelRequest {
  erpx.common.v2.CommandContext context = 1;
  string channel_id = 2;
  string approved_by_principal_id = 3;
}

message TransitionCommerceChannelRequest {
  erpx.common.v2.CommandContext context = 1;
  string channel_id = 2;
  CommerceChannelStatus target_status = 3;
}

message CreateCommerceListingRequest {
  erpx.common.v2.CommandContext context = 1;
  string listing_id = 2;
  erpx.common.v2.TenantScope scope = 3;
  string channel_id = 4;
  RecordRef product = 5;
  uint64 product_version = 6;
  uint64 catalog_version = 7;
  uint64 price_version = 8;
  uint64 availability_version = 9;
  uint64 policy_version = 10;
  MoneyAmount unit_price = 11;
  bool available = 12;
  string proposed_by_principal_id = 13;
}

message ApproveCommerceListingRequest {
  erpx.common.v2.CommandContext context = 1;
  string listing_id = 2;
  string approved_by_principal_id = 3;
}

message PublishCommerceListingRequest {
  erpx.common.v2.CommandContext context = 1;
  string listing_id = 2;
  string channel_id = 3;
  uint64 channel_version = 4;
}

message ListingIdentityRequest {
  erpx.common.v2.CommandContext context = 1;
  string listing_id = 2;
}

message CreateCommerceCartRequest {
  erpx.common.v2.CommandContext context = 1;
  string cart_id = 2;
  erpx.common.v2.TenantScope scope = 3;
  string channel_id = 4;
  uint64 channel_version = 5;
  CommerceOwnerRef owner = 6;
  bool marketing_consent = 7;
}

message PutCommerceCartLineRequest {
  erpx.common.v2.CommandContext context = 1;
  string cart_id = 2;
  string listing_id = 3;
  uint64 listing_version = 4;
  uint32 quantity = 5;
}

message CartIdentityRequest {
  erpx.common.v2.CommandContext context = 1;
  string cart_id = 2;
}

message StartCommerceCheckoutRequest {
  erpx.common.v2.CommandContext context = 1;
  string checkout_id = 2;
  erpx.common.v2.TenantScope scope = 3;
  string cart_id = 4;
  uint64 cart_version = 5;
  MoneyAmount tax = 6;
  MoneyAmount shipping = 7;
  MoneyAmount total = 8;
  string address_digest = 9;
  uint64 terms_version = 10;
}

message ReconcileCheckoutRevalidationRequest {
  erpx.common.v2.CommandContext context = 1;
  string checkout_id = 2;
  bool accepted = 3;
  string owner_receipt_id = 4;
  repeated uint64 exact_listing_versions = 5;
}

message ReconcileCheckoutDecisionRequest {
  erpx.common.v2.CommandContext context = 1;
  string checkout_id = 2;
  CommerceDecisionStatus decision = 3;
  string owner_receipt_id = 4;
  uint64 owner_record_version = 5;
}

message ReconcileCheckoutOrderRequest {
  erpx.common.v2.CommandContext context = 1;
  string checkout_id = 2;
  string owner_receipt_id = 3;
  string order_record_id = 4;
  string order_owner_context = 5;
  string order_record_type = 6;
}

message RequestCommerceReturnRequest {
  erpx.common.v2.CommandContext context = 1;
  string return_id = 2;
  string checkout_id = 3;
  uint64 checkout_version = 4;
  CommerceOwnerRef owner = 5;
  string reason = 6;
  string evidence_digest = 7;
}

message ReconcileReturnDispositionRequest {
  erpx.common.v2.CommandContext context = 1;
  string return_id = 2;
  bool accepted = 3;
  string owner_receipt_id = 4;
}

message ReconcileReturnRefundRequest {
  erpx.common.v2.CommandContext context = 1;
  string return_id = 2;
  CommerceDecisionStatus decision = 3;
  string owner_receipt_id = 4;
}

message ProposeCommerceFulfillmentRequest {
  erpx.common.v2.CommandContext context = 1;
  string fulfillment_id = 2;
  erpx.common.v2.TenantScope scope = 3;
  CommerceOwnerRef owner = 4;
  RecordRef checkout = 5;
  RecordRef order = 6;
  string reservation_digest = 7;
}

message TransitionCommerceFulfillmentRequest {
  erpx.common.v2.CommandContext context = 1;
  string fulfillment_id = 2;
  string target_status = 3;
}

message GetCommerceRecordRequest {
  erpx.common.v2.QueryContext context = 1;
  string record_id = 2;
}

message CommerceRecordProjection {
  string record_id = 1;
  uint64 source_version = 2;
  erpx.common.v2.TenantScope scope = 3;
  string record_type = 4;
  string lifecycle_status = 5;
  optional string owner_principal_id = 6;
  optional string channel_id = 7;
  optional string checkout_id = 8;
  optional string order_record_id = 9;
  uint64 source_position = 10;
  string projected_at = 11;
}

message GetCommerceRecordResponse {
  optional CommerceRecordProjection record = 1;
  erpx.common.v2.ProjectionMetadata projection = 2;
}

service EcommerceCommandService {
  rpc CreateChannel(CreateCommerceChannelRequest) returns (EcommerceMutationResponse);
  rpc ApproveChannel(ApproveCommerceChannelRequest) returns (EcommerceMutationResponse);
  rpc TransitionChannel(TransitionCommerceChannelRequest) returns (EcommerceMutationResponse);
  rpc CreateListing(CreateCommerceListingRequest) returns (EcommerceMutationResponse);
  rpc ApproveListing(ApproveCommerceListingRequest) returns (EcommerceMutationResponse);
  rpc PublishListing(PublishCommerceListingRequest) returns (EcommerceMutationResponse);
  rpc WithdrawListing(ListingIdentityRequest) returns (EcommerceMutationResponse);
  rpc CreateCart(CreateCommerceCartRequest) returns (EcommerceMutationResponse);
  rpc PutCartLine(PutCommerceCartLineRequest) returns (EcommerceMutationResponse);
  rpc LockCart(CartIdentityRequest) returns (EcommerceMutationResponse);
  rpc StartCheckout(StartCommerceCheckoutRequest) returns (EcommerceMutationResponse);
  rpc ReconcileCheckoutRevalidation(ReconcileCheckoutRevalidationRequest) returns (EcommerceMutationResponse);
  rpc ReconcileCheckoutReservation(ReconcileCheckoutDecisionRequest) returns (EcommerceMutationResponse);
  rpc ReconcileCheckoutPayment(ReconcileCheckoutDecisionRequest) returns (EcommerceMutationResponse);
  rpc ReconcileCheckoutOrder(ReconcileCheckoutOrderRequest) returns (EcommerceMutationResponse);
  rpc RequestReturn(RequestCommerceReturnRequest) returns (EcommerceMutationResponse);
  rpc ReconcileReturnDisposition(ReconcileReturnDispositionRequest) returns (EcommerceMutationResponse);
  rpc ReconcileReturnRefund(ReconcileReturnRefundRequest) returns (EcommerceMutationResponse);
  rpc ProposeFulfillment(ProposeCommerceFulfillmentRequest) returns (EcommerceMutationResponse);
  rpc TransitionFulfillment(TransitionCommerceFulfillmentRequest) returns (EcommerceMutationResponse);
}

service EcommerceQueryService {
  rpc GetChannel(GetCommerceRecordRequest) returns (GetCommerceRecordResponse);
  rpc GetListing(GetCommerceRecordRequest) returns (GetCommerceRecordResponse);
  rpc GetCart(GetCommerceRecordRequest) returns (GetCommerceRecordResponse);
  rpc GetCheckout(GetCommerceRecordRequest) returns (GetCommerceRecordResponse);
  rpc GetReturn(GetCommerceRecordRequest) returns (GetCommerceRecordResponse);
  rpc GetFulfillment(GetCommerceRecordRequest) returns (GetCommerceRecordResponse);
}
