syntax = "proto3";

package erpx.platform_administration;

import "erpx/common/context.proto";

enum HoldingDeploymentMode {
  HOLDING_DEPLOYMENT_MODE_UNSPECIFIED = 0;
  HOLDING_DEPLOYMENT_MODE_ERPX_MANAGED = 1;
  HOLDING_DEPLOYMENT_MODE_CUSTOMER_DATA_PLANE = 2;
}

enum ConfigurationLifecycle {
  CONFIGURATION_LIFECYCLE_UNSPECIFIED = 0;
  CONFIGURATION_LIFECYCLE_DRAFT = 1;
  CONFIGURATION_LIFECYCLE_AWAITING_APPROVAL = 2;
  CONFIGURATION_LIFECYCLE_APPROVED = 3;
  CONFIGURATION_LIFECYCLE_APPLYING = 4;
  CONFIGURATION_LIFECYCLE_VERIFIED = 5;
  CONFIGURATION_LIFECYCLE_ACTIVE = 6;
  CONFIGURATION_LIFECYCLE_REJECTED = 7;
  CONFIGURATION_LIFECYCLE_DRIFTED = 8;
  CONFIGURATION_LIFECYCLE_FAILED = 9;
  CONFIGURATION_LIFECYCLE_SUSPENDED = 10;
}

enum DataPlaneAgentState {
  DATA_PLANE_AGENT_STATE_UNSPECIFIED = 0;
  DATA_PLANE_AGENT_STATE_UNENROLLED = 1;
  DATA_PLANE_AGENT_STATE_ENROLLING = 2;
  DATA_PLANE_AGENT_STATE_CONNECTED = 3;
  DATA_PLANE_AGENT_STATE_HEALTHY = 4;
  DATA_PLANE_AGENT_STATE_DRIFTED = 5;
  DATA_PLANE_AGENT_STATE_DEGRADED = 6;
  DATA_PLANE_AGENT_STATE_OFFLINE = 7;
  DATA_PLANE_AGENT_STATE_SUSPENDED = 8;
  DATA_PLANE_AGENT_STATE_UPGRADE_REQUIRED = 9;
}

enum RootAccessMode {
  ROOT_ACCESS_MODE_UNSPECIFIED = 0;
  ROOT_ACCESS_MODE_HEALTH_DIAGNOSTIC = 1;
  ROOT_ACCESS_MODE_INFRASTRUCTURE_MAINTENANCE = 2;
  ROOT_ACCESS_MODE_BUSINESS_DIAGNOSTIC = 3;
  ROOT_ACCESS_MODE_BUSINESS_MUTATION = 4;
  ROOT_ACCESS_MODE_EMERGENCY_RECOVERY = 5;
}

message HoldingInfrastructureProfileMessage {
  string holding_id = 1;
  string canonical_holding_id = 2;
  HoldingDeploymentMode deployment_mode = 3;
  // Opaque secret-manager locators only; never secret values or connection strings.
  string write_database_ref = 4;
  string read_database_ref = 5;
  string storage_ref = 6;
  string directory_credential_ref = 7;
  string backup_profile_ref = 8;
  uint64 profile_version = 9;
}

message HoldingInfrastructureReadModel {
  string holding_id = 1;
  string canonical_holding_id = 2;
  HoldingDeploymentMode deployment_mode = 3;
  uint64 profile_version = 4;
  string agent_id = 5;
  DataPlaneAgentState agent_state = 6;
  string agent_version = 7;
  uint64 observed_version = 8;
  uint64 desired_version = 9;
  string last_heartbeat_at = 10;
  string observed_at = 11;
  bool configuration_drifted = 12;
  bool write_healthy = 13;
  bool read_healthy = 14;
  bool storage_healthy = 15;
  bool directory_ready = 16;
  bool projections_healthy = 17;
  bool backup_verified = 18;
  bool root_access_active = 19;
  bool customer_managed_secrets = 20;
}

message GetHoldingInfrastructureRequest {
  string holding_id = 1;
  erpx.common.QueryContext context = 2;
}
message GetHoldingInfrastructureResponse {
  HoldingInfrastructureReadModel infrastructure = 1;
  string correlation_id = 2;
}

message SaveHoldingInfrastructureProfileRequest {
  HoldingInfrastructureProfileMessage profile = 1;
  uint64 expected_profile_version = 2;
  string reason = 3;
  erpx.common.CommandContext context = 4;
}
message SaveHoldingInfrastructureProfileResponse {
  uint64 profile_version = 1;
  string correlation_id = 2;
  // Customer-hosted changes are proposals until customer approval.
  bool awaiting_customer_approval = 3;
}

message BusinessUnitDirectoryRoleMappingMessage {
  string group_ref = 1;
  string role_key = 2;
  erpx.common.AuthorityScope target_scope = 3;
  bool requires_mfa = 4;
  uint32 assignment_duration_hours = 5;
  uint64 approval_limit_minor = 6;
  bool active = 7;
}

message BusinessUnitConfigurationMessage {
  string holding_id = 1;
  string canonical_holding_id = 2;
  string business_unit = 3;
  uint64 configuration_version = 4;
  bool active = 5;
  erpx.common.AuthorityScope organization_scope = 6;
  repeated BusinessUnitDirectoryRoleMappingMessage directory_role_mappings = 7;
  repeated string integration_references = 8;
  bytes retention_policy_json = 9;
  bytes projection_policy_json = 10;
  bytes workflow_policy_json = 11;
  string updated_by = 12;
  string updated_at = 13;
}

message GetBusinessUnitConfigurationRequest {
  string holding_id = 1;
  string business_unit = 2;
  erpx.common.QueryContext context = 3;
}
message GetBusinessUnitConfigurationResponse {
  BusinessUnitConfigurationMessage configuration = 1;
  bool exists = 2;
  string correlation_id = 3;
}

message SaveBusinessUnitConfigurationRequest {
  BusinessUnitConfigurationMessage configuration = 1;
  uint64 expected_configuration_version = 2;
  erpx.common.CommandContext context = 3;
}
message SaveBusinessUnitConfigurationResponse {
  uint64 configuration_version = 1;
  string correlation_id = 2;
}

// Governed corporate identity. These messages contain typed presentation
// values and immutable asset references only; raw CSS, HTML, JavaScript,
// credentials, and customer data-plane references are not representable.
message BrandScopeMessage {
  string scope_kind = 1; // platform | holding | business_unit
  string holding_id = 2;
  string canonical_holding_id = 3;
  string business_unit = 4;
}

message BrandPaletteMessage {
  string primary = 1;
  string on_primary = 2;
  string accent = 3;
  string on_accent = 4;
  string canvas = 5;
  string surface = 6;
  string surface_raised = 7;
  string border = 8;
  string text = 9;
  string text_muted = 10;
  string link = 11;
  string focus = 12;
}

message BrandTokenSetMessage {
  BrandPaletteMessage light = 1;
  BrandPaletteMessage dark = 2;
  string font_pack = 3;
  uint32 heading_scale_percent = 4;
  uint32 body_scale_percent = 5;
  uint32 line_height_percent = 6;
  string density = 7;
  string radius = 8;
  string elevation = 9;
  string navigation = 10;
  bool navigation_expanded_by_default = 11;
  string motion = 12;
}

message BrandAssetReferenceMessage {
  string kind = 1;
  string object_key = 2;
  string sha256 = 3;
  string media_type = 4;
  uint64 byte_length = 5;
  uint32 width = 6;
  uint32 height = 7;
}

message BrandAssetManifestMessage {
  BrandAssetReferenceMessage logo_mark = 1;
  BrandAssetReferenceMessage wordmark = 2;
  BrandAssetReferenceMessage favicon = 3;
  BrandAssetReferenceMessage login_artwork = 4;
}

message CorporateIdentityProfileMessage {
  string profile_id = 1;
  BrandScopeMessage scope = 2;
  uint64 version = 3;
  uint64 parent_published_version = 4;
  string lifecycle = 5;
  string display_name = 6;
  string short_name = 7;
  BrandTokenSetMessage tokens = 8;
  BrandAssetManifestMessage assets = 9;
  repeated string overridden_categories = 10;
  repeated string locked_categories = 11;
  string updated_by = 12;
}

message ResolvedCorporateIdentityMessage {
  BrandScopeMessage scope = 1;
  uint64 published_version = 2;
  string display_name = 3;
  string short_name = 4;
  BrandTokenSetMessage tokens = 5;
  BrandAssetManifestMessage assets = 6;
  repeated string inherited_categories = 7;
  repeated string locked_categories = 8;
  string digest = 9;
}

message GetResolvedCorporateIdentityRequest {
  BrandScopeMessage scope = 1;
  erpx.common.QueryContext context = 2;
}
message GetResolvedCorporateIdentityResponse {
  ResolvedCorporateIdentityMessage identity = 1;
  string correlation_id = 2;
}

message GetCorporateIdentityDraftRequest {
  BrandScopeMessage scope = 1;
  erpx.common.QueryContext context = 2;
}
message GetCorporateIdentityDraftResponse {
  CorporateIdentityProfileMessage draft = 1;
  bool exists = 2;
  string correlation_id = 3;
}

message SaveCorporateIdentityDraftRequest {
  CorporateIdentityProfileMessage draft = 1;
  uint64 expected_version = 2;
  string reason = 3;
  erpx.common.CommandContext context = 4;
}
message SaveCorporateIdentityDraftResponse {
  CorporateIdentityProfileMessage draft = 1;
  string correlation_id = 2;
}

message PublishCorporateIdentityDraftRequest {
  string profile_id = 1;
  uint64 expected_draft_version = 2;
  string reason = 3;
  erpx.common.CommandContext context = 4;
}
message PublishCorporateIdentityDraftResponse {
  CorporateIdentityProfileMessage published = 1;
  string correlation_id = 2;
}

message RollbackCorporateIdentityRequest {
  string profile_id = 1;
  uint64 source_version = 2;
  uint64 expected_published_version = 3;
  string reason = 4;
  erpx.common.CommandContext context = 5;
}
message RollbackCorporateIdentityResponse {
  CorporateIdentityProfileMessage published = 1;
  string correlation_id = 2;
}

message ListCorporateIdentityHistoryRequest {
  BrandScopeMessage scope = 1;
  uint32 page_size = 2;
  erpx.common.QueryContext context = 3;
}
message CorporateIdentityHistoryEntryMessage {
  CorporateIdentityProfileMessage profile = 1;
  string reason = 2;
  string correlation_id = 3;
  string created_at = 4;
  string published_at = 5;
  string archived_at = 6;
}
message ListCorporateIdentityHistoryResponse {
  repeated CorporateIdentityHistoryEntryMessage entries = 1;
  string correlation_id = 2;
}

enum NavigationAccessState {
  NAVIGATION_ACCESS_STATE_UNSPECIFIED = 0;
  NAVIGATION_ACCESS_STATE_AUTHORIZED = 1;
  NAVIGATION_ACCESS_STATE_LOCKED = 2;
}

message NavigationManifestItem {
  string route_id = 1;
  string label = 2;
  string path = 3;
  string icon = 4;
  uint32 badge_count = 5;
  // Server-owned discoverability metadata only. Commands always reauthorize
  // against the authenticated actor, scope, purpose, MFA, and current state.
  repeated string action_capabilities = 6;
  // Stable localization lookup key. `label` remains as the compatibility
  // fallback for clients that do not yet understand localized manifests.
  string label_key = 7;
  // Explicit discovery state. UNSPECIFIED is interpreted as authorized by
  // newer clients so manifests from older servers remain usable.
  NavigationAccessState access_state = 8;
  // Canonical, display-safe role keys that can authorize this route. The
  // server never includes custom local role names or raw permission keys.
  repeated string required_role_keys = 9;
}
message NavigationManifestGroup {
  string group_id = 1;
  string label = 2;
  repeated NavigationManifestItem items = 3;
  string label_key = 4;
}
message GetNavigationManifestRequest {
  erpx.common.QueryContext context = 1;
  // Opt in to the full product catalog. Older clients omit this field and
  // continue receiving only routes authorized for the active role and scope.
  bool include_inaccessible = 2;
}
message GetNavigationManifestResponse {
  string audience = 1;
  string home_route = 2;
  repeated NavigationManifestGroup groups = 3;
  string correlation_id = 4;
}

message IssueDataPlaneEnrollmentRequest {
  string holding_id = 1;
  string canonical_holding_id = 2;
  string signed_manifest_digest = 3;
  uint32 lifetime_seconds = 4;
  erpx.common.CommandContext context = 5;
}
message IssueDataPlaneEnrollmentResponse {
  string enrollment_id = 1;
  // Returned once and never persisted. UI clients must redact this field.
  bytes one_time_bootstrap_token = 2;
  string expires_at = 3;
  string correlation_id = 4;
}

message EnrollDataPlaneAgentRequest {
  uint32 contract_version = 1;
  string request_id = 2;
  string correlation_id = 3;
  string enrollment_id = 4;
  // Transport-only bearer proof; the control database stores only SHA-256.
  bytes one_time_bootstrap_token = 5;
  bytes signed_installation_manifest = 6;
  string agent_id = 7;
  string holding_id = 8;
  string canonical_holding_id = 9;
  string certificate_fingerprint = 10;
  repeated string capabilities = 11;
  string agent_version = 12;
  string certificate_expires_at = 13;
  erpx.common.ActorAttribution actor = 14;
  erpx.common.AuditContext audit = 15;
}
message EnrollDataPlaneAgentResponse {
  string agent_id = 1;
  DataPlaneAgentState state = 2;
  string enrolled_at = 3;
  string correlation_id = 4;
  string pinned_control_plane_signing_key_id = 5;
}

message DesiredConfigurationMessage {
  uint32 contract_version = 1;
  string configuration_id = 2;
  string holding_id = 3;
  string canonical_holding_id = 4;
  string target_agent_id = 5;
  HoldingDeploymentMode deployment_mode = 6;
  string configuration_layer = 7;
  string business_unit = 8;
  uint64 expected_observed_version = 9;
  uint64 desired_version = 10;
  ConfigurationLifecycle lifecycle = 11;
  bytes configuration_hash = 12;
  // Contains non-sensitive desired metadata only. Secret values are prohibited.
  bytes desired_state_json = 13;
  repeated string secret_references = 14;
  repeated string required_capabilities = 15;
  string requester_ref = 16;
  string reason = 17;
  string expires_at = 18;
  string correlation_id = 19;
  bytes control_plane_signature = 20;
  string signing_key_id = 21;
}

message ProposeDesiredConfigurationRequest {
  DesiredConfigurationMessage desired = 1;
  erpx.common.CommandContext context = 2;
}
message ProposeDesiredConfigurationResponse {
  string configuration_id = 1;
  uint64 desired_version = 2;
  ConfigurationLifecycle lifecycle = 3;
  string correlation_id = 4;
}

message DecideDesiredConfigurationRequest {
  string configuration_id = 1;
  bool approve = 2;
  string reason = 3;
  erpx.common.CommandContext context = 4;
}
message DecideDesiredConfigurationResponse {
  string configuration_id = 1;
  ConfigurationLifecycle lifecycle = 2;
  string correlation_id = 3;
}

message DataPlaneObservationMessage {
  uint32 contract_version = 1;
  string request_id = 2;
  string holding_id = 3;
  string agent_id = 4;
  uint64 observed_version = 5;
  uint64 desired_version = 6;
  string write_schema_version = 7;
  string read_schema_version = 8;
  bool write_healthy = 9;
  bool read_healthy = 10;
  bool storage_healthy = 11;
  bool directory_ready = 12;
  bool projections_healthy = 13;
  bool backup_verified = 14;
  // Allow-listed redacted category, never provider/database error text.
  string failure_category = 15;
  string correlation_id = 16;
  string observed_at = 17;
  string agent_version = 18;
  erpx.common.ActorAttribution actor = 19;
  erpx.common.AuditContext audit = 20;
}

message ReportDataPlaneObservationRequest {
  DataPlaneObservationMessage observation = 1;
}
message ReportDataPlaneObservationResponse {
  DataPlaneAgentState state = 1;
  string correlation_id = 2;
}

message RootAccessRequestMessage {
  string request_id = 1;
  string requester_ref = 2;
  string device_ref = 3;
  string holding_id = 4;
  string agent_id = 5;
  erpx.common.AuthorityScope active_scope = 6;
  RootAccessMode mode = 7;
  repeated string allowed_actions = 8;
  repeated string business_units = 9;
  string reason = 10;
  string ticket_reference = 11;
  string requested_at = 12;
  string requested_until = 13;
}

message RequestRootAccessRequest {
  RootAccessRequestMessage access_request = 1;
  erpx.common.CommandContext context = 2;
}
message RequestRootAccessResponse {
  string request_id = 1;
  string state = 2;
  string correlation_id = 3;
}

message DecideRootAccessRequest {
  string request_id = 1;
  bool approve = 2;
  string reason = 3;
  erpx.common.CommandContext context = 4;
}
message DecideRootAccessResponse {
  string request_id = 1;
  string state = 2;
  string expires_at = 3;
  string correlation_id = 4;
}

message RevokeRootAccessRequest {
  string request_id = 1;
  string reason = 2;
  erpx.common.CommandContext context = 3;
}
message RevokeRootAccessResponse {
  bool revoked = 1;
  string correlation_id = 2;
}

message RootAccessQueueEntry {
  RootAccessRequestMessage access_request = 1;
  string state = 2;
  string customer_approver_ref = 3;
  string customer_approved_at = 4;
  string rejected_at = 5;
  string revoked_at = 6;
  string revocation_reason = 7;
}

message ListRootAccessRequestsRequest {
  string holding_id = 1;
  bool include_closed = 2;
  uint32 page_size = 3;
  erpx.common.QueryContext context = 4;
}
message ListRootAccessRequestsResponse {
  repeated RootAccessQueueEntry requests = 1;
  string correlation_id = 2;
}

message TypedDataPlaneCommand {
  uint32 contract_version = 1;
  string command_id = 2;
  string holding_id = 3;
  string agent_id = 4;
  string command_type = 5;
  bytes payload_json = 6;
  string correlation_id = 7;
  erpx.common.ActorAttribution actor = 8;
  erpx.common.AuthorityScope active_scope = 9;
  erpx.common.AuditContext audit = 10;
  string root_access_capability_id = 11;
  bytes control_plane_signature = 12;
  string expires_at = 13;
  // Presented only for an interactive approved Root session. The agent stores
  // only its SHA-256 digest after capability delivery.
  bytes root_access_capability_token = 14;
  string device_ref = 15;
}

message RootAccessCapabilityMessage {
  uint32 contract_version = 1;
  string capability_id = 2;
  string request_id = 3;
  // Delivered once over the holding-bound mTLS stream; never persisted raw.
  bytes one_time_capability_token = 4;
  string root_principal_ref = 5;
  string device_ref = 6;
  string holding_id = 7;
  string agent_id = 8;
  erpx.common.AuthorityScope active_scope = 9;
  repeated string allowed_actions = 10;
  repeated string business_units = 11;
  string issued_at = 12;
  string expires_at = 13;
  string correlation_id = 14;
  string signing_key_id = 15;
  bytes control_plane_signature = 16;
}

message RootAccessRevocationMessage {
  uint32 contract_version = 1;
  string capability_id = 2;
  string holding_id = 3;
  string agent_id = 4;
  string revoked_at = 5;
  string correlation_id = 6;
  string signing_key_id = 7;
  bytes control_plane_signature = 8;
}

message DataPlaneCommandResult {
  uint32 contract_version = 1;
  string command_id = 2;
  string holding_id = 3;
  string agent_id = 4;
  string result_type = 5;
  bytes redacted_payload_json = 6;
  string correlation_id = 7;
  string completed_at = 8;
  bytes agent_signature = 9;
}

message DataPlaneAgentEnvelope {
  oneof payload {
    DataPlaneObservationMessage observation = 1;
    DataPlaneCommandResult command_result = 2;
  }
}

message ControlPlaneEnvelope {
  oneof payload {
    DesiredConfigurationMessage desired_configuration = 1;
    TypedDataPlaneCommand typed_command = 2;
    RootAccessCapabilityMessage root_access_capability = 3;
    RootAccessRevocationMessage root_access_revocation = 4;
  }
}

// Browser/console-facing control-plane API. Authorization is evaluated from
// the authenticated CommandContext; self-hosted changes remain approval-gated.
