syntax = "proto3";

package erpx.quality.v1;

import "erpx/common/v1/context.proto";

enum QualityInspectionKind {
  QUALITY_INSPECTION_KIND_UNSPECIFIED = 0;
  QUALITY_INSPECTION_KIND_INCOMING = 1;
  QUALITY_INSPECTION_KIND_IN_PROCESS = 2;
  QUALITY_INSPECTION_KIND_FINAL = 3;
}

enum QualityInspectionStatus {
  QUALITY_INSPECTION_STATUS_UNSPECIFIED = 0;
  QUALITY_INSPECTION_STATUS_DRAFT = 1;
  QUALITY_INSPECTION_STATUS_IN_PROGRESS = 2;
  QUALITY_INSPECTION_STATUS_PASSED = 3;
  QUALITY_INSPECTION_STATUS_FAILED = 4;
  QUALITY_INSPECTION_STATUS_RELEASED = 5;
  QUALITY_INSPECTION_STATUS_CANCELLED = 6;
}

// Disposable read-model representation. The write aggregate is never exposed
// through transport contracts.
message QualityInspection {
  string inspection_id = 1;
  uint64 source_version = 2;
  string reference = 3;
  erpx.common.v1.TenantScope scope = 4;
  string holding_id = 5;
  string company_id = 6;
  optional string branch_id = 7;
  QualityInspectionKind kind = 8;
  string product_id = 9;
  optional string lot_reference = 10;
  uint64 quantity = 11;
  uint64 passed_quantity = 12;
  uint64 failed_quantity = 13;
  QualityInspectionStatus status = 14;
  optional string disposition_note = 15;
  string created_at = 16;
  string updated_at = 17;
  string projected_at = 18;
}

message CreateQualityInspectionRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string inspection_id = 2;
  erpx.common.v1.TenantScope scope = 3;
  QualityInspectionKind kind = 4;
  string product_id = 5;
  optional string lot_reference = 6;
  uint64 quantity = 7;
}

message CreateQualityInspectionResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  QualityInspection inspection = 2;
}

message StartQualityInspectionRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string inspection_id = 2;
}

message StartQualityInspectionResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  QualityInspection inspection = 2;
}

message RecordQualityInspectionResultRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string inspection_id = 2;
  uint64 passed_quantity = 3;
  uint64 failed_quantity = 4;
  optional string disposition_note = 5;
}

message RecordQualityInspectionResultResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  QualityInspection inspection = 2;
}

message ReleaseQualityInspectionRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string inspection_id = 2;
}

message ReleaseQualityInspectionResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  QualityInspection inspection = 2;
}

message CancelQualityInspectionRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string inspection_id = 2;
}

message CancelQualityInspectionResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  QualityInspection inspection = 2;
}

message GetQualityInspectionRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string inspection_id = 2;
}

message GetQualityInspectionResponse {
  optional QualityInspection inspection = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}

message QualityInspectionFilter {
  optional QualityInspectionStatus status = 1;
  optional string product_id = 2;
  uint32 page_size = 3;
  optional string cursor = 4;
}

message ListQualityInspectionsRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  QualityInspectionFilter filter = 2;
}

message ListQualityInspectionsResponse {
  repeated QualityInspection inspections = 1;
  optional string next_cursor = 2;
  erpx.common.v1.QueryMetadata metadata = 3;
}

service QualityCommandService {
  rpc Create(CreateQualityInspectionRequest)
      returns (CreateQualityInspectionResponse);
  rpc Start(StartQualityInspectionRequest)
      returns (StartQualityInspectionResponse);
  rpc RecordResult(RecordQualityInspectionResultRequest)
      returns (RecordQualityInspectionResultResponse);
  rpc Release(ReleaseQualityInspectionRequest)
      returns (ReleaseQualityInspectionResponse);
  rpc Cancel(CancelQualityInspectionRequest)
      returns (CancelQualityInspectionResponse);
}

service QualityQueryService {
  rpc Get(GetQualityInspectionRequest) returns (GetQualityInspectionResponse);
  rpc List(ListQualityInspectionsRequest)
      returns (ListQualityInspectionsResponse);
}
