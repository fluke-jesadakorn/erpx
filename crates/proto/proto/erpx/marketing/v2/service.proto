syntax = "proto3";

package erpx.marketing.v2;

import "erpx/common/v2/context.proto";

message MarketingFormValue {
  string key = 1;
  string value = 2;
}

message SubmitMarketingFormRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string form_id = 3;
  string submission_id = 4;
  repeated MarketingFormValue values = 5;
  erpx.common.v2.CommandContext context = 6;
}
message MarketingContentWriteReceipt {
  string aggregate_type = 1;
  string aggregate_id = 2;
  uint64 version = 3;
  string idempotency_key = 4;
  string event_id = 5;
  bool replayed = 6;
}
message SubmitMarketingFormResponse {
  MarketingContentWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message EraseMarketingProfileRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string profile_id = 3;
  string reason = 4;
  string erased_at = 5;
  erpx.common.v2.CommandContext context = 6;
}
message MarketingProfileErasureReceipt {
  string profile_id = 1;
  string idempotency_key = 2;
  bool replayed = 3;
}
message EraseMarketingProfileResponse {
  MarketingProfileErasureReceipt receipt = 1;
  string correlation_id = 2;
}
message IssueMarketingPreviewRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string template_id = 3;
  uint64 template_version = 4;
  string expires_at = 5;
  erpx.common.v2.CommandContext context = 6;
}
message IssueMarketingPreviewResponse {
  MarketingContentWriteReceipt receipt = 1;
  string preview_id = 2;
  string token = 3;
  string expires_at = 4;
  string correlation_id = 5;
}
message RevokeMarketingPreviewRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string preview_id = 3;
  erpx.common.v2.CommandContext context = 4;
}
message RevokeMarketingPreviewResponse {
  MarketingContentWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message IssueMarketingDomainVerificationRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string domain_id = 3;
  erpx.common.v2.CommandContext context = 4;
}
message IssueMarketingDomainVerificationResponse {
  MarketingContentWriteReceipt receipt = 1;
  string challenge = 2;
  string correlation_id = 3;
}
message VerifyMarketingDomainRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string domain_id = 3;
  string proof = 4;
  erpx.common.v2.CommandContext context = 5;
}
message VerifyMarketingDomainResponse {
  MarketingContentWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message BindMarketingDomainRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string domain_id = 3;
  string template_id = 4;
  uint64 template_version = 5;
  erpx.common.v2.CommandContext context = 6;
}
message BindMarketingDomainResponse {
  MarketingContentWriteReceipt receipt = 1;
  string correlation_id = 2;
}

// Provider onboarding carries opaque secret-manager references only. Secret
// values and vendor access tokens never cross the protobuf boundary.
message MarketingProviderChannelRoute {
  string channel = 1;
  string endpoint = 2;
  string reconciliation_endpoint = 3;
}

message ConfigureMarketingProviderAccountRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string provider_account_id = 3;
  string provider_account_ref = 4;
  string provider_key = 5;
  string verifier_key_ref = 6;
  string outbound_credential_ref = 7;
  repeated string channels = 8;
  erpx.common.v2.CommandContext context = 9;
  repeated MarketingProviderChannelRoute channel_routes = 10;
  uint32 provider_priority = 11;
}
message AcknowledgeMarketingProviderVerificationRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string provider_account_id = 3;
  string verification_reference = 4;
  bool activate = 5;
  erpx.common.v2.CommandContext context = 6;
}
message SetMarketingProviderAccountStateRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string provider_account_id = 3;
  bool active = 4;
  erpx.common.v2.CommandContext context = 5;
}
message MarketingProviderAccountWriteReceipt {
  string provider_account_id = 1;
  string provider_account_ref = 2;
  string tenant_id = 3;
  string holding_ref = 4;
  string provider_key = 5;
  repeated string channels = 6;
  string state = 7;
  string onboarding_state = 8;
  uint64 version = 9;
  string changed_at = 10;
  bool replayed = 11;
  uint32 provider_priority = 12;
}
message ConfigureMarketingProviderAccountResponse {
  MarketingProviderAccountWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message AcknowledgeMarketingProviderVerificationResponse {
  MarketingProviderAccountWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message SetMarketingProviderAccountStateResponse {
  MarketingProviderAccountWriteReceipt receipt = 1;
  string correlation_id = 2;
}

message GetMarketingDeliveryReadRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string delivery_id = 3;
  erpx.common.v2.QueryContext context = 4;
}
message MarketingDeliveryRead {
  string delivery_id = 1;
  string holding_id = 2;
  string state = 3;
  uint32 attempt_count = 4;
  string next_attempt_at = 5;
  string expires_at = 6;
  uint64 version = 7;
  bool read_only = 8;
  bool present = 9;
}
message GetMarketingDeliveryReadResponse {
  MarketingDeliveryRead delivery = 1;
  string correlation_id = 2;
}

// Marketing content list reads expose replacement-projection metadata only.
// Aggregate state, object bytes, bearer tokens, provider references, and
// credential material remain outside this contract.
message ListMarketingContentReadRowsRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string aggregate_type = 3;
  uint32 page_size = 4;
  string after_id = 5;
  erpx.common.v2.QueryContext context = 6;
}
message MarketingContentReadRow {
  string aggregate_type = 1;
  string aggregate_id = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  string label = 6;
  string status = 7;
  uint64 source_version = 8;
  string source_event_id = 9;
  string projected_at = 10;
  bool read_only = 11;
  bool present = 12;
}
message ListMarketingContentReadRowsResponse {
  repeated MarketingContentReadRow rows = 1;
  bool has_more = 2;
  string next_after_id = 3;
  string correlation_id = 4;
}

// Directory administration is intentionally typed and secret-free. Bind
// credentials are referenced by an opaque secret-manager reference; raw
// passwords, cookies, certificates, and directory entries never cross this
// contract.

// Typed Marketing CQRS contract for owner-authorized lead and content flows.
enum MarketingLeadCandidateStatus {
  MARKETING_LEAD_CANDIDATE_STATUS_UNSPECIFIED = 0;
  MARKETING_LEAD_CANDIDATE_STATUS_OPEN = 1;
  MARKETING_LEAD_CANDIDATE_STATUS_QUALIFIED = 2;
  MARKETING_LEAD_CANDIDATE_STATUS_REJECTED = 3;
}

message MarketingLeadCandidate {
  string lead_id = 1;
  uint64 source_version = 2;
  erpx.common.v2.TenantScope scope = 3;
  string campaign_id = 4;
  string audience_member_id = 5;
  string source = 6;
  optional string existing_customer_id = 7;
  optional uint32 score_basis_points = 8;
  MarketingLeadCandidateStatus status = 9;
  uint64 engagement_count = 10;
  string created_at = 11;
  string updated_at = 12;
  string projected_at = 13;
}

message CreateLeadCandidateRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string lead_id = 2;
  string campaign_id = 3;
  string audience_member_id = 4;
  string source = 5;
  optional string existing_customer_id = 6;
}
message CaptureMarketingEngagementRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string lead_id = 2;
  string channel = 3;
  string action = 4;
}
message QualifyLeadCandidateRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string lead_id = 2;
  uint32 score_basis_points = 3;
}
message RejectLeadCandidateRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string lead_id = 2;
}
message MarketingLeadCandidateMutationResponse {
  erpx.common.v2.CommandReceipt receipt = 1;
  MarketingLeadCandidate candidate = 2;
}
message GetLeadCandidateRequest {
  erpx.common.v2.QueryRequestMetadata metadata = 1;
  string lead_id = 2;
}
message GetLeadCandidateResponse {
  optional MarketingLeadCandidate candidate = 1;
  erpx.common.v2.QueryMetadata metadata = 2;
}
message ListLeadCandidatesRequest {
  erpx.common.v2.QueryRequestMetadata metadata = 1;
  optional MarketingLeadCandidateStatus status = 2;
  uint32 page_size = 3;
  optional string cursor = 4;
}
message ListLeadCandidatesResponse {
  repeated MarketingLeadCandidate candidates = 1;
  optional string next_cursor = 2;
  erpx.common.v2.QueryMetadata metadata = 3;
}

service MarketingCommandService {
  rpc SubmitMarketingForm(SubmitMarketingFormRequest)
      returns (SubmitMarketingFormResponse);
  rpc EraseMarketingProfile(EraseMarketingProfileRequest)
      returns (EraseMarketingProfileResponse);
  rpc IssueMarketingPreview(IssueMarketingPreviewRequest)
      returns (IssueMarketingPreviewResponse);
  rpc RevokeMarketingPreview(RevokeMarketingPreviewRequest)
      returns (RevokeMarketingPreviewResponse);
  rpc IssueMarketingDomainVerification(IssueMarketingDomainVerificationRequest)
      returns (IssueMarketingDomainVerificationResponse);
  rpc VerifyMarketingDomain(VerifyMarketingDomainRequest)
      returns (VerifyMarketingDomainResponse);
  rpc BindMarketingDomain(BindMarketingDomainRequest)
      returns (BindMarketingDomainResponse);
  rpc ConfigureMarketingProviderAccount(ConfigureMarketingProviderAccountRequest)
      returns (ConfigureMarketingProviderAccountResponse);
  rpc AcknowledgeMarketingProviderVerification(AcknowledgeMarketingProviderVerificationRequest)
      returns (AcknowledgeMarketingProviderVerificationResponse);
  rpc SetMarketingProviderAccountState(SetMarketingProviderAccountStateRequest)
      returns (SetMarketingProviderAccountStateResponse);
  rpc CreateLeadCandidate(CreateLeadCandidateRequest)
      returns (MarketingLeadCandidateMutationResponse);
  rpc CaptureEngagement(CaptureMarketingEngagementRequest)
      returns (MarketingLeadCandidateMutationResponse);
  rpc QualifyLeadCandidate(QualifyLeadCandidateRequest)
      returns (MarketingLeadCandidateMutationResponse);
  rpc RejectLeadCandidate(RejectLeadCandidateRequest)
      returns (MarketingLeadCandidateMutationResponse);
}

service MarketingQueryService {
  rpc GetMarketingDeliveryRead(GetMarketingDeliveryReadRequest)
      returns (GetMarketingDeliveryReadResponse);
  rpc ListMarketingContentReadRows(ListMarketingContentReadRowsRequest)
      returns (ListMarketingContentReadRowsResponse);
  rpc GetLeadCandidate(GetLeadCandidateRequest)
      returns (GetLeadCandidateResponse);
  rpc ListLeadCandidates(ListLeadCandidatesRequest)
      returns (ListLeadCandidatesResponse);
}
