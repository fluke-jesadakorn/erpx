syntax = "proto3";

package erpx.organization.v2;

import "erpx/common/v2/context.proto";

message SaveOrganizationNodeRequest {
  string tenant_id = 1;
  string kind = 2;
  string node_id = 3;
  string holding_id = 4;
  string company_id = 5;
  string branch_id = 6;
  string department_id = 7;
  string code = 8;
  string name = 9;
  string registration_number = 10;
  string status = 11;
  bool has_expected_version = 12;
  uint64 expected_version = 13;
  erpx.common.v2.CommandContext context = 14;
}
message SaveOrganizationNodeResponse {
  string kind = 1;
  string node_id = 2;
  uint64 aggregate_version = 3;
  string event_id = 4;
  bool applied = 5;
  string correlation_id = 6;
}

// Branch creation is an infrastructure lifecycle, not a generic organization
// insert. Physical database keys and profile credentials never cross this
// boundary.
message ProvisionBranchRequest {
  string tenant_id = 1;
  string company_id = 2;
  string branch_id = 3;
  string branch_code = 4;
  string branch_name = 5;
  string registration_number = 6;
  string database_profile_key = 7;
  repeated string enabled_business_units = 8;
  erpx.common.v2.CommandContext context = 9;
  string mfa_code = 10;
}
message BranchProvisioningSummary {
  string job_id = 1;
  string tenant_id = 2;
  string branch_id = 3;
  string branch_code = 4;
  string branch_name = 5;
  repeated string enabled_business_units = 6;
  string state = 7;
  uint32 attempt_count = 8;
  string failure_category = 9;
  string created_at = 10;
  string updated_at = 11;
  string completed_at = 12;
  uint64 route_version = 13;
  string correlation_id = 14;
}
message ProvisionBranchResponse {
  BranchProvisioningSummary provisioning = 1;
  string correlation_id = 2;
}
message GetBranchProvisioningRequest {
  string tenant_id = 1;
  string job_id = 2;
  erpx.common.v2.QueryContext context = 3;
}
message GetBranchProvisioningResponse {
  BranchProvisioningSummary provisioning = 1;
  string correlation_id = 2;
}
message ListBranchProvisioningsRequest {
  string tenant_id = 1;
  uint32 page_size = 2;
  erpx.common.v2.QueryContext context = 3;
}
message ListBranchProvisioningsResponse {
  repeated BranchProvisioningSummary provisionings = 1;
  string correlation_id = 2;
}
message RetryBranchProvisioningRequest {
  string tenant_id = 1;
  string job_id = 2;
  erpx.common.v2.CommandContext context = 3;
  string mfa_code = 4;
}
message RetryBranchProvisioningResponse {
  BranchProvisioningSummary provisioning = 1;
  string correlation_id = 2;
}
message SuspendBranchRouteRequest {
  string tenant_id = 1;
  string branch_id = 2;
  erpx.common.v2.CommandContext context = 3;
  string mfa_code = 4;
}
message SuspendBranchRouteResponse {
  string tenant_id = 1;
  string branch_id = 2;
  string state = 3;
  uint64 route_version = 4;
  string correlation_id = 5;
}
message ListOrganizationNodesRequest {
  string tenant_id = 1;
  string kind = 2;
  string holding_id = 3;
  uint32 page_size = 4;
  string after_cursor = 5;
  erpx.common.v2.QueryContext context = 6;
}
message OrganizationNode {
  string kind = 1;
  string node_id = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  string department_id = 6;
  string code = 7;
  string name = 8;
  string registration_number = 9;
  string status = 10;
  uint64 aggregate_version = 11;
  string updated_at = 12;
}
message ListOrganizationNodesResponse {
  repeated OrganizationNode nodes = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}


enum OrganizationNodeKindV1 {
  ORGANIZATION_NODE_KIND_V1_UNSPECIFIED = 0;
  ORGANIZATION_NODE_KIND_V1_HOLDING = 1;
  ORGANIZATION_NODE_KIND_V1_COMPANY = 2;
  ORGANIZATION_NODE_KIND_V1_HEADQUARTERS = 3;
  ORGANIZATION_NODE_KIND_V1_BRANCH = 4;
  ORGANIZATION_NODE_KIND_V1_DEPARTMENT = 5;
  ORGANIZATION_NODE_KIND_V1_TEAM = 6;
}

enum OrganizationNodeStatusV1 {
  ORGANIZATION_NODE_STATUS_V1_UNSPECIFIED = 0;
  ORGANIZATION_NODE_STATUS_V1_ACTIVE = 1;
  ORGANIZATION_NODE_STATUS_V1_SUSPENDED = 2;
  ORGANIZATION_NODE_STATUS_V1_ARCHIVED = 3;
}

message OrganizationHoldingPlacement {}
message OrganizationCompanyPlacement {
  string holding_id = 1;
}
message OrganizationHeadquartersPlacement {
  string holding_id = 1;
  string company_id = 2;
}
message OrganizationBranchPlacement {
  string holding_id = 1;
  string company_id = 2;
}
message OrganizationDepartmentPlacement {
  string holding_id = 1;
  string company_id = 2;
  optional string branch_id = 3;
}
message OrganizationTeamPlacement {
  string holding_id = 1;
  string company_id = 2;
  optional string branch_id = 3;
  string department_id = 4;
  string team_id = 5;
}

message OrganizationPlacementV1 {
  oneof placement {
    OrganizationHoldingPlacement holding = 1;
    OrganizationCompanyPlacement company = 2;
    OrganizationHeadquartersPlacement headquarters = 3;
    OrganizationBranchPlacement branch = 4;
    OrganizationDepartmentPlacement department = 5;
    OrganizationTeamPlacement team = 6;
  }
}

message OrganizationNodeRecord {
  string node_id = 1;
  uint64 source_version = 2;
  OrganizationNodeKindV1 kind = 3;
  OrganizationNodeStatusV1 status = 4;
  OrganizationPlacementV1 placement = 5;
  optional string parent_node_id = 6;
  erpx.common.v2.TenantScope scope = 7;
  string code = 8;
  string display_name = 9;
  string created_at = 10;
  string updated_at = 11;
  string projected_at = 12;
}

message CreateOrganizationNodeCommandRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string node_id = 2;
  OrganizationPlacementV1 placement = 3;
  string code = 4;
  string display_name = 5;
}

message RenameOrganizationNodeRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string node_id = 2;
  string display_name = 3;
}

message ChangeOrganizationNodeCodeRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string node_id = 2;
  string code = 3;
}

message ReparentOrganizationNodeRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string node_id = 2;
  OrganizationPlacementV1 placement = 3;
}

message OrganizationNodeLifecycleRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string node_id = 2;
}

message OrganizationNodeCommandResponse {
  erpx.common.v2.CommandReceipt receipt = 1;
  OrganizationNodeRecord node = 2;
}

message GetOrganizationNodeRequest {
  erpx.common.v2.QueryRequestMetadata metadata = 1;
  string node_id = 2;
}

message GetOrganizationNodeResponse {
  optional OrganizationNodeRecord node = 1;
  erpx.common.v2.QueryMetadata metadata = 2;
}

message ListOrganizationNodeRecordsRequest {
  erpx.common.v2.QueryRequestMetadata metadata = 1;
  optional OrganizationNodeKindV1 kind = 2;
  optional OrganizationNodeStatusV1 status = 3;
  optional string parent_node_id = 4;
  uint32 page_size = 5;
  optional string cursor = 6;
}

message ListOrganizationNodeRecordsResponse {
  repeated OrganizationNodeRecord nodes = 1;
  optional string next_cursor = 2;
  erpx.common.v2.QueryMetadata metadata = 3;
}

service OrganizationCommandService {
  rpc CreateNode(CreateOrganizationNodeCommandRequest)
      returns (OrganizationNodeCommandResponse);
  rpc RenameNode(RenameOrganizationNodeRequest)
      returns (OrganizationNodeCommandResponse);
  rpc ChangeNodeCode(ChangeOrganizationNodeCodeRequest)
      returns (OrganizationNodeCommandResponse);
  rpc ReparentNode(ReparentOrganizationNodeRequest)
      returns (OrganizationNodeCommandResponse);
  rpc SuspendNode(OrganizationNodeLifecycleRequest)
      returns (OrganizationNodeCommandResponse);
  rpc ActivateNode(OrganizationNodeLifecycleRequest)
      returns (OrganizationNodeCommandResponse);
  rpc ArchiveNode(OrganizationNodeLifecycleRequest)
      returns (OrganizationNodeCommandResponse);
}

service OrganizationQueryService {
  rpc GetNode(GetOrganizationNodeRequest) returns (GetOrganizationNodeResponse);
  rpc ListNodes(ListOrganizationNodeRecordsRequest)
      returns (ListOrganizationNodeRecordsResponse);
}
