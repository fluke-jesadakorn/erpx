syntax = "proto3";

package erpx.assets.v1;

import "erpx/common/v1/context.proto";

enum AssetStatus {
  ASSET_STATUS_UNSPECIFIED = 0;
  ASSET_STATUS_DRAFT = 1;
  ASSET_STATUS_IN_SERVICE = 2;
  ASSET_STATUS_UNDER_MAINTENANCE = 3;
  ASSET_STATUS_RETIRED = 4;
}
enum AssetCondition {
  ASSET_CONDITION_UNSPECIFIED = 0;
  ASSET_CONDITION_OPERATIONAL = 1;
  ASSET_CONDITION_DEGRADED = 2;
  ASSET_CONDITION_OUT_OF_SERVICE = 3;
  ASSET_CONDITION_RETIRED = 4;
}
message AssetLifecycleRecord {
  optional string placed_in_service_at = 1;
  optional string retired_at = 2;
}
message AssetRecord {
  string asset_id = 1;
  uint64 source_version = 2;
  string code = 3;
  string name = 4;
  erpx.common.v1.TenantScope scope = 5;
  string location_id = 6;
  AssetStatus status = 7;
  AssetCondition condition = 8;
  AssetLifecycleRecord lifecycle = 9;
  string created_at = 10;
  string updated_at = 11;
  string projected_at = 12;
}
message CreateAssetRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string asset_id = 2;
  string code = 3;
  string name = 4;
  erpx.common.v1.TenantScope scope = 5;
  string location_id = 6;
}
message AssetIdentityCommandRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string asset_id = 2;
}
message BeginAssetMaintenanceRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string asset_id = 2;
  string request_code = 3;
  string title = 4;
}
message AssetMutationResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  AssetRecord asset = 2;
}
message GetAssetRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string asset_id = 2;
}
message GetAssetResponse {
  optional AssetRecord asset = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}
message ListAssetsRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  optional AssetStatus status = 2;
  optional string location_id = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}
message ListAssetsResponse {
  repeated AssetRecord assets = 1;
  optional string next_cursor = 2;
  erpx.common.v1.QueryMetadata metadata = 3;
}

service AssetsCommandService {
  rpc Create(CreateAssetRequest) returns (AssetMutationResponse);
  rpc PlaceInService(AssetIdentityCommandRequest) returns (AssetMutationResponse);
  rpc MarkDegraded(AssetIdentityCommandRequest) returns (AssetMutationResponse);
  rpc BeginMaintenance(BeginAssetMaintenanceRequest) returns (AssetMutationResponse);
  rpc ReturnToService(AssetIdentityCommandRequest) returns (AssetMutationResponse);
  rpc Retire(AssetIdentityCommandRequest) returns (AssetMutationResponse);
}

service AssetsQueryService {
  rpc Get(GetAssetRequest) returns (GetAssetResponse);
  rpc List(ListAssetsRequest) returns (ListAssetsResponse);
}
