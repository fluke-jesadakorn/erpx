syntax = "proto3";
package erpx.planning.v2;

import "erpx/common/v2/context.proto";

message FixedQuantity { sint64 units = 1; uint32 scale = 2; }
message RecordRef { string record_id = 1; string owner_context = 2; string record_type = 3; }
message VersionPin { RecordRef record = 1; uint64 version = 2; }
message MutationReceipt {
  repeated string aggregate_ids = 1;
  bool replayed = 2;
  // Aligned with aggregate_ids so callers can perform read-your-writes waits
  // without guessing a committed aggregate version.
  repeated uint64 aggregate_versions = 3;
}
message DemandFact { string demand_id = 1; RecordRef item = 2; RecordRef location = 3; FixedQuantity quantity = 4; string required_on = 5; VersionPin source = 6; }
message SupplyFact { string supply_id = 1; RecordRef item = 2; RecordRef location = 3; FixedQuantity quantity = 4; string available_on = 5; VersionPin source = 6; }
message CapacityFact { string demand_id = 1; RecordRef resource = 2; string bucket = 3; uint64 required_seconds = 4; uint64 available_seconds = 5; }
message SourcingRule { RecordRef item = 1; string kind = 2; optional RecordRef source_location = 3; uint32 lead_time_days = 4; }
message CreateScenarioRequest { erpx.common.v2.CommandContext context = 1; string scenario_id = 2; erpx.common.v2.TenantScope scope = 3; repeated string modes = 4; uint64 input_position = 5; repeated VersionPin input_pins = 6; string policy_id = 7; uint64 policy_version = 8; repeated DemandFact demands = 9; repeated SupplyFact supplies = 10; repeated CapacityFact capacity = 11; repeated SourcingRule sourcing = 12; }
message ScenarioCommandRequest { erpx.common.v2.CommandContext context = 1; erpx.common.v2.TenantScope scenario_scope = 2; string scenario_id = 3; }
message RunScenarioRequest { erpx.common.v2.CommandContext context = 1; erpx.common.v2.TenantScope scenario_scope = 2; string scenario_id = 3; string run_id = 4; }
message RecommendationOverrideRequest { erpx.common.v2.CommandContext context = 1; erpx.common.v2.TenantScope recommendation_scope = 2; string recommendation_id = 3; string override_id = 4; FixedQuantity previous_quantity = 5; FixedQuantity revised_quantity = 6; string reason = 7; }
message RecommendationCommandRequest { erpx.common.v2.CommandContext context = 1; erpx.common.v2.TenantScope recommendation_scope = 2; string recommendation_id = 3; string release_id = 4; }
message GetPlanningRecordRequest { erpx.common.v2.QueryContext context = 1; erpx.common.v2.TenantScope record_scope = 2; string record_id = 3; }
message PlanningRecordResponse { string record_id = 1; uint64 version = 2; string lifecycle_state = 3; bytes projection_json_utf8 = 4; uint64 source_position = 5; }
message ListPlanningRecordsRequest { erpx.common.v2.QueryContext context = 1; erpx.common.v2.TenantScope record_scope = 2; uint32 page_size = 3; string cursor = 4; }
message ListPlanningRecordsResponse { repeated PlanningRecordResponse records = 1; string next_cursor = 2; }

service PlanningCommandService {
  rpc CreateScenario(CreateScenarioRequest) returns (MutationReceipt);
  rpc FreezeScenario(ScenarioCommandRequest) returns (MutationReceipt);
  rpc RunScenario(RunScenarioRequest) returns (MutationReceipt);
  rpc OverrideRecommendation(RecommendationOverrideRequest) returns (MutationReceipt);
  rpc ApproveRecommendation(RecommendationCommandRequest) returns (MutationReceipt);
  rpc RejectRecommendation(RecommendationCommandRequest) returns (MutationReceipt);
  rpc ReleaseRecommendation(RecommendationCommandRequest) returns (MutationReceipt);
}
service PlanningQueryService {
  rpc GetScenario(GetPlanningRecordRequest) returns (PlanningRecordResponse);
  rpc GetRecommendation(GetPlanningRecordRequest) returns (PlanningRecordResponse);
  rpc GetRun(GetPlanningRecordRequest) returns (PlanningRecordResponse);
  rpc ListRecommendations(ListPlanningRecordsRequest) returns (ListPlanningRecordsResponse);
  rpc ListShortages(ListPlanningRecordsRequest) returns (ListPlanningRecordsResponse);
  rpc ListCapacityOverloads(ListPlanningRecordsRequest) returns (ListPlanningRecordsResponse);
  rpc GetPlan(GetPlanningRecordRequest) returns (PlanningRecordResponse);
}
