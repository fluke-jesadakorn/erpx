syntax = "proto3";

package erpx.customer_authority.v1;

import "erpx/common/v1/context.proto";

message CustomerSummary {
  string id = 1;
  string account_code = 2;
  string trading_name = 3;
  string legal_name = 4;
  string country = 5;
  string status = 6;
  string billing_state = 7;
  string health = 8;
  uint32 holding_count = 9;
  uint32 company_count = 10;
  uint32 branch_count = 11;
  uint32 active_user_count = 12;
  uint32 expiring_role_count = 13;
  uint32 open_ticket_count = 14;
  uint32 module_count = 15;
  uint32 projection_lag_seconds = 16;
}

message ListCustomersRequest {
  string search = 1;
  erpx.common.v1.QueryContext context = 2;
}
message ListCustomersResponse { repeated CustomerSummary customers = 1; }
message GetCustomerRequest {
  string customer_id = 1;
  string purpose = 2;
  erpx.common.v1.QueryContext context = 3;
}
message GetCustomerResponse { CustomerSummary customer = 1; string correlation_id = 2; }

message GetCustomerProjectionRequest {
  string customer_id = 1;
  string projection = 2;
  string purpose = 3;
  erpx.common.v1.QueryContext context = 4;
}
message GetCustomerProjectionResponse {
  string customer_id = 1;
  string projection = 2;
  bytes payload_json = 3;
  string projection_updated_at = 4;
  string freshness = 5;
  bool read_only = 6;
  string correlation_id = 7;
  bool supported = 8;
  string unsupported_reason = 9;
  bool present = 10;
}
message GetCustomer360DetailRequest {
  string customer_id = 1;
  string purpose = 2;
  erpx.common.v1.QueryContext context = 3;
  uint32 notes_page_size = 4;
  string notes_before_occurred_at = 5;
  string notes_before_id = 6;
}
message CustomerNote {
  string id = 1;
  string author_ref = 2;
  string created_at = 3;
  string body = 4;
}
message Customer360SectionState {
  string section = 1;
  string state = 2;
}
// Bounded, server-allowlisted scalar facts for the Customer 360 detail view.
// Raw projection payloads and credential-bearing fields never cross this
// boundary.
message Customer360SectionFact {
  string section = 1;
  string key = 2;
  string value = 3;
}
message GetCustomer360DetailResponse {
  string customer_id = 1;
  bytes payload_json = 2;
  string projection_updated_at = 3;
  string freshness = 4;
  bool read_only = 5;
  string correlation_id = 6;
  bool supported = 7;
  string unsupported_reason = 8;
  bool present = 9;
  repeated CustomerNote notes = 10;
  string notes_next_before_occurred_at = 11;
  string notes_next_before_id = 12;
  repeated Customer360SectionState section_states = 13;
  repeated Customer360SectionFact section_facts = 14;
}
message AddCustomerNoteRequest {
  string customer_id = 1;
  string note_id = 2;
  string body = 3;
  erpx.common.v1.CommandContext context = 4;
}
message CustomerNoteWriteReceipt {
  string aggregate_type = 1;
  string aggregate_id = 2;
  uint64 aggregate_version = 3;
  string event_id = 4;
  bool replayed = 5;
}
message AddCustomerNoteResponse {
  CustomerNote note = 1;
  CustomerNoteWriteReceipt receipt = 2;
  string correlation_id = 3;
}

// Platform Operations reads expose only safe registry/readiness metadata.
// Database keys, storage namespaces, credential references, and backup
// references are never part of this transport contract.
message CustomerAccessAuditEntry {
  string audit_id = 1;
  string actor_ref = 2;
  string session_ref = 3;
  string customer_id = 4;
  string module = 5;
  string scope = 6;
  string purpose = 7;
  string occurred_at = 8;
  string correlation_id = 9;
}

message GetCustomerAccessAuditRequest {
  string customer_id = 1;
  string purpose = 2;
  erpx.common.v1.QueryContext context = 3;
  uint32 page_size = 4;
  string before_occurred_at = 5;
  string before_audit_id = 6;
}

message GetCustomerAccessAuditResponse {
  string customer_id = 1;
  repeated CustomerAccessAuditEntry entries = 2;
  string next_before_occurred_at = 3;
  string next_before_audit_id = 4;
  string projection_updated_at = 5;
  string freshness = 6;
  bool read_only = 7;
  string correlation_id = 8;
  bool present = 9;
}

// Tenant-local organization commands and rebuildable reads. The tenant ID is
// an opaque route reference; database keys and credentials never cross this
// transport boundary.

// Typed, read-only access-audit boundary with a bounded customer-visible
// contract.

// Stable typed boundaries for Customer Authority records and mutations.


// Customer Authority owns canonical customer identity, lifecycle, and exact
// holding/company/branch authority links. Registration and tax identifiers are
// accepted only on commands and are deliberately absent from query records.
enum CustomerAuthorityStatus {
  CUSTOMER_AUTHORITY_STATUS_UNSPECIFIED = 0;
  CUSTOMER_AUTHORITY_STATUS_PROSPECT = 1;
  CUSTOMER_AUTHORITY_STATUS_ONBOARDING = 2;
  CUSTOMER_AUTHORITY_STATUS_ACTIVE = 3;
  CUSTOMER_AUTHORITY_STATUS_SUSPENDED = 4;
  CUSTOMER_AUTHORITY_STATUS_CHURNED = 5;
}

message CustomerAuthorityIdentityInput {
  string trading_name = 1;
  optional string legal_name = 2;
  optional string registration_number = 3;
  optional string tax_identifier = 4;
  string country = 5;
}

message CustomerAuthorityRecord {
  string customer_id = 1;
  uint64 aggregate_version = 2;
  string customer_code = 3;
  string trading_name = 4;
  optional string legal_name = 5;
  string country = 6;
  CustomerAuthorityStatus status = 7;
  erpx.common.v1.TenantScope primary_authority = 8;
  repeated erpx.common.v1.TenantScope authority_links = 9;
  optional string merged_into_customer_id = 10;
  string created_at = 11;
  string updated_at = 12;
}

message CreateCustomerAuthorityRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string customer_id = 2;
  string customer_code = 3;
  CustomerAuthorityIdentityInput identity = 4;
  erpx.common.v1.TenantScope primary_authority = 5;
}
message CreateCustomerAuthorityResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  CustomerAuthorityRecord customer = 2;
}

message UpdateCustomerAuthorityIdentityRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string customer_id = 2;
  CustomerAuthorityIdentityInput identity = 3;
}
message UpdateCustomerAuthorityIdentityResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  CustomerAuthorityRecord customer = 2;
}

message ChangeCustomerAuthorityStatusRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string customer_id = 2;
  CustomerAuthorityStatus status = 3;
}
message ChangeCustomerAuthorityStatusResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  CustomerAuthorityRecord customer = 2;
}

message LinkCustomerAuthorityRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string customer_id = 2;
  erpx.common.v1.TenantScope authority = 3;
}
message LinkCustomerAuthorityResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  CustomerAuthorityRecord customer = 2;
}

message UnlinkCustomerAuthorityRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string customer_id = 2;
  erpx.common.v1.TenantScope authority = 3;
}
message UnlinkCustomerAuthorityResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  CustomerAuthorityRecord customer = 2;
}

message MergeCustomerAuthorityRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string retired_customer_id = 2;
  string surviving_customer_id = 3;
}
message MergeCustomerAuthorityResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  CustomerAuthorityRecord retired_customer = 2;
}

message GetCustomerAuthorityRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string customer_id = 2;
}
message GetCustomerAuthorityResponse {
  optional CustomerAuthorityRecord customer = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}

message CustomerAuthorityListFilter {
  optional string search = 1;
  optional CustomerAuthorityStatus status = 2;
  bool include_merged = 3;
  uint32 page_size = 4;
  optional string after_customer_code = 5;
}
message ListCustomerAuthoritiesRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  CustomerAuthorityListFilter filter = 2;
}
message ListCustomerAuthoritiesResponse {
  repeated CustomerAuthorityRecord customers = 1;
  optional string next_cursor = 2;
  erpx.common.v1.QueryMetadata metadata = 3;
}

service CustomerAuthorityCommandService {
  rpc Create(CreateCustomerAuthorityRequest)
      returns (CreateCustomerAuthorityResponse);
  rpc UpdateIdentity(UpdateCustomerAuthorityIdentityRequest)
      returns (UpdateCustomerAuthorityIdentityResponse);
  rpc ChangeStatus(ChangeCustomerAuthorityStatusRequest)
      returns (ChangeCustomerAuthorityStatusResponse);
  rpc LinkAuthority(LinkCustomerAuthorityRequest)
      returns (LinkCustomerAuthorityResponse);
  rpc UnlinkAuthority(UnlinkCustomerAuthorityRequest)
      returns (UnlinkCustomerAuthorityResponse);
  rpc Merge(MergeCustomerAuthorityRequest)
      returns (MergeCustomerAuthorityResponse);
}

service CustomerAuthorityQueryService {
  rpc Get(GetCustomerAuthorityRequest) returns (GetCustomerAuthorityResponse);
  rpc List(ListCustomerAuthoritiesRequest)
      returns (ListCustomerAuthoritiesResponse);
  rpc GetCustomerAccessAudit(GetCustomerAccessAuditRequest)
      returns (GetCustomerAccessAuditResponse);
}
