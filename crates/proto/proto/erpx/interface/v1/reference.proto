syntax = "proto3";

package erpx.interface.v1;

enum AuthorityScopeLevel {
  AUTHORITY_SCOPE_LEVEL_UNSPECIFIED = 0;
  AUTHORITY_SCOPE_LEVEL_PLATFORM = 1;
  AUTHORITY_SCOPE_LEVEL_HOLDING = 2;
  AUTHORITY_SCOPE_LEVEL_COMPANY = 3;
  AUTHORITY_SCOPE_LEVEL_BRANCH = 4;
}

message AuthorityScope {
  string tenant_id = 1;
  AuthorityScopeLevel level = 2;
  optional string holding_id = 3;
  optional string company_id = 4;
  optional string branch_id = 5;
}

message RecordRef {
  string id = 1;
  string owner_context = 2;
  string record_type = 3;
}

message ItemDescriptor {
  RecordRef record = 1;
  AuthorityScope scope = 2;
  string canonical_route = 3;
  string lifecycle_state = 4;
  string authorization_policy_id = 5;
  string classification = 6;
  uint64 descriptor_version = 7;
  uint64 source_event_position = 8;
}

enum DirectoryFreshness {
  DIRECTORY_FRESHNESS_UNSPECIFIED = 0;
  DIRECTORY_FRESHNESS_FRESH = 1;
  DIRECTORY_FRESHNESS_STALE = 2;
  DIRECTORY_FRESHNESS_UNAVAILABLE = 3;
}

message ResolveReferenceRequest {
  string record_id = 1;
  AuthorityScope authority_scope = 2;
  string purpose = 3;
}

message ResolveReferenceResponse {
  // Absent and denied both return found=false with every protected field empty.
  bool found = 1;
  optional ItemDescriptor descriptor = 2;
  DirectoryFreshness freshness = 3;
}

message SearchItemsRequest {
  AuthorityScope authority_scope = 1;
  string purpose = 2;
  string query = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}

message SearchItemsResponse {
  repeated ItemDescriptor items = 1;
  optional string next_cursor = 2;
  uint64 authorized_count = 3;
  DirectoryFreshness freshness = 4;
}

message ListBacklinksRequest {
  string record_id = 1;
  AuthorityScope authority_scope = 2;
  string purpose = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}

message ListBacklinksResponse {
  repeated RecordRef incoming = 1;
  repeated RecordRef outgoing = 2;
  optional string next_cursor = 3;
  uint64 authorized_count = 4;
  DirectoryFreshness freshness = 5;
}

message StreamRequest {
  AuthorityScope authority_scope = 1;
  optional string cursor = 2;
}

message StreamEvent {
  string event_id = 1;
  string event_type = 2;
  uint64 position = 3;
}
