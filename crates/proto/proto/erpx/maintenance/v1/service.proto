syntax = "proto3";

package erpx.maintenance.v1;

import "erpx/common/v1/context.proto";
import "erpx/assets/v1/service.proto";

enum MaintenanceWorkOrderStatus {
  MAINTENANCE_WORK_ORDER_STATUS_UNSPECIFIED = 0;
  MAINTENANCE_WORK_ORDER_STATUS_PLANNED = 1;
  MAINTENANCE_WORK_ORDER_STATUS_SCHEDULED = 2;
  MAINTENANCE_WORK_ORDER_STATUS_IN_PROGRESS = 3;
  MAINTENANCE_WORK_ORDER_STATUS_BLOCKED = 4;
  MAINTENANCE_WORK_ORDER_STATUS_COMPLETED = 5;
  MAINTENANCE_WORK_ORDER_STATUS_CANCELLED = 6;
}
message AssetMaintenanceRequestEvent {
  string event_id = 1;
  uint32 event_version = 2;
  erpx.common.v1.TenantScope tenant_scope = 3;
  string aggregate_id = 4;
  uint64 aggregate_version = 5;
  string correlation_id = 6;
  optional string causation_id = 7;
  string occurred_at = 8;
  string asset_id = 9;
  string request_code = 10;
  optional string title = 11;
}
message MaintenanceRequestRecord {
  string source_event_id = 1;
  uint64 source_aggregate_version = 2;
  string asset_id = 3;
  string request_code = 4;
}
message AssetConditionFactRecord {
  string asset_id = 1;
  string asset_code = 2;
  string name = 3;
  string location_id = 4;
  erpx.assets.v1.AssetCondition condition = 5;
}
message DowntimeRecord {
  string downtime_id = 1;
  string started_at = 2;
  string ended_at = 3;
  string reason = 4;
}
message MaintenanceWorkOrderRecord {
  string work_order_id = 1;
  uint64 source_version = 2;
  string code = 3;
  erpx.common.v1.TenantScope scope = 4;
  MaintenanceRequestRecord request = 5;
  AssetConditionFactRecord asset_fact = 6;
  string title = 7;
  MaintenanceWorkOrderStatus status = 8;
  optional string scheduled_for = 9;
  optional string started_at = 10;
  optional string completed_at = 11;
  repeated DowntimeRecord downtime = 12;
  string created_at = 13;
  string updated_at = 14;
  string projected_at = 15;
}
message OpenMaintenanceWorkOrderRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string work_order_id = 2;
  AssetMaintenanceRequestEvent request = 3;
  string title = 4;
}
message ScheduleMaintenanceWorkOrderRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string work_order_id = 2;
  string scheduled_for = 3;
}
message MaintenanceWorkOrderIdentityRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string work_order_id = 2;
}
message RecordMaintenanceDowntimeRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string work_order_id = 2;
  DowntimeRecord downtime = 3;
}
message MaintenanceWorkOrderMutationResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  MaintenanceWorkOrderRecord work_order = 2;
}
message GetMaintenanceWorkOrderRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string work_order_id = 2;
}
message GetMaintenanceWorkOrderResponse {
  optional MaintenanceWorkOrderRecord work_order = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}
message ListMaintenanceWorkOrdersRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  optional MaintenanceWorkOrderStatus status = 2;
  optional string asset_id = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}
message ListMaintenanceWorkOrdersResponse {
  repeated MaintenanceWorkOrderRecord work_orders = 1;
  optional string next_cursor = 2;
  erpx.common.v1.QueryMetadata metadata = 3;
}

service MaintenanceCommandService {
  rpc Open(OpenMaintenanceWorkOrderRequest)
      returns (MaintenanceWorkOrderMutationResponse);
  rpc Schedule(ScheduleMaintenanceWorkOrderRequest)
      returns (MaintenanceWorkOrderMutationResponse);
  rpc Start(MaintenanceWorkOrderIdentityRequest)
      returns (MaintenanceWorkOrderMutationResponse);
  rpc Block(MaintenanceWorkOrderIdentityRequest)
      returns (MaintenanceWorkOrderMutationResponse);
  rpc Resume(MaintenanceWorkOrderIdentityRequest)
      returns (MaintenanceWorkOrderMutationResponse);
  rpc Complete(MaintenanceWorkOrderIdentityRequest)
      returns (MaintenanceWorkOrderMutationResponse);
  rpc Cancel(MaintenanceWorkOrderIdentityRequest)
      returns (MaintenanceWorkOrderMutationResponse);
  rpc RecordDowntime(RecordMaintenanceDowntimeRequest)
      returns (MaintenanceWorkOrderMutationResponse);
}

service MaintenanceQueryService {
  rpc Get(GetMaintenanceWorkOrderRequest)
      returns (GetMaintenanceWorkOrderResponse);
  rpc List(ListMaintenanceWorkOrdersRequest)
      returns (ListMaintenanceWorkOrdersResponse);
}
