syntax = "proto3";

package erpx.finance.v1;

import "erpx/common/v1/context.proto";

message ListFinanceJournalsRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  uint32 page_size = 3;
  string before_journal_id = 4;
