// Typed Finance CQRS contract for owner-authorized commands and projections.

enum FinanceAccountCategory {
  FINANCE_ACCOUNT_CATEGORY_UNSPECIFIED = 0;
  FINANCE_ACCOUNT_CATEGORY_ASSET = 1;
  FINANCE_ACCOUNT_CATEGORY_LIABILITY = 2;
  FINANCE_ACCOUNT_CATEGORY_EQUITY = 3;
  FINANCE_ACCOUNT_CATEGORY_REVENUE = 4;
  FINANCE_ACCOUNT_CATEGORY_EXPENSE = 5;
}

enum FinanceNormalBalance {
  FINANCE_NORMAL_BALANCE_UNSPECIFIED = 0;
  FINANCE_NORMAL_BALANCE_DEBIT = 1;
  FINANCE_NORMAL_BALANCE_CREDIT = 2;
}

enum FinanceAccountStatus {
  FINANCE_ACCOUNT_STATUS_UNSPECIFIED = 0;
  FINANCE_ACCOUNT_STATUS_ACTIVE = 1;
  FINANCE_ACCOUNT_STATUS_INACTIVE = 2;
}

enum FinancePeriodStatus {
  FINANCE_PERIOD_STATUS_UNSPECIFIED = 0;
  FINANCE_PERIOD_STATUS_OPEN = 1;
  FINANCE_PERIOD_STATUS_CLOSING = 2;
  FINANCE_PERIOD_STATUS_CLOSED = 3;
}

enum FinanceJournalStatus {
  FINANCE_JOURNAL_STATUS_UNSPECIFIED = 0;
  FINANCE_JOURNAL_STATUS_DRAFT = 1;
  FINANCE_JOURNAL_STATUS_POSTED = 2;
}

enum FinanceSubledgerKind {
  FINANCE_SUBLEDGER_KIND_UNSPECIFIED = 0;
  FINANCE_SUBLEDGER_KIND_RECEIVABLE = 1;
  FINANCE_SUBLEDGER_KIND_PAYABLE = 2;
}

enum FinanceSubledgerStatus {
  FINANCE_SUBLEDGER_STATUS_UNSPECIFIED = 0;
  FINANCE_SUBLEDGER_STATUS_OPEN = 1;
  FINANCE_SUBLEDGER_STATUS_PARTIALLY_SETTLED = 2;
  FINANCE_SUBLEDGER_STATUS_SETTLED = 3;
}

enum FinanceStatutoryTaxKind {
  FINANCE_STATUTORY_TAX_KIND_UNSPECIFIED = 0;
  FINANCE_STATUTORY_TAX_KIND_OUTPUT_VAT = 1;
  FINANCE_STATUTORY_TAX_KIND_INPUT_VAT = 2;
  FINANCE_STATUTORY_TAX_KIND_WITHHOLDING = 3;
}

enum FinanceSalesOrderStatus {
  FINANCE_SALES_ORDER_STATUS_UNSPECIFIED = 0;
  FINANCE_SALES_ORDER_STATUS_CONFIRMED = 1;
  FINANCE_SALES_ORDER_STATUS_PARTIALLY_FULFILLED = 2;
  FINANCE_SALES_ORDER_STATUS_FULFILLED = 3;
  FINANCE_SALES_ORDER_STATUS_CANCELLED = 4;
}

message FinanceAccountRecord {
  string account_id = 1;
  string code = 2;
  string name = 3;
  FinanceAccountCategory category = 4;
  FinanceNormalBalance normal_balance = 5;
  optional string parent_account_id = 6;
  FinanceAccountStatus status = 7;
}

message FinanceChartRecord {
  string chart_id = 1;
  uint64 source_version = 2;
  erpx.common.v1.TenantScope scope = 3;
  string code = 4;
  string name = 5;
  string currency = 6;
  repeated FinanceAccountRecord accounts = 7;
  string created_at = 8;
  string updated_at = 9;
  string projected_at = 10;
}

message FinancePeriodRecord {
  string period_id = 1;
  uint64 source_version = 2;
  erpx.common.v1.TenantScope scope = 3;
  string code = 4;
  string starts_on = 5;
  string ends_on = 6;
  FinancePeriodStatus status = 7;
  optional string close_requested_by = 8;
  optional string closed_by = 9;
  string created_at = 10;
  string updated_at = 11;
  string projected_at = 12;
}

message FinanceJournalLineRecord {
  string line_id = 1;
  string account_id = 2;
  int64 debit_minor = 3;
  int64 credit_minor = 4;
  string currency = 5;
  string memo = 6;
}

message FinanceSalesOrderLineFact {
  string line_id = 1;
  string item_code = 2;
  int64 quantity_units = 3;
  uint32 quantity_scale = 4;
  int64 line_value_minor = 5;
  string currency = 6;
}

message FinanceSalesOrderFact {
  string sales_order_id = 1;
  string order_code = 2;
  string customer_id = 3;
  FinanceSalesOrderStatus status = 4;
  int64 total_minor = 5;
  string currency = 6;
  repeated FinanceSalesOrderLineFact lines = 7;
}

message FinanceInventoryMovementFact {
  string movement_id = 1;
  string stock_item_id = 2;
  string warehouse_id = 3;
  string item_code = 4;
  int64 quantity_units = 5;
  uint32 quantity_scale = 6;
  optional string procurement_line_id = 7;
}

message FinancePayrollFinalizationFact {
  string payroll_run_id = 1;
  string period_code = 2;
  string finalized_at = 3;
  int64 gross_minor = 4;
  int64 deduction_minor = 5;
  int64 net_minor = 6;
  string currency = 7;
}

message FinancePosSaleFact {
  string transaction_id = 1;
  string register_id = 2;
  string receipt_code = 3;
  optional string customer_id = 4;
  int64 gross_minor = 5;
  string currency = 6;
  string completed_at = 7;
}

message FinancePosRefundFact {
  string refund_id = 1;
  string original_sale_id = 2;
  int64 amount_minor = 3;
  string currency = 4;
  string approved_at = 5;
}

message FinanceBankTransactionFact {
  string import_id = 1;
  string transaction_id = 2;
  string reference = 3;
  string posted_on = 4;
  int64 amount_minor = 5;
  string currency = 6;
}

message FinanceStatutoryTaxFact {
  string tax_fact_id = 1;
  string reference = 2;
  string tax_date = 3;
  string tax_period = 4;
  FinanceStatutoryTaxKind kind = 5;
  string currency = 6;
  int64 base_minor = 7;
  int64 tax_minor = 8;
  uint32 tax_rate_basis_points = 9;
  string tax_identifier = 10;
}

message FinanceManualJournalSource {
  string reference = 1;
}

message FinanceJournalSource {
  oneof source {
    FinanceSalesOrderFact sales_order = 1;
    FinanceInventoryMovementFact inventory_movement = 2;
    FinancePayrollFinalizationFact payroll = 3;
    FinancePosSaleFact pos_sale = 4;
    FinancePosRefundFact pos_refund = 5;
    FinanceBankTransactionFact bank_transaction = 6;
    FinanceStatutoryTaxFact statutory_tax = 7;
    FinanceManualJournalSource manual = 8;
  }
}

message FinanceJournalRecord {
  string journal_id = 1;
  uint64 source_version = 2;
  erpx.common.v1.TenantScope scope = 3;
  string chart_id = 4;
  string period_id = 5;
  string journal_code = 6;
  string entry_date = 7;
  string currency = 8;
  FinanceManualJournalSource manual_source = 9;
  string description = 10;
  repeated FinanceJournalLineRecord lines = 11;
  int64 debit_total_minor = 12;
  int64 credit_total_minor = 13;
  FinanceJournalStatus status = 14;
  optional string posted_at = 15;
  string created_at = 16;
  string updated_at = 17;
  string projected_at = 18;
}

message FinanceSubledgerRecord {
  string subledger_id = 1;
  uint64 source_version = 2;
  erpx.common.v1.TenantScope scope = 3;
  FinanceSubledgerKind kind = 4;
  string party_id = 5;
  string document_code = 6;
  string source_reference = 7;
  string currency = 8;
  int64 original_minor = 9;
  int64 outstanding_minor = 10;
  FinanceSubledgerStatus status = 11;
  string created_at = 12;
  string updated_at = 13;
  string projected_at = 14;
}

message FinanceReleasedPurchaseOrderLineFact {
  string line_id = 1;
  string item_code = 2;
  int64 ordered_quantity_units = 3;
  uint32 ordered_quantity_scale = 4;
  int64 line_value_minor = 5;
  string currency = 6;
  string destination_code = 7;
}

message FinanceReleasedPurchaseOrderFact {
  string purchase_order_id = 1;
  string supplier_id = 2;
  string order_code = 3;
  repeated FinanceReleasedPurchaseOrderLineFact lines = 4;
}

message CreateFinanceChartRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string chart_id = 2;
  erpx.common.v1.TenantScope target_scope = 3;
  string code = 4;
  string name = 5;
  string currency = 6;
  repeated FinanceAccountRecord accounts = 7;
}

message AddFinanceAccountRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string chart_id = 2;
  FinanceAccountRecord account = 3;
}

message ChangeFinanceAccountStatusRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string chart_id = 2;
  string account_id = 3;
  FinanceAccountStatus status = 4;
}

message FinanceChartMutationResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  FinanceChartRecord chart = 2;
}

message CreateFinancePeriodRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string period_id = 2;
  erpx.common.v1.TenantScope target_scope = 3;
  string code = 4;
  string starts_on = 5;
  string ends_on = 6;
}

message FinancePeriodIdentityRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string period_id = 2;
}

message FinancePeriodMutationResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  FinancePeriodRecord period = 2;
}

message CreateTypedFinanceJournalRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string journal_id = 2;
  erpx.common.v1.TenantScope target_scope = 3;
  string chart_id = 4;
  string period_id = 5;
  string journal_code = 6;
  string entry_date = 7;
  string currency = 8;
  FinanceJournalSource source = 9;
  string description = 10;
  repeated FinanceJournalLineRecord lines = 11;
}

message PostTypedFinanceJournalRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string journal_id = 2;
  uint64 expected_chart_version = 3;
  uint64 expected_period_version = 4;
}

message FinanceJournalMutationResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  FinanceJournalRecord journal = 2;
}

message ApplyFinanceSubledgerSettlementRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string subledger_id = 2;
  int64 amount_minor = 3;
}

message FinanceSubledgerMutationResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  FinanceSubledgerRecord subledger = 2;
}

message GetFinanceChartRecordRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string chart_id = 2;
}

message GetFinanceChartRecordResponse {
  optional FinanceChartRecord chart = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}

message ListFinanceChartRecordsRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  optional string company_id = 2;
  uint32 page_size = 3;
  optional string cursor = 4;
}

message ListFinanceChartRecordsResponse {
  repeated FinanceChartRecord charts = 1;
  optional string next_cursor = 2;
  erpx.common.v1.QueryMetadata metadata = 3;
}

message GetFinancePeriodRecordRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string period_id = 2;
}

message GetFinancePeriodRecordResponse {
  optional FinancePeriodRecord period = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}

message GetFinanceJournalRecordRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string journal_id = 2;
}

message GetFinanceJournalRecordResponse {
  optional FinanceJournalRecord journal = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}

message ListTypedFinanceJournalsRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  optional FinanceJournalStatus status = 2;
  optional string period_id = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}

message ListTypedFinanceJournalsResponse {
  repeated FinanceJournalRecord journals = 1;
  optional string next_cursor = 2;
  erpx.common.v1.QueryMetadata metadata = 3;
}

message GetFinanceSubledgerRecordRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string subledger_id = 2;
}

message GetFinanceSubledgerRecordResponse {
  optional FinanceSubledgerRecord subledger = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}

message ListTypedFinanceSubledgerRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  optional FinanceSubledgerStatus status = 2;
  optional bool receivable_only = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}

message ListTypedFinanceSubledgerResponse {
  repeated FinanceSubledgerRecord items = 1;
  optional string next_cursor = 2;
  erpx.common.v1.QueryMetadata metadata = 3;
}

message FinanceTrialBalanceLineRecord {
  string account_id = 1;
  string account_code = 2;
  string account_name = 3;
  int64 debit_minor = 4;
  int64 credit_minor = 5;
  int64 net_minor = 6;
}

message FinanceTrialBalanceRecord {
  erpx.common.v1.TenantScope scope = 1;
  string chart_id = 2;
  string currency = 3;
  repeated FinanceTrialBalanceLineRecord lines = 4;
  int64 total_debit_minor = 5;
  int64 total_credit_minor = 6;
}

message GetTypedFinanceTrialBalanceRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string chart_id = 2;
}

message GetTypedFinanceTrialBalanceResponse {
  FinanceTrialBalanceRecord trial_balance = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}

message ListTypedFinanceBankTransactionsRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  optional string posted_from = 2;
  optional string posted_through = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}

message FinanceBankTransactionRecord {
  erpx.common.v1.TenantScope scope = 1;
  string journal_id = 2;
  FinanceBankTransactionFact fact = 3;
}

message ListTypedFinanceBankTransactionsResponse {
  repeated FinanceBankTransactionRecord transactions = 1;
  optional string next_cursor = 2;
  erpx.common.v1.QueryMetadata metadata = 3;
}

message GetTypedFinanceStatutoryTaxReportRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string tax_period = 2;
  string currency = 3;
  optional string mfa_code = 4;
}

message FinanceStatutoryTaxFactRecord {
  erpx.common.v1.TenantScope scope = 1;
  string journal_id = 2;
  FinanceStatutoryTaxFact fact = 3;
}

message FinanceStatutoryTaxReportRecord {
  erpx.common.v1.TenantScope scope = 1;
  string tax_period = 2;
  string currency = 3;
  repeated FinanceStatutoryTaxFactRecord facts = 4;
  int64 output_vat_minor = 5;
  int64 input_vat_minor = 6;
  int64 withholding_minor = 7;
}

message GetTypedFinanceStatutoryTaxReportResponse {
  FinanceStatutoryTaxReportRecord report = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}

service FinanceCommandService {
  rpc CreateChart(CreateFinanceChartRequest) returns (FinanceChartMutationResponse);
  rpc AddAccount(AddFinanceAccountRequest) returns (FinanceChartMutationResponse);
  rpc ChangeAccountStatus(ChangeFinanceAccountStatusRequest)
      returns (FinanceChartMutationResponse);
  rpc CreatePeriod(CreateFinancePeriodRequest) returns (FinancePeriodMutationResponse);
  rpc BeginPeriodClose(FinancePeriodIdentityRequest) returns (FinancePeriodMutationResponse);
  rpc ClosePeriod(FinancePeriodIdentityRequest) returns (FinancePeriodMutationResponse);
  rpc ReopenPeriod(FinancePeriodIdentityRequest) returns (FinancePeriodMutationResponse);
  rpc CreateJournal(CreateTypedFinanceJournalRequest) returns (FinanceJournalMutationResponse);
  rpc PostJournal(PostTypedFinanceJournalRequest) returns (FinanceJournalMutationResponse);
  rpc ApplySubledgerSettlement(ApplyFinanceSubledgerSettlementRequest)
      returns (FinanceSubledgerMutationResponse);
}

service FinanceQueryService {
  rpc GetChart(GetFinanceChartRecordRequest) returns (GetFinanceChartRecordResponse);
  rpc ListCharts(ListFinanceChartRecordsRequest) returns (ListFinanceChartRecordsResponse);
  rpc GetPeriod(GetFinancePeriodRecordRequest) returns (GetFinancePeriodRecordResponse);
  rpc GetJournal(GetFinanceJournalRecordRequest) returns (GetFinanceJournalRecordResponse);
  rpc ListJournals(ListTypedFinanceJournalsRequest)
      returns (ListTypedFinanceJournalsResponse);
  rpc GetSubledger(GetFinanceSubledgerRecordRequest)
      returns (GetFinanceSubledgerRecordResponse);
  rpc ListSubledger(ListTypedFinanceSubledgerRequest)
      returns (ListTypedFinanceSubledgerResponse);
  rpc GetTrialBalance(GetTypedFinanceTrialBalanceRequest)
      returns (GetTypedFinanceTrialBalanceResponse);
  rpc ListBankTransactions(ListTypedFinanceBankTransactionsRequest)
      returns (ListTypedFinanceBankTransactionsResponse);
  rpc GetStatutoryTaxReport(GetTypedFinanceStatutoryTaxReportRequest)
      returns (GetTypedFinanceStatutoryTaxReportResponse);
}
