syntax = "proto3";

package erpx.platform.v1;

import "google/protobuf/empty.proto";
import "erpx/common/v1/context.proto";

message CustomerSummary {
  string id = 1;
  string account_code = 2;
  string trading_name = 3;
  string legal_name = 4;
  string country = 5;
  string status = 6;
  string billing_state = 7;
  string health = 8;
  uint32 holding_count = 9;
  uint32 company_count = 10;
  uint32 branch_count = 11;
  uint32 active_user_count = 12;
  uint32 expiring_role_count = 13;
  uint32 open_ticket_count = 14;
  uint32 module_count = 15;
  uint32 projection_lag_seconds = 16;
}

message ListCustomersRequest {
  string search = 1;
  erpx.common.v1.QueryContext context = 2;
}
message ListCustomersResponse { repeated CustomerSummary customers = 1; }
message GetCustomerRequest {
  string customer_id = 1;
  string purpose = 2;
  erpx.common.v1.QueryContext context = 3;
}
message GetCustomerResponse { CustomerSummary customer = 1; string correlation_id = 2; }

message GetCustomerProjectionRequest {
  string customer_id = 1;
  string projection = 2;
  string purpose = 3;
  erpx.common.v1.QueryContext context = 4;
}
message GetCustomerProjectionResponse {
  string customer_id = 1;
  string projection = 2;
  bytes payload_json = 3;
  string projection_updated_at = 4;
  string freshness = 5;
  bool read_only = 6;
  string correlation_id = 7;
  bool supported = 8;
  string unsupported_reason = 9;
  bool present = 10;
}
message GetCustomer360DetailRequest {
  string customer_id = 1;
  string purpose = 2;
  erpx.common.v1.QueryContext context = 3;
  uint32 notes_page_size = 4;
  string notes_before_occurred_at = 5;
  string notes_before_id = 6;
}
message CustomerNote {
  string id = 1;
  string author_ref = 2;
  string created_at = 3;
  string body = 4;
}
message Customer360SectionState {
  string section = 1;
  string state = 2;
}
// Bounded, server-allowlisted scalar facts for the Customer 360 detail view.
// Raw projection payloads and credential-bearing fields never cross this
// boundary.
message Customer360SectionFact {
  string section = 1;
  string key = 2;
  string value = 3;
}
message GetCustomer360DetailResponse {
  string customer_id = 1;
  bytes payload_json = 2;
  string projection_updated_at = 3;
  string freshness = 4;
  bool read_only = 5;
  string correlation_id = 6;
  bool supported = 7;
  string unsupported_reason = 8;
  bool present = 9;
  repeated CustomerNote notes = 10;
  string notes_next_before_occurred_at = 11;
  string notes_next_before_id = 12;
  repeated Customer360SectionState section_states = 13;
  repeated Customer360SectionFact section_facts = 14;
}

// Platform Operations reads expose only safe registry/readiness metadata.
// Database keys, storage namespaces, credential references, and backup
// references are never part of this transport contract.
message PlatformTenantSummary {
  string tenant_id = 1;
  string state = 2;
  uint64 registry_version = 3;
  string routing = 4;
  string projection = 5;
  string backup_pitr = 6;
  string storage = 7;
  string customer_id = 8;
  string root_holding_id = 9;
  string customer_name = 10;
  string configuration_state = 11;
  string subscription_state = 12;
  string plan_key = 13;
  repeated string enabled_modules = 14;
  uint32 purchased_seats = 15;
  uint32 used_seats = 16;
  uint32 company_count = 17;
  uint32 branch_count = 18;
  string renewal_at = 19;
  bool overdue = 20;
  string integration_health = 21;
  string health = 22;
  string projected_at = 23;
  bool enterable = 24;
}

message ListPlatformTenantsRequest {
  uint32 page_size = 1;
  string after_tenant_id = 2;
  erpx.common.v1.QueryContext context = 3;
  string search = 4;
  string lifecycle = 5;
  string billing_state = 6;
  string plan = 7;
  string module = 8;
  string health = 9;
}

message ListPlatformTenantsResponse {
  repeated PlatformTenantSummary tenants = 1;
  bool has_more = 2;
  string next_after_tenant_id = 3;
  string correlation_id = 4;
}
message GetPlatformTenantRequest {
  string tenant_id = 1;
  erpx.common.v1.QueryContext context = 2;
}
message GetPlatformTenantResponse {
  PlatformTenantSummary tenant = 1;
  string correlation_id = 2;
}

// The raw administrative-context identifier is returned only to the caller
// and subsequently travels in protected transport metadata. It must be
// redacted from logs and UI diagnostics.
message BeginTenantAdminContextRequest {
  string tenant_id = 1;
  string reason = 2;
  string mfa_code = 3;
  erpx.common.v1.CommandContext context = 4;
}
message TenantAdminContext {
  string administrative_context_id = 1;
  string tenant_id = 2;
  string customer_id = 3;
  string root_holding_id = 4;
  string issued_at = 5;
  string expires_at = 6;
  bool active = 7;
}
message BeginTenantAdminContextResponse {
  TenantAdminContext administrative_context = 1;
  string correlation_id = 2;
}
message GetTenantAdminContextRequest {
  string administrative_context_id = 1;
  erpx.common.v1.QueryContext context = 2;
}
message GetTenantAdminContextResponse {
  TenantAdminContext administrative_context = 1;
  string correlation_id = 2;
}
message EndTenantAdminContextRequest {
  string administrative_context_id = 1;
  string reason = 2;
  erpx.common.v1.CommandContext context = 3;
}
message EndTenantAdminContextResponse {
  bool ended = 1;
  string correlation_id = 2;
}

message DiscoverTenantOrganizationUnitsRequest {
  string tenant_id = 1;
  uint32 page_size = 2;
  string after_cursor = 3;
  erpx.common.v1.QueryContext context = 4;
}
message TenantOrganizationUnit {
  string kind = 1;
  string holding_id = 2;
  string company_id = 3;
  string branch_id = 4;
  string code = 5;
  string name = 6;
}
message DiscoverTenantOrganizationUnitsResponse {
  repeated TenantOrganizationUnit units = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}

message ListSaasCatalogRequest {
  string currency = 1;
  erpx.common.v1.QueryContext context = 2;
}
message SaasCatalogPrice {
  string item_key = 1;
  string display_name = 2;
  string kind = 3;
  string pricing_unit = 4;
  string interval = 5;
  uint64 amount_minor = 6;
  string currency = 7;
}
message ListSaasCatalogResponse {
  uint32 revision = 1;
  repeated SaasCatalogPrice prices = 2;
  string correlation_id = 3;
}
message SubscriptionItemSelection {
  string item_key = 1;
  uint32 quantity = 2;
}
message GetTenantSubscriptionRequest {
  string tenant_id = 1;
  erpx.common.v1.QueryContext context = 2;
}
message TenantSubscriptionStatus {
  string tenant_id = 1;
  string state = 2;
  string currency = 3;
  string grace_until = 4;
  bool business_modules_read_only = 5;
  repeated SubscriptionItemSelection items = 6;
}
message GetTenantSubscriptionResponse {
  TenantSubscriptionStatus subscription = 1;
  string correlation_id = 2;
}
message CreateCheckoutSessionRequest {
  string tenant_id = 1;
  repeated SubscriptionItemSelection items = 2;
  string return_path = 3;
  erpx.common.v1.CommandContext context = 4;
}
message CreateCheckoutSessionResponse {
  string hosted_url = 1;
  string expires_at = 2;
  string correlation_id = 3;
}
message CreateCustomerPortalSessionRequest {
  string tenant_id = 1;
  string return_path = 2;
  erpx.common.v1.CommandContext context = 3;
}
message CreateCustomerPortalSessionResponse {
  string hosted_url = 1;
  string correlation_id = 2;
}
message ListTenantInvoicesRequest {
  string tenant_id = 1;
  uint32 page_size = 2;
  string after_invoice_id = 3;
  erpx.common.v1.QueryContext context = 4;
}
message TenantInvoiceSummary {
  string invoice_id = 1;
  string state = 2;
  string currency = 3;
  uint64 amount_due_minor = 4;
  uint64 amount_paid_minor = 5;
  string due_at = 6;
  bool hosted_invoice_available = 7;
}
message ListTenantInvoicesResponse {
  repeated TenantInvoiceSummary invoices = 1;
  bool has_more = 2;
  string next_after_invoice_id = 3;
  string correlation_id = 4;
}
message GrantBillingGraceExtensionRequest {
  string tenant_id = 1;
  string delinquency_cycle_id = 2;
  uint32 extension_days = 3;
  string reason = 4;
  string mfa_code = 5;
  erpx.common.v1.CommandContext context = 6;
}
message GrantBillingGraceExtensionResponse {
  string extension_id = 1;
  string extended_until = 2;
  string correlation_id = 3;
}

message BeginTenantProvisioningRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string write_database_key = 3;
  string read_database_key = 4;
  string storage_namespace = 5;
  string credential_key_ref = 6;
  string backup_chain_ref = 7;
  erpx.common.v1.CommandContext context = 8;
  string owner_principal_ref = 9;
  string owner_approver_ref = 10;
}
message BeginTenantProvisioningResponse {
  string tenant_id = 1;
  string state = 2;
  uint64 registry_version = 3;
  bool accepted = 4;
  string correlation_id = 5;
}

message ProvisionTenantResourcesRequest {
  string tenant_id = 1;
  erpx.common.v1.CommandContext context = 2;
}
message ProvisionTenantResourcesResponse {
  string tenant_id = 1;
  string state = 2;
  bool databases_ready = 3;
  bool storage_ready = 4;
  string correlation_id = 5;
  bool owner_seeded = 6;
  string owner_principal_ref = 7;
  string owner_recovery_code = 8;
}

message TransitionTenantStateRequest {
  string tenant_id = 1;
  erpx.common.v1.CommandContext context = 2;
}
message TransitionTenantStateResponse {
  string tenant_id = 1;
  string state = 2;
  uint64 registry_version = 3;
  string correlation_id = 4;
}

message PitrRecoveryPoint {
  string target_time = 1;
  string target_lsn = 2;
  string wal_archive_ref = 3;
  string physical_restore_target_ref = 4;
}

message ScheduleTenantBackupRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string kind = 3;
  string backup_ref = 4;
  string restore_target_ref = 5;
  string candidate_read_database_key = 6;
  uint64 source_version = 7;
  string available_at = 8;
  string idempotency_key = 9;
  uint32 max_attempts = 10;
  erpx.common.v1.CommandContext context = 11;
  string source_projection = 12;
  PitrRecoveryPoint pitr_recovery_point = 13;
}
message ScheduleTenantBackupResponse {
  string job_id = 1;
  string tenant_id = 2;
  string kind = 3;
  string state = 4;
  string available_at = 5;
  uint32 max_attempts = 6;
  bool duplicate = 7;
  string correlation_id = 8;
}
message ListTenantBackupJobsRequest {
  string tenant_id = 1;
  uint32 page_size = 2;
  erpx.common.v1.QueryContext context = 3;
}
message TenantBackupJobSummary {
  string job_id = 1;
  string tenant_id = 2;
  string kind = 3;
  string state = 4;
  string available_at = 5;
  uint32 attempts = 6;
  uint32 max_attempts = 7;
  bool verified = 8;
  bool error_present = 9;
  string created_at = 10;
  string updated_at = 11;
}
message ListTenantBackupJobsResponse {
  repeated TenantBackupJobSummary jobs = 1;
  string correlation_id = 2;
}

// Physical PITR is a PostgreSQL-cluster capability. Callers provide only
// opaque cluster/chain/restore-target references; filesystem paths, ports,
// database URLs, object keys, and credentials remain worker-owned.
message ScheduleClusterBaseBackupRequest {
  string cluster_ref = 1;
  string chain_ref = 2;
  string storage_namespace = 3;
  string retention_until = 4;
  erpx.common.v1.CommandContext context = 5;
  string mfa_code = 6;
}
message ScheduleClusterBaseBackupResponse {
  string chain_id = 1;
  string cluster_ref = 2;
  string chain_ref = 3;
  string state = 4;
  string retention_until = 5;
  string correlation_id = 6;
}
message ListClusterRecoveryPointsRequest {
  string cluster_ref = 1;
  uint32 page_size = 2;
  erpx.common.v1.QueryContext context = 3;
}
message ClusterRecoveryPointSummary {
  string recovery_point_id = 1;
  string chain_id = 2;
  string label = 3;
  string target_time = 4;
  string target_lsn = 5;
  uint64 timeline_id = 6;
  bool wal_continuity_verified = 7;
  string state = 8;
  string created_at = 9;
}
message ListClusterRecoveryPointsResponse {
  repeated ClusterRecoveryPointSummary recovery_points = 1;
  string correlation_id = 2;
}
message StartClusterRestoreRehearsalRequest {
  string recovery_point_id = 1;
  string restore_target_ref = 2;
  erpx.common.v1.CommandContext context = 3;
  string mfa_code = 4;
}
message StartClusterRestoreRehearsalResponse {
  string rehearsal_id = 1;
  string recovery_point_id = 2;
  string restore_target_ref = 3;
  string state = 4;
  string created_at = 5;
  string correlation_id = 6;
}
message GetClusterRestoreRehearsalRequest {
  string rehearsal_id = 1;
  erpx.common.v1.QueryContext context = 2;
}
message GetClusterRestoreRehearsalResponse {
  string rehearsal_id = 1;
  string state = 2;
  bool verification_complete = 3;
  repeated string verification_checks = 4;
  string failure_category = 5;
  string updated_at = 6;
  string correlation_id = 7;
}

message StartProjectionRebuildRequest {
  string tenant_id = 1;
  string projection_name = 2;
  string candidate_read_database_key = 3;
  uint64 source_version = 4;
  erpx.common.v1.CommandContext context = 5;
}
message StartProjectionRebuildResponse {
  string tenant_id = 1;
  string projection_name = 2;
  string state = 3;
  uint64 source_version = 4;
  string correlation_id = 5;
  uint64 generation = 6;
}
message ActivateProjectionRebuildRequest {
  string tenant_id = 1;
  string projection_name = 2;
  string candidate_read_database_key = 3;
  uint64 generation = 4;
  erpx.common.v1.CommandContext context = 5;
}
message ActivateProjectionRebuildResponse {
  string tenant_id = 1;
  string projection_name = 2;
  string state = 3;
  uint64 generation = 4;
  string correlation_id = 5;
}

message ListProjectionStatusesRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string projection_name = 3;
  uint32 page_size = 4;
  string after_cursor = 5;
  erpx.common.v1.QueryContext context = 6;
}
message ProjectionStatus {
  string tenant_id = 1;
  string holding_ref = 2;
  string projection_name = 3;
  string job_key = 4;
  string job_id = 5;
  string kind = 6;
  string state = 7;
  string available_at = 8;
  uint32 attempts = 9;
  uint32 max_attempts = 10;
  string lease_until = 11;
  string last_error = 12;
  string dead_lettered_at = 13;
  string rebuild_id = 14;
  uint64 version = 15;
  string created_at = 16;
  string updated_at = 17;
  string published_at = 18;
  string freshness = 19;
}
message ListProjectionStatusesResponse {
  repeated ProjectionStatus statuses = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}

message ListPlatformAuditRequest {
  uint32 page_size = 1;
  string before_recorded_at = 2;
  string before_audit_id = 3;
  erpx.common.v1.QueryContext context = 4;
}
message PlatformAuditEntry {
  string audit_id = 1;
  string actor_ref = 2;
  string action = 3;
  string purpose = 4;
  string correlation_id = 5;
  string recorded_at = 6;
  bool customer_scoped = 7;
}
message ListPlatformAuditResponse {
  repeated PlatformAuditEntry entries = 1;
  bool has_more = 2;
  string next_before_recorded_at = 3;
  string next_before_audit_id = 4;
  string correlation_id = 5;
}

// Dead-letter replay is a high-risk, platform-scoped operator command. The
// MFA code is transport-only and is never persisted or returned.
message ReplayDeadLetterOutboxRequest {
  string event_id = 1;
  string available_at = 2;
  string mfa_code = 3;
  erpx.common.v1.CommandContext context = 4;
}
message ReplayDeadLetterOutboxResponse {
  string event_id = 1;
  string state = 2;
  string correlation_id = 3;
  bool replayed = 4;
}

message ListPlatformIntegrationsRequest {
  erpx.common.v1.QueryContext context = 1;
}
message PlatformIntegrationStatus {
  string integration_key = 1;
  string state = 2;
  string capability = 3;
  string checked_at = 4;
}
message ListPlatformIntegrationsResponse {
  repeated PlatformIntegrationStatus integrations = 1;
  string correlation_id = 2;
}

message GetPlatformSettingsRequest {
  erpx.common.v1.QueryContext context = 1;
}
message PlatformSettingsSummary {
  string contract_version = 1;
  string transport = 2;
  string tenant_isolation = 3;
  string aggregate_authority = 4;
  string billing_authority = 5;
  string storage_authority = 6;
  string command_owner = 7;
}
message GetPlatformSettingsResponse {
  PlatformSettingsSummary settings = 1;
  string correlation_id = 2;
}

// G13 migration status is an audited control-plane surface. Lifecycle
// commands remain MFA-bound and never expose cutover or command-owner
// approval material.
message ListMigrationStatusesRequest {
  uint32 page_size = 1;
  erpx.common.v1.QueryContext context = 2;
}
message MigrationStatus {
  string run_id = 1;
  string cohort = 2;
  string phase = 3;
  string command_owner = 4;
  uint64 version = 5;
  string retention_until = 6;
  uint64 transition_count = 7;
  uint64 work_pending = 8;
  uint64 work_failed = 9;
  string reconciliation_state = 10;
  string rollback_state = 11;
  string updated_at = 12;
  string source_snapshot_hash = 13;
  uint64 source_missing_table_count = 14;
  uint64 source_entity_kind_count = 15;
  uint64 source_total_rows = 16;
  string source_captured_at = 17;
}
message ListMigrationStatusesResponse {
  repeated MigrationStatus statuses = 1;
  string correlation_id = 2;
}

// G13 execution work can be queued only after authenticated platform
// authorization and a fresh MFA step-up. This command never changes command
// ownership and never performs a production cutover.
message QueueMigrationWorkRequest {
  string run_id = 1;
  string work_kind = 2;
  string scope_key = 3;
  string source_fence = 4;
  uint32 max_attempts = 5;
  string mfa_code = 6;
  erpx.common.v1.CommandContext context = 7;
}
message QueueMigrationWorkResponse {
  string work_id = 1;
  string run_id = 2;
  string work_kind = 3;
  string scope_key = 4;
  string state = 5;
  bool queued = 6;
  string correlation_id = 7;
}

message BeginMigrationRunRequest {
  string run_id = 1;
  string cohort = 2;
  string source_contract_hash = 3;
  string id_namespace = 4;
  string mfa_code = 5;
  erpx.common.v1.CommandContext context = 6;
}
message BeginMigrationRunResponse {
  string run_id = 1;
  string cohort = 2;
  string phase = 3;
  string command_owner = 4;
  uint64 version = 5;
  string created_at = 6;
  string updated_at = 7;
  string correlation_id = 8;
}

message AdvanceMigrationPhaseRequest {
  string run_id = 1;
  uint64 expected_version = 2;
  string expected_phase = 3;
  string mfa_code = 4;
  erpx.common.v1.CommandContext context = 5;
}
message AdvanceMigrationPhaseResponse {
  string run_id = 1;
  string cohort = 2;
  string phase = 3;
  string command_owner = 4;
  uint64 version = 5;
  string created_at = 6;
  string updated_at = 7;
  string correlation_id = 8;
}

message CustomerAccessAuditEntry {
  string audit_id = 1;
  string actor_ref = 2;
  string session_ref = 3;
  string customer_id = 4;
  string module = 5;
  string scope = 6;
  string purpose = 7;
  string occurred_at = 8;
  string correlation_id = 9;
}

message GetCustomerAccessAuditRequest {
  string customer_id = 1;
  string purpose = 2;
  erpx.common.v1.QueryContext context = 3;
  uint32 page_size = 4;
  string before_occurred_at = 5;
  string before_audit_id = 6;
}

message GetCustomerAccessAuditResponse {
  string customer_id = 1;
  repeated CustomerAccessAuditEntry entries = 2;
  string next_before_occurred_at = 3;
  string next_before_audit_id = 4;
  string projection_updated_at = 5;
  string freshness = 6;
  bool read_only = 7;
  string correlation_id = 8;
  bool present = 9;
}

// Tenant-local organization commands and rebuildable reads. The tenant ID is
// an opaque route reference; database keys and credentials never cross this
// transport boundary.
message SaveOrganizationNodeRequest {
  string tenant_id = 1;
  string kind = 2;
  string node_id = 3;
  string holding_id = 4;
  string company_id = 5;
  string branch_id = 6;
  string department_id = 7;
  string code = 8;
  string name = 9;
  string registration_number = 10;
  string status = 11;
  bool has_expected_version = 12;
  uint64 expected_version = 13;
  erpx.common.v1.CommandContext context = 14;
}
message SaveOrganizationNodeResponse {
  string kind = 1;
  string node_id = 2;
  uint64 aggregate_version = 3;
  string event_id = 4;
  bool applied = 5;
  string correlation_id = 6;
}
message ListOrganizationNodesRequest {
  string tenant_id = 1;
  string kind = 2;
  string holding_id = 3;
  uint32 page_size = 4;
  string after_cursor = 5;
  erpx.common.v1.QueryContext context = 6;
}
message OrganizationNode {
  string kind = 1;
  string node_id = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  string department_id = 6;
  string code = 7;
  string name = 8;
  string registration_number = 9;
  string status = 10;
  uint64 aggregate_version = 11;
  string updated_at = 12;
}
message ListOrganizationNodesResponse {
  repeated OrganizationNode nodes = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}

message GetOperationsSummaryRequest {
  string tenant_id = 1;
  string holding_id = 2;
  erpx.common.v1.QueryContext context = 3;
}
message OperationsSourceCount {
  string source_domain = 1;
  uint64 reference_count = 2;
}
message OperationsSummary {
  string tenant_id = 1;
  string holding_id = 2;
  string projection_name = 3;
  uint64 read_row_count = 4;
  uint64 exception_count = 5;
  uint64 projection_checkpoint_count = 6;
  uint64 event_count = 7;
  uint64 source_reference_count = 8;
  repeated OperationsSourceCount source_counts = 9;
  string latest_event_at = 10;
}
message GetOperationsSummaryResponse {
  OperationsSummary summary = 1;
  string correlation_id = 2;
}
message ListOperationsExceptionsRequest {
  string tenant_id = 1;
  string holding_id = 2;
  uint32 page_size = 3;
  string after_cursor = 4;
  erpx.common.v1.QueryContext context = 5;
}
message OperationsException {
  string exception_id = 1;
  string category = 2;
  string severity = 3;
  string status = 4;
  string assigned_to = 5;
  string manager_ref = 6;
  string due_at = 7;
  uint64 aggregate_version = 8;
  string updated_at = 9;
}
message ListOperationsExceptionsResponse {
  repeated OperationsException exceptions = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}
message CreateOperationsExceptionFromSourceRequest {
  string tenant_id = 1;
  string holding_id = 2;
  string exception_id = 3;
  string source_domain = 4;
  string source_type = 5;
  string source_id = 6;
  string source_event_id = 7;
  uint64 source_version = 8;
  string event_type = 9;
  uint32 event_version = 10;
  string occurred_at = 11;
  string category = 12;
  string severity = 13;
  bytes payload_json = 14;
  erpx.common.v1.CommandContext context = 15;
}
message CreateOperationsExceptionFromSourceResponse {
  string exception_id = 1;
  string source_event_id = 2;
  uint64 aggregate_version = 3;
  string event_id = 4;
  bool applied = 5;
  string correlation_id = 6;
}
message TransitionOperationsExceptionRequest {
  string tenant_id = 1;
  string holding_id = 2;
  string exception_id = 3;
  string action = 4;
