      returns (SaveCorporateIdentityDraftResponse);
  rpc PublishCorporateIdentityDraft(PublishCorporateIdentityDraftRequest)
      returns (PublishCorporateIdentityDraftResponse);
  rpc RollbackCorporateIdentity(RollbackCorporateIdentityRequest)
      returns (RollbackCorporateIdentityResponse);
  rpc ListCorporateIdentityHistory(ListCorporateIdentityHistoryRequest)
      returns (ListCorporateIdentityHistoryResponse);
  rpc GetNavigationManifest(GetNavigationManifestRequest)
      returns (GetNavigationManifestResponse);
}

// Agent-only service. The agent always initiates the mTLS connection; ERPX
// never requires inbound access to customer databases, storage, or directory.
service DataPlaneAgentService {
  rpc Enroll(EnrollDataPlaneAgentRequest) returns (EnrollDataPlaneAgentResponse);
  rpc ReportObservation(ReportDataPlaneObservationRequest)
      returns (ReportDataPlaneObservationResponse);
  rpc Connect(stream DataPlaneAgentEnvelope) returns (stream ControlPlaneEnvelope);
}
