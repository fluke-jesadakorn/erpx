syntax = "proto3";

package erpx.platform.v1;

import "erpx/common/v1/context.proto";

message SaveSalesAggregateRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  bytes aggregate_json = 3;
  bool has_expected_version = 4;
  uint64 expected_version = 5;
  erpx.common.v1.CommandContext context = 6;
}
message SalesWriteReceipt {
  string aggregate_type = 1;
  string aggregate_id = 2;
  uint64 version = 3;
  bool replayed = 4;
}
message SaveSalesAggregateResponse {
  SalesWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message TransitionSalesAggregateRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string aggregate_type = 3;
  string aggregate_id = 4;
  string transition = 5;
  uint64 expected_version = 6;
  erpx.common.v1.CommandContext context = 7;
}
message TransitionSalesAggregateResponse {
  SalesWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message GetSalesAggregateRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string aggregate_type = 3;
  string aggregate_id = 4;
  erpx.common.v1.QueryContext context = 5;
}
message GetSalesAggregateResponse {
  string aggregate_type = 1;
  string aggregate_id = 2;
  uint64 source_version = 3;
  bytes aggregate_json = 4;
  bool present = 5;
  string correlation_id = 6;
}
message ListSalesAggregatesRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  uint32 page_size = 6;
  string before_cursor = 7;
  erpx.common.v1.QueryContext context = 8;
}
message SalesAggregateReadRow {
  string aggregate_type = 1;
  string aggregate_id = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  string reference = 6;
  uint64 source_version = 7;
  string projected_at = 8;
}
message ListSalesAggregatesResponse {
  repeated SalesAggregateReadRow rows = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}

service SalesService {
  rpc SaveSalesAggregate(SaveSalesAggregateRequest)
      returns (SaveSalesAggregateResponse);
  rpc TransitionSalesAggregate(TransitionSalesAggregateRequest)
      returns (TransitionSalesAggregateResponse);
  rpc GetSalesAggregate(GetSalesAggregateRequest)
      returns (GetSalesAggregateResponse);
  rpc ListSalesAggregates(ListSalesAggregatesRequest)
      returns (ListSalesAggregatesResponse);
}

enum SalesQuoteStatus {
  SALES_QUOTE_STATUS_UNSPECIFIED = 0;
  SALES_QUOTE_STATUS_DRAFT = 1;
  SALES_QUOTE_STATUS_SENT = 2;
  SALES_QUOTE_STATUS_ACCEPTED = 3;
  SALES_QUOTE_STATUS_REJECTED = 4;
  SALES_QUOTE_STATUS_EXPIRED = 5;
}

enum SalesOrderStatus {
  SALES_ORDER_STATUS_UNSPECIFIED = 0;
  SALES_ORDER_STATUS_DRAFT = 1;
  SALES_ORDER_STATUS_CONFIRMED = 2;
  SALES_ORDER_STATUS_PARTIALLY_FULFILLED = 3;
  SALES_ORDER_STATUS_FULFILLED = 4;
  SALES_ORDER_STATUS_CANCELLED = 5;
}

enum SalesOpportunityStage {
  SALES_OPPORTUNITY_STAGE_UNSPECIFIED = 0;
  SALES_OPPORTUNITY_STAGE_QUALIFIED = 1;
  SALES_OPPORTUNITY_STAGE_DISCOVERY = 2;
  SALES_OPPORTUNITY_STAGE_PROPOSAL = 3;
  SALES_OPPORTUNITY_STAGE_NEGOTIATION = 4;
  SALES_OPPORTUNITY_STAGE_WON = 5;
  SALES_OPPORTUNITY_STAGE_LOST = 6;
}

message SalesOpportunityFact {
  string opportunity_id = 1;
  string customer_id = 2;
  SalesOpportunityStage stage = 3;
  int64 expected_value_minor = 4;
  string currency = 5;
}

message SalesOrderLineRecord {
  string line_id = 1;
  string item_code = 2;
  string description = 3;
  int64 quantity = 4;
  int64 unit_price_minor = 5;
  int64 tax_minor = 6;
  string currency = 7;
  int64 line_value_minor = 8;
}

message SalesQuoteRecord {
  string quote_id = 1;
  uint64 source_version = 2;
  erpx.common.v1.TenantScope scope = 3;
  string opportunity_id = 4;
  string customer_id = 5;
  string quote_code = 6;
  string currency = 7;
  repeated SalesOrderLineRecord lines = 8;
  int64 total_minor = 9;
  string valid_until = 10;
  SalesQuoteStatus status = 11;
  string created_at = 12;
  string updated_at = 13;
  string projected_at = 14;
}

message SalesOrderRecord {
  string sales_order_id = 1;
  uint64 source_version = 2;
  erpx.common.v1.TenantScope scope = 3;
  string quote_id = 4;
  string opportunity_id = 5;
  string customer_id = 6;
  string order_code = 7;
  string currency = 8;
  repeated SalesOrderLineRecord lines = 9;
  int64 total_minor = 10;
  SalesOrderStatus status = 11;
  string created_at = 12;
  string updated_at = 13;
  string projected_at = 14;
}

message CreateSalesQuoteRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string quote_id = 2;
  erpx.common.v1.TenantScope target_scope = 3;
  SalesOpportunityFact opportunity = 4;
  string quote_code = 5;
  string currency = 6;
  repeated SalesOrderLineRecord lines = 7;
  string valid_until = 8;
}

message SalesQuoteIdentityRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string quote_id = 2;
}

message SalesQuoteMutationResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  SalesQuoteRecord quote = 2;
}

message CreateSalesOrderRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string sales_order_id = 2;
  string quote_id = 3;
  uint64 expected_quote_version = 4;
  string order_code = 5;
}

message SalesOrderIdentityRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string sales_order_id = 2;
}

message SalesOrderMutationResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  SalesOrderRecord sales_order = 2;
}

message GetSalesQuoteRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string quote_id = 2;
}

message GetSalesQuoteResponse {
  optional SalesQuoteRecord quote = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}

message GetSalesOrderRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string sales_order_id = 2;
}

message GetSalesOrderResponse {
  optional SalesOrderRecord sales_order = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}

message ListSalesOrdersRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  optional SalesOrderStatus status = 2;
  optional string customer_id = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}

message ListSalesOrdersResponse {
  repeated SalesOrderRecord sales_orders = 1;
  optional string next_cursor = 2;
  erpx.common.v1.QueryMetadata metadata = 3;
}

service SalesCommandService {
  rpc CreateQuote(CreateSalesQuoteRequest) returns (SalesQuoteMutationResponse);
  rpc SendQuote(SalesQuoteIdentityRequest) returns (SalesQuoteMutationResponse);
  rpc AcceptQuote(SalesQuoteIdentityRequest) returns (SalesQuoteMutationResponse);
  rpc RejectQuote(SalesQuoteIdentityRequest) returns (SalesQuoteMutationResponse);
  rpc ExpireQuote(SalesQuoteIdentityRequest) returns (SalesQuoteMutationResponse);
  rpc CreateSalesOrder(CreateSalesOrderRequest) returns (SalesOrderMutationResponse);
  rpc ConfirmSalesOrder(SalesOrderIdentityRequest) returns (SalesOrderMutationResponse);
  rpc MarkSalesOrderPartiallyFulfilled(SalesOrderIdentityRequest)
      returns (SalesOrderMutationResponse);
  rpc MarkSalesOrderFulfilled(SalesOrderIdentityRequest)
      returns (SalesOrderMutationResponse);
  rpc CancelSalesOrder(SalesOrderIdentityRequest) returns (SalesOrderMutationResponse);
}

service SalesQueryService {
  rpc GetQuote(GetSalesQuoteRequest) returns (GetSalesQuoteResponse);
  rpc GetSalesOrder(GetSalesOrderRequest) returns (GetSalesOrderResponse);
  rpc ListSalesOrders(ListSalesOrdersRequest) returns (ListSalesOrdersResponse);
}
