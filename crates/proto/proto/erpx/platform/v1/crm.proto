syntax = "proto3";

package erpx.platform.v1;

import "erpx/common/v1/context.proto";

message ListCrmReadRowsRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string aggregate_type = 3;
  uint32 page_size = 4;
  string after_id = 5;
  erpx.common.v1.QueryContext context = 6;
}
message CrmReadRow {
  string aggregate_type = 1;
  string aggregate_id = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  uint64 source_version = 6;
  bytes payload_json = 7;
}
message ListCrmReadRowsResponse {
  repeated CrmReadRow rows = 1;
  bool has_more = 2;
  string next_after_id = 3;
  string correlation_id = 4;
}
message SaveCrmHandoffRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  bytes handoff_json = 3;
  erpx.common.v1.CommandContext context = 4;
}
message CrmWriteReceipt {
  string aggregate_type = 1;
  string aggregate_id = 2;
  string reference = 3;
  uint64 version = 4;
  bool replayed = 5;
}
message SaveCrmHandoffResponse {
  CrmWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message SaveCrmOpportunityRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  bytes opportunity_json = 3;
  bool has_expected_version = 4;
  uint64 expected_version = 5;
  erpx.common.v1.CommandContext context = 6;
}
message SaveCrmOpportunityResponse {
  CrmWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message RecordCrmAttributionRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string opportunity_id = 3;
  string model = 4;
  uint64 expected_opportunity_version = 5;
  erpx.common.v1.CommandContext context = 6;
}
message CrmAttributionWriteReceipt {
  string record_id = 1;
  string reference = 2;
  string model = 3;
  uint64 source_opportunity_version = 4;
  uint64 version = 5;
  bool replayed = 6;
}
message RecordCrmAttributionResponse {
  CrmAttributionWriteReceipt receipt = 1;
  string correlation_id = 2;
}

service CrmService {
  rpc ListCrmReadRows(ListCrmReadRowsRequest) returns (ListCrmReadRowsResponse);
  rpc SaveCrmHandoff(SaveCrmHandoffRequest) returns (SaveCrmHandoffResponse);
  rpc SaveCrmOpportunity(SaveCrmOpportunityRequest) returns (SaveCrmOpportunityResponse);
  rpc RecordCrmAttribution(RecordCrmAttributionRequest)
      returns (RecordCrmAttributionResponse);
}

enum CrmOpportunityStage {
  CRM_OPPORTUNITY_STAGE_UNSPECIFIED = 0;
  CRM_OPPORTUNITY_STAGE_QUALIFIED = 1;
  CRM_OPPORTUNITY_STAGE_DISCOVERY = 2;
  CRM_OPPORTUNITY_STAGE_PROPOSAL = 3;
  CRM_OPPORTUNITY_STAGE_NEGOTIATION = 4;
  CRM_OPPORTUNITY_STAGE_WON = 5;
  CRM_OPPORTUNITY_STAGE_LOST = 6;
}

message MarketingQualifiedLeadFact {
  string candidate_id = 1;
  string campaign_id = 2;
  string audience_member_id = 3;
  optional string existing_customer_id = 4;
  string source = 5;
  uint32 qualification_score_basis_points = 6;
}
message CrmLeadRecord {
  string lead_id = 1;
  uint64 source_version = 2;
  erpx.common.v1.TenantScope scope = 3;
  string marketing_candidate_id = 4;
  optional string customer_id = 5;
  string source = 6;
  uint32 qualification_score_basis_points = 7;
  string accepted_at = 8;
  string projected_at = 9;
}
message CrmOpportunityRecord {
  string opportunity_id = 1;
  uint64 source_version = 2;
  erpx.common.v1.TenantScope scope = 3;
  string accepted_lead_id = 4;
  string customer_id = 5;
  string name = 6;
  int64 expected_value_minor = 7;
  string currency = 8;
  CrmOpportunityStage stage = 9;
  string created_at = 10;
  string updated_at = 11;
  string projected_at = 12;
}
message AcceptMarketingLeadRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string lead_id = 2;
  MarketingQualifiedLeadFact qualified = 3;
}
message AcceptMarketingLeadResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  CrmLeadRecord lead = 2;
}
message CreateCrmOpportunityRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string opportunity_id = 2;
  string accepted_lead_id = 3;
  string customer_id = 4;
  string name = 5;
  int64 expected_value_minor = 6;
  string currency = 7;
}
message TransitionCrmOpportunityRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string opportunity_id = 2;
  CrmOpportunityStage stage = 3;
}
message CrmOpportunityMutationResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  CrmOpportunityRecord opportunity = 2;
}
message GetCrmLeadRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string lead_id = 2;
}
message GetCrmLeadResponse {
  optional CrmLeadRecord lead = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}
message GetCrmOpportunityRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string opportunity_id = 2;
}
message GetCrmOpportunityResponse {
  optional CrmOpportunityRecord opportunity = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}
message ListCrmOpportunitiesRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  optional CrmOpportunityStage stage = 2;
  optional string customer_id = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}
message ListCrmOpportunitiesResponse {
  repeated CrmOpportunityRecord opportunities = 1;
  optional string next_cursor = 2;
  erpx.common.v1.QueryMetadata metadata = 3;
}

service CrmCommandService {
  rpc AcceptMarketingLead(AcceptMarketingLeadRequest)
      returns (AcceptMarketingLeadResponse);
  rpc CreateOpportunity(CreateCrmOpportunityRequest)
      returns (CrmOpportunityMutationResponse);
  rpc TransitionOpportunity(TransitionCrmOpportunityRequest)
      returns (CrmOpportunityMutationResponse);
}
service CrmQueryService {
  rpc GetCrmLead(GetCrmLeadRequest) returns (GetCrmLeadResponse);
  rpc GetOpportunity(GetCrmOpportunityRequest)
      returns (GetCrmOpportunityResponse);
  rpc ListOpportunities(ListCrmOpportunitiesRequest)
      returns (ListCrmOpportunitiesResponse);
}
