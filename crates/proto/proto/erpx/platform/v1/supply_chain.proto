syntax = "proto3";

package erpx.platform.v1;

import "erpx/common/v1/context.proto";

message SaveScmAggregateRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  bytes aggregate_json = 3;
  bool has_expected_version = 4;
  uint64 expected_version = 5;
  erpx.common.v1.CommandContext context = 6;
}
message ScmWriteReceipt {
  string aggregate_type = 1;
  string aggregate_id = 2;
  uint64 version = 3;
  bool replayed = 4;
}
message SaveScmAggregateResponse {
  ScmWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message TransitionScmAggregateRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string aggregate_type = 3;
  string aggregate_id = 4;
  string transition = 5;
  uint64 expected_version = 6;
  erpx.common.v1.CommandContext context = 7;
}
message TransitionScmAggregateResponse {
  ScmWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message GetScmAggregateRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string aggregate_type = 3;
  string aggregate_id = 4;
  erpx.common.v1.QueryContext context = 5;
}
message GetScmAggregateResponse {
  string aggregate_type = 1;
  string aggregate_id = 2;
  uint64 source_version = 3;
  bytes aggregate_json = 4;
  bool present = 5;
  string correlation_id = 6;
}
message ListScmAggregatesRequest {
  string tenant_id = 1;
  string holding_ref = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  uint32 page_size = 6;
  string before_cursor = 7;
  erpx.common.v1.QueryContext context = 8;
}
message ScmAggregateReadRow {
  string aggregate_type = 1;
  string aggregate_id = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  string reference = 6;
  uint64 source_version = 7;
  bytes aggregate_json = 8;
  string projected_at = 9;
}
message ListScmAggregatesResponse {
  repeated ScmAggregateReadRow rows = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}

service ScmService {
  rpc SaveScmAggregate(SaveScmAggregateRequest)
      returns (SaveScmAggregateResponse);
  rpc TransitionScmAggregate(TransitionScmAggregateRequest)
      returns (TransitionScmAggregateResponse);
  rpc GetScmAggregate(GetScmAggregateRequest)
      returns (GetScmAggregateResponse);
  rpc ListScmAggregates(ListScmAggregatesRequest)
      returns (ListScmAggregatesResponse);
}

