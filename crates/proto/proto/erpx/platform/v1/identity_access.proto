syntax = "proto3";

package erpx.platform.v1;

import "erpx/common/v1/context.proto";

message RoleAssignment {
  string id = 1;
  string principal_ref = 2;
  string role_key = 3;
  string scope = 4;
  string valid_from = 5;
  string valid_until = 6;
  string risk_tier = 7;
  uint32 assignment_version = 8;
  bool effective = 9;
}
message ListExpiringRolesRequest {
  uint32 within_days = 1;
  erpx.common.v1.QueryContext context = 2;
}
message ListExpiringRolesResponse { repeated RoleAssignment assignments = 1; }
message RenewRoleRequest {
  string assignment_id = 1;
  string valid_until = 2;
  string grantor = 3;
  string approver = 4;
  erpx.common.v1.CommandContext context = 5;
  string customer_id = 6;
  string module_key = 7;
}
message RenewRoleResponse { RoleAssignment assignment = 1; }
message RoleReviewItem {
  string assignment_id = 1;
  string principal_ref = 2;
  string valid_from = 3;
  string valid_until = 4;
  repeated string classifications = 5;
  string notification_kind = 6;
  string notification_key = 7;
  RoleAssignment assignment = 8;
}
message ListRoleReviewRequest {
  uint32 within_days = 1;
  erpx.common.v1.QueryContext context = 2;
}
message ListRoleReviewResponse {
  string evaluated_at = 1;
  string expiry_horizon_until = 2;
  repeated RoleReviewItem items = 3;
}
message RecoverFinalRoleRequest {
  string request_id = 1;
  string target = 2;
  string holding_id = 3;
  string principal_ref = 4;
  repeated string permissions = 5;
  string functional_domain = 6;
  uint32 authority_level = 7;
  string valid_until = 8;
  string timezone = 9;
  string reason = 10;
  string ticket_reference = 11;
  string requester_ref = 12;
  string approver_ref = 13;
  string reviewer_ref = 14;
  erpx.common.v1.CommandContext context = 15;
}
message RecoverFinalRoleResponse { RoleAssignment assignment = 1; }

message CheckEntitlementRequest {
  string billing_state = 1;
  string module_key = 2;
  bool module_active = 3;
  bool rbac_allows = 4;
  bool mutation = 5;
  erpx.common.v1.QueryContext context = 6;
  // Authoritative evaluation inputs. The legacy client-asserted fields above
  // remain reserved for wire compatibility and are ignored by the server.
  string customer_id = 7;
  string subscription_id = 8;
  string required_permission = 9;
  uint64 approval_amount_minor = 10;
  string support_capability_id = 11;
  string support_device_ref = 12;
  string support_session_id = 13;
  string support_ticket_id = 14;
  string support_mode = 15;
  string support_scope = 16;
}
message CheckEntitlementResponse { bool allowed = 1; string reason = 2; }

message EntitlementCommandReceipt {
  string aggregate_type = 1;
  string aggregate_id = 2;
  uint64 version = 3;
  bool replayed = 4;
  string command_id = 5;
}
message AllocateCompanyEntitlementRequest {
  string customer_id = 1;
  string module_key = 2;
  string company_id = 3;
  uint32 seats = 4;
  uint32 branch_limit = 5;
  erpx.common.v1.CommandContext context = 6;
  string mfa_code = 7;
}
message AllocateCompanyEntitlementResponse {
  EntitlementCommandReceipt receipt = 1;
  string correlation_id = 2;
}
message ActivateCompanyEntitlementRequest {
  string customer_id = 1;
  string module_key = 2;
  string company_id = 3;
  string activated_at = 4;
  erpx.common.v1.CommandContext context = 5;
  string mfa_code = 6;
}
message ActivateCompanyEntitlementResponse {
  EntitlementCommandReceipt receipt = 1;
  string correlation_id = 2;
}
message ActivateBranchEntitlementRequest {
  string customer_id = 1;
  string module_key = 2;
  string company_id = 3;
  string branch_id = 4;
  string activated_at = 5;
  erpx.common.v1.CommandContext context = 6;
  string mfa_code = 7;
}
message ActivateBranchEntitlementResponse {
  EntitlementCommandReceipt receipt = 1;
  string correlation_id = 2;
}

message DirectoryConnectorSummary {
  string connector_id = 1;
  string provider = 2;
  string scope_key = 3;
  string endpoint = 4;
  string base_dn = 5;
  string tls_mode = 6;
  string feed_kind = 7;
  bool enabled = 8;
  uint64 max_import_users = 9;
  uint64 revision = 10;
  string status = 11;
  string last_success_at = 12;
  string freshness = 13;
  string lifecycle = 14;
  string readiness = 15;
  string last_preflight_at = 16;
  string last_heartbeat_at = 17;
  string credential_profile_key = 18;
  string parent_connector_id = 19;
  string directory_authority_fingerprint = 20;
  bool fallback_to_holding = 21;
  string holding_ref = 22;
  string company_id = 23;
  string branch_id = 24;
}

message ListDirectoryConnectorsRequest {
  string scope_key = 1;
  erpx.common.v1.QueryContext context = 2;
}
message ListDirectoryConnectorsResponse {
  repeated DirectoryConnectorSummary connectors = 1;
  string correlation_id = 2;
  // Explicit runtime state. The development profile returns "disabled" and
  // never infers readiness from an empty connector list.
  string readiness_state = 3;
  string readiness_detail = 4;
}
message SaveDirectoryConnectorRequest {
  string connector_id = 1;
  string provider = 2;
  string scope_key = 3;
  string holding_ref = 4;
  string endpoint = 5;
  string base_dn = 6;
  string tls_mode = 7;
  string ca_certificate_sha256 = 8;
  string server_name = 9;
  string minimum_tls_version = 10;
  string feed_kind = 11;
  string credential_ref = 12;
  bool enabled = 13;
  uint64 max_import_users = 14;
  uint64 expected_revision = 15;
  erpx.common.v1.CommandContext context = 16;
  // Transport-only fresh step-up for directory administration. Never persist.
  string mfa_code = 17;
  string user_filter = 18;
  uint32 page_size = 19;
  bytes attribute_mapping_json = 20;
  string ca_reference = 21;
  bytes feed_configuration_json = 22;
  // Preferred secret-free lookup key. credential_ref remains accepted only as
  // a server-side compatibility input and is never returned.
  string credential_profile_key = 23;
  string company_id = 24;
  string branch_id = 25;
  string parent_connector_id = 26;
  string directory_authority_fingerprint = 27;
  bool fallback_to_holding = 28;
}
message SaveDirectoryConnectorResponse {
  DirectoryConnectorSummary connector = 1;
  string correlation_id = 2;
}
message StartDirectoryImportRequest {
  string connector_id = 1;
  uint64 total_users = 2;
  uint32 page_size = 3;
  erpx.common.v1.CommandContext context = 4;
  // Transport-only fresh step-up for a potentially million-user import.
  string mfa_code = 5;
}
message StartDirectoryImportResponse {
  string connector_id = 1;
  uint64 page_count = 2;
  string status = 3;
  string correlation_id = 4;
}
message DirectoryImportStatus {
  string import_id = 1;
  string connector_id = 2;
  string state = 3;
  uint64 max_users = 4;
  uint64 users_seen = 5;
  uint64 pages_applied = 6;
  uint64 page_count = 7;
  string cursor_kind = 8;
  string started_at = 9;
  string finalized_at = 10;
  string updated_at = 11;
  string failure_category = 12;
}
message GetDirectoryImportStatusRequest {
  string connector_id = 1;
  string import_id = 2;
  erpx.common.v1.QueryContext context = 3;
}
message GetDirectoryImportStatusResponse {
  DirectoryImportStatus status = 1;
  string correlation_id = 2;
}
message DirectoryRoleMappingMessage {
  string connector_id = 1;
  string group_ref = 2;
  string role_ref = 3;
  string scope_key = 4;
  bool requires_mfa = 5;
  bool active = 6;
  uint64 revision = 7;
}
message ListDirectoryRoleMappingsRequest {
  string connector_id = 1;
  erpx.common.v1.QueryContext context = 2;
}
message ListDirectoryRoleMappingsResponse {
  repeated DirectoryRoleMappingMessage mappings = 1;
  string correlation_id = 2;
}

// Immutable identity links are read from the authoritative directory link
// relation through a bounded cursor. The canonical identity-link key is an
// opaque, non-secret value; directory credentials and raw transport payloads
// never cross this contract.
message DirectoryIdentityLinkSummary {
  string connector_id = 1;
  string external_subject = 2;
  string immutable_identity_key = 3;
  string principal_ref = 4;
  bool active = 5;
  uint64 source_revision = 6;
  string observed_at = 7;
  string revoked_at = 8;
  bool immutable = 9;
}
message ListDirectoryIdentityLinksRequest {
  string connector_id = 1;
  uint32 page_size = 2;
  string after_identity_link = 3;
  erpx.common.v1.QueryContext context = 4;
}
message ListDirectoryIdentityLinksResponse {
  repeated DirectoryIdentityLinkSummary links = 1;
  bool has_more = 2;
  string next_after_identity_link = 3;
  string correlation_id = 4;
}
message SaveDirectoryRoleMappingRequest {
  string connector_id = 1;
  string group_ref = 2;
  string role_ref = 3;
  string scope_key = 4;
  bool requires_mfa = 5;
  bool active = 6;
  uint64 expected_revision = 7;
  erpx.common.v1.CommandContext context = 8;
  // Transport-only fresh step-up for role mapping administration.
  string mfa_code = 9;
}
message SaveDirectoryRoleMappingResponse {
  DirectoryRoleMappingMessage mapping = 1;
  string correlation_id = 2;
}

message PreflightDirectoryConnectorRequest {
  string connector_id = 1;
  erpx.common.v1.CommandContext context = 2;
  string mfa_code = 3;
}
message PreflightDirectoryConnectorResponse {
  string connector_id = 1;
  string lifecycle = 2;
  bool tls_verified = 3;
  bool bind_verified = 4;
  bool feed_verified = 5;
  string observed_at = 6;
  string correlation_id = 7;
}
message TransitionDirectoryConnectorLifecycleRequest {
  string connector_id = 1;
  string target_lifecycle = 2;
  erpx.common.v1.CommandContext context = 3;
  string mfa_code = 4;
}
message TransitionDirectoryConnectorLifecycleResponse {
  string connector_id = 1;
  string lifecycle = 2;
  string correlation_id = 3;
}
message LinkDirectoryPrincipalRequest {
  string connector_id = 1;
  string external_subject = 2;
  string principal_ref = 3;
  erpx.common.v1.CommandContext context = 4;
  string mfa_code = 5;
}
message LinkDirectoryPrincipalResponse {
  string binding_id = 1;
  string connector_id = 2;
  string external_subject = 3;
  string principal_ref = 4;
  uint64 revision = 5;
  string linked_at = 6;
  string correlation_id = 7;
}
message UnlinkDirectoryPrincipalRequest {
  string connector_id = 1;
  string external_subject = 2;
  erpx.common.v1.CommandContext context = 3;
  string mfa_code = 4;
}
message UnlinkDirectoryPrincipalResponse {
  string connector_id = 1;
  string external_subject = 2;
  bool unlinked = 3;
  string correlation_id = 4;
}
message GetDirectoryConnectorReadinessRequest {
  string connector_id = 1;
  erpx.common.v1.QueryContext context = 2;
}
message GetDirectoryConnectorReadinessResponse {
  string connector_id = 1;
  string lifecycle = 2;
  string readiness = 3;
  string last_preflight_at = 4;
  string last_import_completed_at = 5;
  string last_reconciled_at = 6;
  string last_heartbeat_at = 7;
  uint32 unresolved_conflicts = 8;
  string correlation_id = 9;
}
message ReconcileDirectoryConnectorRequest {
  string connector_id = 1;
  erpx.common.v1.CommandContext context = 2;
  string mfa_code = 3;
}
message ReconcileDirectoryConnectorResponse {
  string connector_id = 1;
  string state = 2;
  uint32 unresolved_conflicts = 3;
  string correlation_id = 4;
}

message DirectoryIdentityConflictSummary {
  string conflict_id = 1;
  string connector_id = 2;
  string local_principal_ref = 3;
  repeated string match_reasons = 4;
  string state = 5;
  string proposal_state = 6;
  string proposed_by = 7;
  uint64 conflict_version = 8;
  string detected_at = 9;
  string proposed_at = 10;
}
message ListDirectoryConflictsRequest {
  string connector_id = 1;
  uint32 page_size = 2;
  erpx.common.v1.QueryContext context = 3;
}
message ListDirectoryConflictsResponse {
  repeated DirectoryIdentityConflictSummary conflicts = 1;
  string correlation_id = 2;
}
message ProposeDirectoryIdentityReplacementRequest {
  string conflict_id = 1;
  uint64 expected_conflict_version = 2;
  erpx.common.v1.CommandContext context = 3;
  string mfa_code = 4;
}
message ProposeDirectoryIdentityReplacementResponse {
  DirectoryIdentityConflictSummary conflict = 1;
  string correlation_id = 2;
}
message ApproveDirectoryIdentityReplacementRequest {
  string conflict_id = 1;
  uint64 expected_conflict_version = 2;
  erpx.common.v1.CommandContext context = 3;
  string mfa_code = 4;
}
message ApproveDirectoryIdentityReplacementResponse {
  DirectoryIdentityConflictSummary conflict = 1;
  string correlation_id = 2;
}
message RejectDirectoryIdentityReplacementRequest {
  string conflict_id = 1;
  uint64 expected_conflict_version = 2;
  erpx.common.v1.CommandContext context = 3;
  string mfa_code = 4;
}
message RejectDirectoryIdentityReplacementResponse {
  DirectoryIdentityConflictSummary conflict = 1;
  string correlation_id = 2;
}

// Product aggregate transports preserve the source/read split: commands carry
// one validated aggregate payload to the tenant write database, while queries
// read the disposable projection and return only bounded, redacted metadata.
service DirectoryService {
  rpc ListDirectoryConnectors(ListDirectoryConnectorsRequest)
      returns (ListDirectoryConnectorsResponse);
  rpc SaveDirectoryConnector(SaveDirectoryConnectorRequest)
      returns (SaveDirectoryConnectorResponse);
  rpc StartDirectoryImport(StartDirectoryImportRequest)
      returns (StartDirectoryImportResponse);
  rpc GetDirectoryImportStatus(GetDirectoryImportStatusRequest)
      returns (GetDirectoryImportStatusResponse);
  rpc ListDirectoryRoleMappings(ListDirectoryRoleMappingsRequest)
      returns (ListDirectoryRoleMappingsResponse);
  rpc ListDirectoryIdentityLinks(ListDirectoryIdentityLinksRequest)
      returns (ListDirectoryIdentityLinksResponse);
  rpc SaveDirectoryRoleMapping(SaveDirectoryRoleMappingRequest)
      returns (SaveDirectoryRoleMappingResponse);
  rpc PreflightDirectoryConnector(PreflightDirectoryConnectorRequest)
      returns (PreflightDirectoryConnectorResponse);
  rpc TransitionDirectoryConnectorLifecycle(TransitionDirectoryConnectorLifecycleRequest)
      returns (TransitionDirectoryConnectorLifecycleResponse);
  rpc LinkDirectoryPrincipal(LinkDirectoryPrincipalRequest)
      returns (LinkDirectoryPrincipalResponse);
  rpc UnlinkDirectoryPrincipal(UnlinkDirectoryPrincipalRequest)
      returns (UnlinkDirectoryPrincipalResponse);
  rpc GetDirectoryConnectorReadiness(GetDirectoryConnectorReadinessRequest)
      returns (GetDirectoryConnectorReadinessResponse);
  rpc ReconcileDirectoryConnector(ReconcileDirectoryConnectorRequest)
      returns (ReconcileDirectoryConnectorResponse);
  rpc ListDirectoryConflicts(ListDirectoryConflictsRequest)
      returns (ListDirectoryConflictsResponse);
  rpc ProposeDirectoryIdentityReplacement(ProposeDirectoryIdentityReplacementRequest)
      returns (ProposeDirectoryIdentityReplacementResponse);
  rpc ApproveDirectoryIdentityReplacement(ApproveDirectoryIdentityReplacementRequest)
      returns (ApproveDirectoryIdentityReplacementResponse);
  rpc RejectDirectoryIdentityReplacement(RejectDirectoryIdentityReplacementRequest)
      returns (RejectDirectoryIdentityReplacementResponse);
}

service RoleLifecycleService {
  rpc ListExpiringRoles(ListExpiringRolesRequest) returns (ListExpiringRolesResponse);
  rpc RenewRole(RenewRoleRequest) returns (RenewRoleResponse);
  rpc ListRoleReview(ListRoleReviewRequest) returns (ListRoleReviewResponse);
  rpc RecoverFinalRole(RecoverFinalRoleRequest) returns (RecoverFinalRoleResponse);
}

service EntitlementService {
  rpc CheckEntitlement(CheckEntitlementRequest) returns (CheckEntitlementResponse);
  rpc AllocateCompanyEntitlement(AllocateCompanyEntitlementRequest)
      returns (AllocateCompanyEntitlementResponse);
  rpc ActivateCompanyEntitlement(ActivateCompanyEntitlementRequest)
      returns (ActivateCompanyEntitlementResponse);
  rpc ActivateBranchEntitlement(ActivateBranchEntitlementRequest)
      returns (ActivateBranchEntitlementResponse);
}

// Typed CQRS contract for the Identity & Access bounded context. Directory,
// credential, passkey, and session runtimes remain separate inbound adapters.
enum IdentityAccessPrincipalStatus {
  IDENTITY_ACCESS_PRINCIPAL_STATUS_UNSPECIFIED = 0;
  IDENTITY_ACCESS_PRINCIPAL_STATUS_INVITED = 1;
  IDENTITY_ACCESS_PRINCIPAL_STATUS_ACTIVE = 2;
  IDENTITY_ACCESS_PRINCIPAL_STATUS_SUSPENDED = 3;
  IDENTITY_ACCESS_PRINCIPAL_STATUS_DISABLED = 4;
}

enum IdentityAccessRoleRiskTier {
  IDENTITY_ACCESS_ROLE_RISK_TIER_UNSPECIFIED = 0;
  IDENTITY_ACCESS_ROLE_RISK_TIER_PLATFORM_ROOT = 1;
  IDENTITY_ACCESS_ROLE_RISK_TIER_ADMINISTRATOR = 2;
  IDENTITY_ACCESS_ROLE_RISK_TIER_HIGH = 3;
  IDENTITY_ACCESS_ROLE_RISK_TIER_STANDARD = 4;
  IDENTITY_ACCESS_ROLE_RISK_TIER_CONTRACTOR = 5;
  IDENTITY_ACCESS_ROLE_RISK_TIER_SUPPORT_DIAGNOSTIC = 6;
  IDENTITY_ACCESS_ROLE_RISK_TIER_SUPPORT_MUTATION = 7;
  IDENTITY_ACCESS_ROLE_RISK_TIER_EMERGENCY = 8;
}

message IdentityAccessRoleAssignmentView {
  string assignment_id = 1;
  string role_id = 2;
  erpx.common.v1.TenantScope scope = 3;
  string valid_from = 4;
  string valid_until = 5;
  IdentityAccessRoleRiskTier risk_tier = 6;
  string grant_reason = 7;
  optional string ticket_reference = 8;
  string grantor_principal_ref = 9;
  optional string approver_principal_ref = 10;
  optional string revoked_at = 11;
}

message IdentityAccessPrincipalView {
  string principal_id = 1;
  uint64 source_version = 2;
  erpx.common.v1.TenantScope scope = 3;
  string display_name = 4;
  IdentityAccessPrincipalStatus status = 5;
  repeated IdentityAccessRoleAssignmentView assignments = 6;
  string created_at = 7;
  string updated_at = 8;
  string projected_at = 9;
}

message IdentityAccessRoleView {
  string role_id = 1;
  uint64 source_version = 2;
  erpx.common.v1.TenantScope scope = 3;
  string code = 4;
  string display_name = 5;
  IdentityAccessRoleRiskTier risk_tier = 6;
  repeated string permissions = 7;
  string created_at = 8;
  string updated_at = 9;
  string projected_at = 10;
}

message CreateIdentityAccessPrincipalRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string principal_id = 2;
  erpx.common.v1.TenantScope scope = 3;
  string display_name = 4;
}

message IdentityAccessPrincipalMutationRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string principal_id = 2;
}

message AssignIdentityAccessRoleRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string principal_id = 2;
  string assignment_id = 3;
  string role_id = 4;
  erpx.common.v1.TenantScope assignment_scope = 5;
  IdentityAccessRoleRiskTier risk_tier = 6;
  string valid_from = 7;
  string valid_until = 8;
  string grant_reason = 9;
  optional string ticket_reference = 10;
  string grantor_principal_ref = 11;
  optional string approver_principal_ref = 12;
}

message RevokeIdentityAccessRoleRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string principal_id = 2;
  string assignment_id = 3;
}

message DefineIdentityAccessRoleRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string role_id = 2;
  erpx.common.v1.TenantScope scope = 3;
  string code = 4;
  string display_name = 5;
  IdentityAccessRoleRiskTier risk_tier = 6;
  repeated string permissions = 7;
}

message SetIdentityAccessRolePermissionsRequest {
  erpx.common.v1.CommandRequestMetadata metadata = 1;
  string role_id = 2;
  repeated string permissions = 3;
}

message IdentityAccessPrincipalCommandResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  IdentityAccessPrincipalView principal = 2;
}

message IdentityAccessRoleCommandResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  IdentityAccessRoleView role = 2;
}

message GetIdentityAccessPrincipalRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string principal_id = 2;
}

message GetIdentityAccessPrincipalResponse {
  optional IdentityAccessPrincipalView principal = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}

message ListIdentityAccessPrincipalsRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  optional IdentityAccessPrincipalStatus status = 2;
  uint32 page_size = 3;
  optional string cursor = 4;
}

message ListIdentityAccessPrincipalsResponse {
  repeated IdentityAccessPrincipalView principals = 1;
  optional string next_cursor = 2;
  erpx.common.v1.QueryMetadata metadata = 3;
}

message GetIdentityAccessRoleRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  string role_id = 2;
}

message GetIdentityAccessRoleResponse {
  optional IdentityAccessRoleView role = 1;
  erpx.common.v1.QueryMetadata metadata = 2;
}

message ListIdentityAccessRolesRequest {
  erpx.common.v1.QueryRequestMetadata metadata = 1;
  optional IdentityAccessRoleRiskTier risk_tier = 2;
  uint32 page_size = 3;
  optional string cursor = 4;
}

message ListIdentityAccessRolesResponse {
  repeated IdentityAccessRoleView roles = 1;
  optional string next_cursor = 2;
  erpx.common.v1.QueryMetadata metadata = 3;
}

service IdentityAccessCommandService {
  rpc CreatePrincipal(CreateIdentityAccessPrincipalRequest)
      returns (IdentityAccessPrincipalCommandResponse);
  rpc ActivatePrincipal(IdentityAccessPrincipalMutationRequest)
      returns (IdentityAccessPrincipalCommandResponse);
  rpc SuspendPrincipal(IdentityAccessPrincipalMutationRequest)
      returns (IdentityAccessPrincipalCommandResponse);
  rpc ReactivatePrincipal(IdentityAccessPrincipalMutationRequest)
      returns (IdentityAccessPrincipalCommandResponse);
  rpc DisablePrincipal(IdentityAccessPrincipalMutationRequest)
      returns (IdentityAccessPrincipalCommandResponse);
  rpc AssignRole(AssignIdentityAccessRoleRequest)
      returns (IdentityAccessPrincipalCommandResponse);
  rpc RevokeRole(RevokeIdentityAccessRoleRequest)
      returns (IdentityAccessPrincipalCommandResponse);
  rpc DefineRole(DefineIdentityAccessRoleRequest)
      returns (IdentityAccessRoleCommandResponse);
  rpc SetRolePermissions(SetIdentityAccessRolePermissionsRequest)
      returns (IdentityAccessRoleCommandResponse);
}

service IdentityAccessQueryService {
  rpc GetPrincipal(GetIdentityAccessPrincipalRequest)
      returns (GetIdentityAccessPrincipalResponse);
  rpc ListPrincipals(ListIdentityAccessPrincipalsRequest)
      returns (ListIdentityAccessPrincipalsResponse);
  rpc GetRole(GetIdentityAccessRoleRequest)
      returns (GetIdentityAccessRoleResponse);
  rpc ListRoles(ListIdentityAccessRolesRequest)
      returns (ListIdentityAccessRolesResponse);
}
