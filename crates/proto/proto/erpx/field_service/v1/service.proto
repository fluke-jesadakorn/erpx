syntax = "proto3";

package erpx.field_service.v1;

import "erpx/common/v1/context.proto";

enum ServiceOrderStatus {
  SERVICE_ORDER_STATUS_UNSPECIFIED = 0;
  SERVICE_ORDER_STATUS_DRAFT = 1;
  SERVICE_ORDER_STATUS_SCHEDULED = 2;
  SERVICE_ORDER_STATUS_DISPATCHED = 3;
  SERVICE_ORDER_STATUS_IN_PROGRESS = 4;
  SERVICE_ORDER_STATUS_COMPLETED = 5;
  SERVICE_ORDER_STATUS_BILLING_HANDED_OFF = 6;
  SERVICE_ORDER_STATUS_CLOSED = 7;
  SERVICE_ORDER_STATUS_CANCELLED = 8;
  SERVICE_ORDER_STATUS_EXCEPTION = 9;
}

enum ServiceExceptionKind {
  SERVICE_EXCEPTION_KIND_UNSPECIFIED = 0;
  SERVICE_EXCEPTION_KIND_CUSTOMER_MISMATCH = 1;
  SERVICE_EXCEPTION_KIND_ASSET_MISMATCH = 2;
  SERVICE_EXCEPTION_KIND_SIGNATURE_REFUSED = 3;
  SERVICE_EXCEPTION_KIND_COVERAGE_MISMATCH = 4;
  SERVICE_EXCEPTION_KIND_INVENTORY_MISMATCH = 5;
}

message RecordVersionRef {
  string record_id = 1;
  uint64 version = 2;
  string owner_context = 3;
  string record_type = 4;
}

message RecordRef {
  string record_id = 1;
  string owner_context = 2;
  string record_type = 3;
}

message FixedQuantity {
  sint64 units = 1;
  uint32 scale = 2;
}

message MoneyAmount {
  sint64 minor_units = 1;
  string currency = 2;
}

message FieldServiceMutationResponse {
  erpx.common.v1.CommandReceipt receipt = 1;
  string record_type = 2;
  string record_id = 3;
  string lifecycle_status = 4;
}

message ActivateServiceAgreementRequest {
  erpx.common.v1.CommandContext context = 1;
  string service_agreement_id = 2;
  erpx.common.v1.TenantScope scope = 3;
  RecordVersionRef customer = 4;
  repeated RecordRef covered_assets = 5;
  repeated RecordRef covered_locations = 6;
  repeated string service_codes = 7;
  string valid_from = 8;
  string valid_through = 9;
}

message CreateServiceOrderRequest {
  erpx.common.v1.CommandContext context = 1;
  string service_order_id = 2;
  erpx.common.v1.TenantScope scope = 3;
  string service_request_id = 4;
  uint64 service_request_version = 5;
  string service_agreement_id = 6;
  uint64 service_agreement_version = 7;
  repeated string required_skills = 8;
  RecordVersionRef customer = 9;
  RecordVersionRef asset = 10;
  RecordRef location = 11;
  string service_code = 12;
  string requested_at = 13;
}

message ScheduleServiceOrderRequest {
  erpx.common.v1.CommandContext context = 1;
  string service_order_id = 2;
  string scheduled_on = 3;
  RecordVersionRef technician = 4;
  string technician_principal_id = 5;
  repeated string verified_skills = 6;
  string qualification_valid_through = 7;
  RecordVersionRef qualification_evidence = 8;
  erpx.common.v1.TenantScope order_scope = 9;
}

message ReserveServicePartRequest {
  erpx.common.v1.CommandContext context = 1;
  string service_order_id = 2;
  RecordVersionRef part = 3;
  FixedQuantity reserved_quantity = 4;
  RecordVersionRef inventory_reservation = 5;
  erpx.common.v1.TenantScope order_scope = 6;
}

message DispatchServiceOrderRequest {
  erpx.common.v1.CommandContext context = 1;
  string service_order_id = 2;
  string dispatch_id = 3;
  string service_agreement_id = 4;
  uint64 service_agreement_version = 5;
  erpx.common.v1.TenantScope order_scope = 6;
}

message StartServiceVisitRequest {
  erpx.common.v1.CommandContext context = 1;
  string service_order_id = 2;
  string visit_id = 3;
  RecordVersionRef presented_customer = 4;
  RecordVersionRef presented_asset = 5;
  erpx.common.v1.TenantScope order_scope = 6;
}

message RecordServiceExceptionRequest {
  erpx.common.v1.CommandContext context = 1;
  string service_order_id = 2;
  string exception_id = 3;
  ServiceExceptionKind kind = 4;
  string reason = 5;
  RecordVersionRef evidence = 6;
  string recorded_at = 7;
  erpx.common.v1.TenantScope order_scope = 8;
}

message IssueServicePartRequest {
  erpx.common.v1.CommandContext context = 1;
  string service_order_id = 2;
  string part_fact_id = 3;
  string part_record_id = 4;
  FixedQuantity issued_quantity = 5;
  erpx.common.v1.TenantScope order_scope = 6;
}

message CustomerSignatureEvidence {
  bool signed = 1;
  RecordVersionRef evidence = 2;
  optional string refusal_exception_id = 3;
  optional string refusal_reason = 4;
  optional string witnessed_by_principal_id = 5;
}

message CompleteServiceVisitRequest {
  erpx.common.v1.CommandContext context = 1;
  string service_order_id = 2;
  repeated RecordVersionRef completion_evidence = 3;
  CustomerSignatureEvidence customer_signature = 4;
  erpx.common.v1.TenantScope order_scope = 5;
}

message ReleaseFieldServiceBillingRequest {
  erpx.common.v1.CommandContext context = 1;
  string service_order_id = 2;
  erpx.common.v1.TenantScope order_scope = 3;
  string handoff_id = 4;
  MoneyAmount amount = 5;
}

message GetServiceOrderRequest {
  erpx.common.v1.QueryContext context = 1;
  erpx.common.v1.TenantScope order_scope = 2;
  string service_order_id = 3;
}

message GetFieldServiceRecordRequest {
  erpx.common.v1.QueryContext context = 1;
  erpx.common.v1.TenantScope record_scope = 2;
  string record_id = 3;
}

message ServiceOrderProjection {
  string service_order_id = 1;
  uint64 source_version = 2;
  erpx.common.v1.TenantScope scope = 3;
  string service_request_id = 4;
  string service_agreement_id = 5;
  string customer_record_id = 6;
  string asset_record_id = 7;
  string location_record_id = 8;
  string service_code = 9;
  optional string technician_record_id = 10;
  optional string dispatch_id = 11;
  optional string visit_id = 12;
  ServiceOrderStatus status = 13;
  optional string billing_handoff_id = 14;
  uint64 source_position = 15;
  string projected_at = 16;
}

message FieldServiceRecordProjection {
  string record_id = 1;
  uint64 source_version = 2;
  erpx.common.v1.TenantScope scope = 3;
  string record_kind = 4;
  string subject_record_id = 5;
  string lifecycle_status = 6;
  uint64 source_position = 7;
  string projected_at = 8;
}

message GetServiceOrderResponse {
  optional ServiceOrderProjection order = 1;
  erpx.common.v1.ProjectionMetadata projection = 2;
}

message GetFieldServiceRecordResponse {
  optional FieldServiceRecordProjection record = 1;
  erpx.common.v1.ProjectionMetadata projection = 2;
}

service FieldServiceCommandService {
  rpc ActivateAgreement(ActivateServiceAgreementRequest) returns (FieldServiceMutationResponse);
  rpc CreateOrder(CreateServiceOrderRequest) returns (FieldServiceMutationResponse);
  rpc ScheduleOrder(ScheduleServiceOrderRequest) returns (FieldServiceMutationResponse);
  rpc ReservePart(ReserveServicePartRequest) returns (FieldServiceMutationResponse);
  rpc DispatchOrder(DispatchServiceOrderRequest) returns (FieldServiceMutationResponse);
  rpc StartVisit(StartServiceVisitRequest) returns (FieldServiceMutationResponse);
  rpc RecordException(RecordServiceExceptionRequest) returns (FieldServiceMutationResponse);
  rpc IssuePart(IssueServicePartRequest) returns (FieldServiceMutationResponse);
  rpc CompleteVisit(CompleteServiceVisitRequest) returns (FieldServiceMutationResponse);
  rpc ReleaseBilling(ReleaseFieldServiceBillingRequest) returns (FieldServiceMutationResponse);
}

service FieldServiceQueryService {
  rpc GetOrder(GetServiceOrderRequest) returns (GetServiceOrderResponse);
  rpc GetRecord(GetFieldServiceRecordRequest) returns (GetFieldServiceRecordResponse);
}
