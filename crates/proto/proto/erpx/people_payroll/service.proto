syntax = "proto3";

package erpx.people_payroll;

import "erpx/common/context.proto";

message SaveHrEmployeeRequest {
  string holding_id = 1;
  string data_profile_key = 2;
  bytes employee_json = 3;
  bool has_expected_version = 4;
  uint64 expected_version = 5;
  erpx.common.CommandContext context = 6;
}
message HrWriteReceipt {
  string aggregate_type = 1;
  string aggregate_id = 2;
  uint64 version = 3;
  string idempotency_key = 4;
  bool replayed = 5;
}
message SaveHrEmployeeResponse {
  HrWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message TransitionHrEmployeeRequest {
  string holding_id = 1;
  string data_profile_key = 2;
  string employee_id = 3;
  string transition = 4;
  uint64 expected_version = 5;
  string terminated_on = 6;
  erpx.common.CommandContext context = 7;
}
message TransitionHrEmployeeResponse {
  HrWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message SaveHrLeaveRequest {
  string holding_id = 1;
  string data_profile_key = 2;
  bytes leave_json = 3;
  bool has_expected_version = 4;
  uint64 expected_version = 5;
  erpx.common.CommandContext context = 6;
}
message SaveHrLeaveResponse {
  HrWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message SaveHrExpenseRequest {
  string holding_id = 1;
  string data_profile_key = 2;
  bytes expense_json = 3;
  bool has_expected_version = 4;
  uint64 expected_version = 5;
  erpx.common.CommandContext context = 6;
}
message SaveHrExpenseResponse {
  HrWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message SaveHrPayrollRequest {
  string holding_id = 1;
  string data_profile_key = 2;
  bytes payroll_json = 3;
  bool has_expected_version = 4;
  uint64 expected_version = 5;
  erpx.common.CommandContext context = 6;
}
message SaveHrPayrollResponse {
  HrWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message ListHrEmployeesRequest {
  string data_profile_key = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  uint32 page_size = 6;
  string before_employee_id = 7;
  erpx.common.QueryContext context = 8;
}
message HrEmployeeReadRow {
  string employee_id = 1;
  string holding_id = 2;
  string company_id = 3;
  string branch_id = 4;
  string employee_ref = 5;
  string display_name = 6;
  string status = 7;
  string hired_on = 8;
  string terminated_on = 9;
  uint64 source_version = 10;
  string source_event_id = 11;
  string projected_at = 12;
}
message ListHrEmployeesResponse {
  repeated HrEmployeeReadRow employees = 1;
  bool has_more = 2;
  string next_before_employee_id = 3;
  string correlation_id = 4;
}
message ListHrLeaveRequestsRequest {
  string data_profile_key = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  uint32 page_size = 6;
  string before_cursor = 7;
  erpx.common.QueryContext context = 8;
}
message HrLeaveReadRow {
  string leave_id = 1;
  string holding_id = 2;
  string company_id = 3;
  string branch_id = 4;
  string employee_id = 5;
  string starts_on = 6;
  string ends_on = 7;
  string reason = 8;
  string status = 9;
  string requested_by = 10;
  string approved_by = 11;
  uint64 source_version = 12;
  string source_event_id = 13;
  string projected_at = 14;
}
message ListHrLeaveRequestsResponse {
  repeated HrLeaveReadRow leave_requests = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}
message ListHrExpenseClaimsRequest {
  string data_profile_key = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  uint32 page_size = 6;
  string before_cursor = 7;
  erpx.common.QueryContext context = 8;
}
message HrExpenseReadRow {
  string expense_id = 1;
  string holding_id = 2;
  string company_id = 3;
  string branch_id = 4;
  string employee_id = 5;
  string currency = 6;
  int64 amount_minor = 7;
  string status = 8;
  string submitted_by = 9;
  string approved_by = 10;
  uint64 source_version = 11;
  string source_event_id = 12;
  string projected_at = 13;
}
message ListHrExpenseClaimsResponse {
  repeated HrExpenseReadRow expenses = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}
message ListHrPayrollRunsRequest {
  string data_profile_key = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  uint32 page_size = 6;
  uint32 line_page_size = 7;
  string before_cursor = 8;
  erpx.common.QueryContext context = 9;
}
message HrPayrollLineReadRow {
  int32 line_no = 1;
  string holding_id = 2;
  string company_id = 3;
  string branch_id = 4;
  string employee_id = 5;
  int64 gross_minor = 6;
  int64 deductions_minor = 7;
  int64 net_minor = 8;
  uint64 source_version = 9;
  string source_event_id = 10;
  string projected_at = 11;
}
message HrPayrollRunReadRow {
  string payroll_id = 1;
  string holding_id = 2;
  string company_id = 3;
  string branch_id = 4;
  string starts_on = 5;
  string ends_on = 6;
  string status = 7;
  string prepared_by = 8;
  string reviewed_by = 9;
  string approved_by = 10;
  int64 total_gross_minor = 11;
  int64 total_deductions_minor = 12;
  int64 total_net_minor = 13;
  uint64 source_version = 14;
  string source_event_id = 15;
  string projected_at = 16;
  repeated HrPayrollLineReadRow lines = 17;
  bool lines_truncated = 18;
}
message ListHrPayrollRunsResponse {
  repeated HrPayrollRunReadRow payroll_runs = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}
message ListHrReassignmentsRequest {
  string data_profile_key = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  uint32 page_size = 6;
  string before_cursor = 7;
  erpx.common.QueryContext context = 8;
}
message HrReassignmentReadRow {
  string workflow_ref = 1;
  string holding_id = 2;
  string company_id = 3;
  string branch_id = 4;
  string expired_principal_ref = 5;
  string replacement_principal_ref = 6;
  string reason = 7;
  string reassigned_at = 8;
  uint64 source_version = 9;
  string source_event_id = 10;
  string projected_at = 11;
}
message ListHrReassignmentsResponse {
  repeated HrReassignmentReadRow reassignments = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}


enum PeoplePayrollEmployeeStatus {
  PEOPLE_PAYROLL_EMPLOYEE_STATUS_UNSPECIFIED = 0;
  PEOPLE_PAYROLL_EMPLOYEE_STATUS_DRAFT = 1;
  PEOPLE_PAYROLL_EMPLOYEE_STATUS_ACTIVE = 2;
  PEOPLE_PAYROLL_EMPLOYEE_STATUS_ON_LEAVE = 3;
  PEOPLE_PAYROLL_EMPLOYEE_STATUS_SUSPENDED = 4;
  PEOPLE_PAYROLL_EMPLOYEE_STATUS_TERMINATED = 5;
}

enum PeoplePayrollLeaveStatus {
  PEOPLE_PAYROLL_LEAVE_STATUS_UNSPECIFIED = 0;
  PEOPLE_PAYROLL_LEAVE_STATUS_DRAFT = 1;
  PEOPLE_PAYROLL_LEAVE_STATUS_SUBMITTED = 2;
  PEOPLE_PAYROLL_LEAVE_STATUS_APPROVED = 3;
  PEOPLE_PAYROLL_LEAVE_STATUS_REJECTED = 4;
  PEOPLE_PAYROLL_LEAVE_STATUS_CANCELLED = 5;
  PEOPLE_PAYROLL_LEAVE_STATUS_TAKEN = 6;
}

enum PeoplePayrollLeaveTransition {
  PEOPLE_PAYROLL_LEAVE_TRANSITION_UNSPECIFIED = 0;
  PEOPLE_PAYROLL_LEAVE_TRANSITION_SUBMIT = 1;
  PEOPLE_PAYROLL_LEAVE_TRANSITION_APPROVE = 2;
  PEOPLE_PAYROLL_LEAVE_TRANSITION_REJECT = 3;
  PEOPLE_PAYROLL_LEAVE_TRANSITION_CANCEL = 4;
  PEOPLE_PAYROLL_LEAVE_TRANSITION_MARK_TAKEN = 5;
}

enum PeoplePayrollExpenseStatus {
  PEOPLE_PAYROLL_EXPENSE_STATUS_UNSPECIFIED = 0;
  PEOPLE_PAYROLL_EXPENSE_STATUS_DRAFT = 1;
  PEOPLE_PAYROLL_EXPENSE_STATUS_SUBMITTED = 2;
  PEOPLE_PAYROLL_EXPENSE_STATUS_APPROVED = 3;
  PEOPLE_PAYROLL_EXPENSE_STATUS_REJECTED = 4;
  PEOPLE_PAYROLL_EXPENSE_STATUS_REIMBURSED = 5;
}

enum PeoplePayrollExpenseTransition {
  PEOPLE_PAYROLL_EXPENSE_TRANSITION_UNSPECIFIED = 0;
  PEOPLE_PAYROLL_EXPENSE_TRANSITION_SUBMIT = 1;
  PEOPLE_PAYROLL_EXPENSE_TRANSITION_APPROVE = 2;
  PEOPLE_PAYROLL_EXPENSE_TRANSITION_REJECT = 3;
  PEOPLE_PAYROLL_EXPENSE_TRANSITION_REIMBURSE = 4;
}

enum PeoplePayrollRunStatus {
  PEOPLE_PAYROLL_RUN_STATUS_UNSPECIFIED = 0;
  PEOPLE_PAYROLL_RUN_STATUS_DRAFT = 1;
  PEOPLE_PAYROLL_RUN_STATUS_REVIEW = 2;
  PEOPLE_PAYROLL_RUN_STATUS_APPROVED = 3;
  PEOPLE_PAYROLL_RUN_STATUS_POSTED = 4;
  PEOPLE_PAYROLL_RUN_STATUS_CANCELLED = 5;
}

enum PeoplePayrollRunTransition {
  PEOPLE_PAYROLL_RUN_TRANSITION_UNSPECIFIED = 0;
  PEOPLE_PAYROLL_RUN_TRANSITION_SUBMIT_FOR_REVIEW = 1;
  PEOPLE_PAYROLL_RUN_TRANSITION_REVIEW = 2;
  PEOPLE_PAYROLL_RUN_TRANSITION_POST = 3;
  PEOPLE_PAYROLL_RUN_TRANSITION_CANCEL = 4;
}

message PeoplePayrollTransitionMarker {}
message PeoplePayrollTerminateEmployee { string terminated_on = 1; }
message PeoplePayrollEmployeeTransition {
  oneof transition {
    PeoplePayrollTransitionMarker activate = 1;
    PeoplePayrollTransitionMarker put_on_leave = 2;
    PeoplePayrollTransitionMarker return_from_leave = 3;
    PeoplePayrollTransitionMarker suspend = 4;
    PeoplePayrollTerminateEmployee terminate = 5;
  }
}

message PeoplePayrollLineRecord {
  string employee_id = 1;
  int64 gross_minor = 2;
  int64 deductions_minor = 3;
  int64 net_minor = 4;
}

message PeoplePayrollEmployeeRecord {
  string employee_id = 1;
  uint64 source_version = 2;
  erpx.common.AuthorityScope scope = 3;
  string employee_code = 4;
  string display_name = 5;
  string hired_on = 6;
  optional string terminated_on = 7;
  PeoplePayrollEmployeeStatus status = 8;
  string created_at = 9;
  string updated_at = 10;
  string projected_at = 11;
}

message PeoplePayrollLeaveRequestRecord {
  string leave_request_id = 1;
  uint64 source_version = 2;
  erpx.common.AuthorityScope scope = 3;
  string employee_id = 4;
  string starts_on = 5;
  string ends_on = 6;
  string reason = 7;
  PeoplePayrollLeaveStatus status = 8;
  string requested_by = 9;
  optional string approved_by = 10;
  string created_at = 11;
  string updated_at = 12;
  string projected_at = 13;
}

message PeoplePayrollExpenseClaimRecord {
  string expense_claim_id = 1;
  uint64 source_version = 2;
  erpx.common.AuthorityScope scope = 3;
  string employee_id = 4;
  string currency = 5;
  int64 amount_minor = 6;
  string reason = 7;
  PeoplePayrollExpenseStatus status = 8;
  string claimed_by = 9;
  optional string approved_by = 10;
  string created_at = 11;
  string updated_at = 12;
  string projected_at = 13;
}

message PeoplePayrollRunRecord {
  string payroll_run_id = 1;
  uint64 source_version = 2;
  erpx.common.AuthorityScope scope = 3;
  string period_code = 4;
  string starts_on = 5;
  string ends_on = 6;
  string currency = 7;
  repeated PeoplePayrollLineRecord lines = 8;
  PeoplePayrollRunStatus status = 9;
  string prepared_by = 10;
  optional string reviewed_by = 11;
  optional string approved_by = 12;
  int64 total_gross_minor = 13;
  int64 total_deductions_minor = 14;
  int64 total_net_minor = 15;
  string created_at = 16;
  string updated_at = 17;
  string projected_at = 18;
}

message HireEmployeeRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string employee_id = 2;
  string employee_code = 3;
  string display_name = 4;
  string hired_on = 5;
}
message TransitionEmployeeRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string employee_id = 2;
  PeoplePayrollEmployeeTransition transition = 3;
}
message CreateLeaveRequestRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string leave_request_id = 2;
  string employee_id = 3;
  string starts_on = 4;
  string ends_on = 5;
  string reason = 6;
}
message TransitionLeaveRequestRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string leave_request_id = 2;
  PeoplePayrollLeaveTransition transition = 3;
}
message CreateExpenseClaimRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string expense_claim_id = 2;
  string employee_id = 3;
  string currency = 4;
  int64 amount_minor = 5;
  string reason = 6;
}
message TransitionExpenseClaimRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string expense_claim_id = 2;
  PeoplePayrollExpenseTransition transition = 3;
}
message CreatePayrollRunRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string payroll_run_id = 2;
  string period_code = 3;
  string starts_on = 4;
  string ends_on = 5;
  string currency = 6;
  repeated PeoplePayrollLineRecord lines = 7;
}
message TransitionPayrollRunRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string payroll_run_id = 2;
  PeoplePayrollRunTransition transition = 3;
}

message PeoplePayrollEmployeeMutationResponse {
  erpx.common.CommandReceipt receipt = 1;
  PeoplePayrollEmployeeRecord employee = 2;
}
message PeoplePayrollLeaveMutationResponse {
  erpx.common.CommandReceipt receipt = 1;
  PeoplePayrollLeaveRequestRecord leave_request = 2;
}
message PeoplePayrollExpenseMutationResponse {
  erpx.common.CommandReceipt receipt = 1;
  PeoplePayrollExpenseClaimRecord expense_claim = 2;
}
message PeoplePayrollRunMutationResponse {
  erpx.common.CommandReceipt receipt = 1;
  PeoplePayrollRunRecord payroll_run = 2;
}

message GetPeoplePayrollEmployeeRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  string employee_id = 2;
}
message GetPeoplePayrollEmployeeResponse {
  optional PeoplePayrollEmployeeRecord employee = 1;
  erpx.common.QueryMetadata metadata = 2;
}
message ListPeoplePayrollEmployeesRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  optional PeoplePayrollEmployeeStatus status = 2;
  uint32 page_size = 3;
  optional string cursor = 4;
}
message ListPeoplePayrollEmployeesResponse {
  repeated PeoplePayrollEmployeeRecord employees = 1;
  optional string next_cursor = 2;
  erpx.common.QueryMetadata metadata = 3;
}
message GetPeoplePayrollLeaveRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  string leave_request_id = 2;
}
message GetPeoplePayrollLeaveResponse {
  optional PeoplePayrollLeaveRequestRecord leave_request = 1;
  erpx.common.QueryMetadata metadata = 2;
}
message ListPeoplePayrollLeaveRequestsRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  optional string employee_id = 2;
  optional PeoplePayrollLeaveStatus status = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}
message ListPeoplePayrollLeaveRequestsResponse {
  repeated PeoplePayrollLeaveRequestRecord leave_requests = 1;
  optional string next_cursor = 2;
  erpx.common.QueryMetadata metadata = 3;
}
message GetPeoplePayrollExpenseClaimRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  string expense_claim_id = 2;
}
message GetPeoplePayrollExpenseClaimResponse {
  optional PeoplePayrollExpenseClaimRecord expense_claim = 1;
  erpx.common.QueryMetadata metadata = 2;
}
message ListPeoplePayrollExpenseClaimsRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  optional string employee_id = 2;
  optional PeoplePayrollExpenseStatus status = 3;
  uint32 page_size = 4;
  optional string cursor = 5;
}
message ListPeoplePayrollExpenseClaimsResponse {
  repeated PeoplePayrollExpenseClaimRecord expense_claims = 1;
  optional string next_cursor = 2;
  erpx.common.QueryMetadata metadata = 3;
}
message GetPeoplePayrollRunRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  string payroll_run_id = 2;
}
message GetPeoplePayrollRunResponse {
  optional PeoplePayrollRunRecord payroll_run = 1;
  erpx.common.QueryMetadata metadata = 2;
}
message ListPeoplePayrollRunsRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  optional PeoplePayrollRunStatus status = 2;
  optional string starts_on_or_after = 3;
  optional string ends_on_or_before = 4;
  uint32 page_size = 5;
  optional string cursor = 6;
}
message ListPeoplePayrollRunsResponse {
  repeated PeoplePayrollRunRecord payroll_runs = 1;
  optional string next_cursor = 2;
  erpx.common.QueryMetadata metadata = 3;
}

service PeoplePayrollCommandService {
  rpc HireEmployee(HireEmployeeRequest) returns (PeoplePayrollEmployeeMutationResponse);
  rpc TransitionEmployee(TransitionEmployeeRequest)
      returns (PeoplePayrollEmployeeMutationResponse);
  rpc CreateLeaveRequest(CreateLeaveRequestRequest)
      returns (PeoplePayrollLeaveMutationResponse);
  rpc TransitionLeaveRequest(TransitionLeaveRequestRequest)
      returns (PeoplePayrollLeaveMutationResponse);
  rpc CreateExpenseClaim(CreateExpenseClaimRequest)
      returns (PeoplePayrollExpenseMutationResponse);
  rpc TransitionExpenseClaim(TransitionExpenseClaimRequest)
      returns (PeoplePayrollExpenseMutationResponse);
  rpc CreatePayrollRun(CreatePayrollRunRequest) returns (PeoplePayrollRunMutationResponse);
  rpc TransitionPayrollRun(TransitionPayrollRunRequest)
      returns (PeoplePayrollRunMutationResponse);
}

service PeoplePayrollQueryService {
  rpc GetEmployee(GetPeoplePayrollEmployeeRequest)
      returns (GetPeoplePayrollEmployeeResponse);
  rpc ListEmployees(ListPeoplePayrollEmployeesRequest)
      returns (ListPeoplePayrollEmployeesResponse);
  rpc GetLeaveRequest(GetPeoplePayrollLeaveRequest)
      returns (GetPeoplePayrollLeaveResponse);
  rpc ListLeaveRequests(ListPeoplePayrollLeaveRequestsRequest)
      returns (ListPeoplePayrollLeaveRequestsResponse);
  rpc GetExpenseClaim(GetPeoplePayrollExpenseClaimRequest)
      returns (GetPeoplePayrollExpenseClaimResponse);
  rpc ListExpenseClaims(ListPeoplePayrollExpenseClaimsRequest)
      returns (ListPeoplePayrollExpenseClaimsResponse);
  rpc GetPayrollRun(GetPeoplePayrollRunRequest) returns (GetPeoplePayrollRunResponse);
  rpc ListPayrollRuns(ListPeoplePayrollRunsRequest) returns (ListPeoplePayrollRunsResponse);
}
