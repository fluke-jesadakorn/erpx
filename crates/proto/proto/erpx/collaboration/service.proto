syntax = "proto3";
package erpx.collaboration;

import "erpx/interface/reference.proto";

enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_HUMAN = 1;
  PRINCIPAL_KIND_AGENT = 2;
  PRINCIPAL_KIND_HUMAN_GROUP = 3;
  PRINCIPAL_KIND_AGENT_POOL = 4;
}

message PrincipalRef {
  string principal_id = 1;
  PrincipalKind kind = 2;
}

enum AudienceRealm {
  AUDIENCE_REALM_UNSPECIFIED = 0;
  AUDIENCE_REALM_INTERNAL = 1;
  AUDIENCE_REALM_EXTERNAL_CUSTOMER = 2;
  AUDIENCE_REALM_EXTERNAL_SUPPLIER = 3;
  AUDIENCE_REALM_EXTERNAL_CANDIDATE = 4;
  AUDIENCE_REALM_EXTERNAL_COMMERCE = 5;
  AUDIENCE_REALM_EXTERNAL_SIGNATORY = 6;
}

message Audience {
  AudienceRealm realm = 1;
  erpx.interface.AuthorityScope scope = 2;
  repeated PrincipalRef participants = 3;
}

message ThreadAnchor {
  erpx.interface.RecordRef record = 1;
  optional string location_kind = 2;
  optional string locator = 3;
  optional uint64 source_revision = 4;
  optional bytes source_digest_sha256 = 5;
}

message CommandMetadata {
  string holding_id = 1;
  erpx.interface.AuthorityScope authority_scope = 2;
  string actor_principal_id = 3;
  string command_id = 4;
  string correlation_id = 5;
  string idempotency_key = 6;
  bytes request_digest_sha256 = 7;
  optional uint64 expected_thread_version = 8;
}

enum TypedCommentTokenKind {
  TYPED_COMMENT_TOKEN_KIND_UNSPECIFIED = 0;
  TYPED_COMMENT_TOKEN_KIND_USER = 1;
  TYPED_COMMENT_TOKEN_KIND_GROUP = 2;
  TYPED_COMMENT_TOKEN_KIND_AGENT = 3;
  TYPED_COMMENT_TOKEN_KIND_AGENT_POOL = 4;
  TYPED_COMMENT_TOKEN_KIND_RECORD = 5;
  TYPED_COMMENT_TOKEN_KIND_RECORD_VERSION = 6;
  TYPED_COMMENT_TOKEN_KIND_FIELD = 7;
}

// Identity is carried independently from both the block document and the
// display-label snapshot. Fields unused by the selected kind must be empty.
message TypedCommentToken {
  string token_id = 1;
  TypedCommentTokenKind kind = 2;
  optional PrincipalRef principal = 3;
  optional string stable_id = 4;
  optional string version_id = 5;
  optional uint64 numeric_version = 6;
  optional erpx.interface.RecordRef record = 7;
  optional string field_id = 8;
  optional uint64 field_schema_version = 9;
  string display_label_snapshot = 10;
  // Query projections may refresh a label after reauthorization. Commands do
  // not accept this field as identity or authority material.
  optional string current_display_label = 11;
}

message CommentDocument {
  uint32 schema_version = 1;
  bytes block_json_utf8 = 2;
  string accessible_plain_text = 3;
  bytes content_digest_sha256 = 4;
  repeated TypedCommentToken typed_tokens = 5;
}

message AttachmentRef {
  string object_id = 1;
  string file_name = 2;
  string media_type = 3;
  string classification = 4;
}

enum RecordRelationKind {
  RECORD_RELATION_KIND_UNSPECIFIED = 0;
  RECORD_RELATION_KIND_RELATES_TO = 1;
  RECORD_RELATION_KIND_BLOCKS = 2;
  RECORD_RELATION_KIND_DEPENDS_ON = 3;
  RECORD_RELATION_KIND_IMPLEMENTS = 4;
  RECORD_RELATION_KIND_SUPERSEDES = 5;
  RECORD_RELATION_KIND_DERIVED_FROM = 6;
  RECORD_RELATION_KIND_EVIDENCE_FOR = 7;
}

message RelationView {
  string relation_id = 1;
  erpx.interface.RecordRef source = 2;
  erpx.interface.RecordRef target = 3;
  RecordRelationKind kind = 4;
  PrincipalRef created_by = 5;
  string created_at = 6;
  optional PrincipalRef revoked_by = 7;
  optional string revoked_at = 8;
  uint64 version = 9;
  uint64 committed_sequence = 10;
}

enum AttachmentLifecycle {
  ATTACHMENT_LIFECYCLE_UNSPECIFIED = 0;
  ATTACHMENT_LIFECYCLE_PENDING_UPLOAD = 1;
  ATTACHMENT_LIFECYCLE_PENDING_SCAN = 2;
  ATTACHMENT_LIFECYCLE_READY = 3;
  ATTACHMENT_LIFECYCLE_QUARANTINED = 4;
  ATTACHMENT_LIFECYCLE_EXPIRED = 5;
}

message AttachmentView {
  string attachment_id = 1;
  erpx.interface.RecordRef anchor = 2;
  optional string thread_id = 3;
  string file_name = 4;
  string media_type = 5;
  uint64 size_bytes = 6;
  bytes digest_sha256 = 7;
  string classification = 8;
  AttachmentLifecycle lifecycle = 9;
  PrincipalRef uploaded_by = 10;
  string created_at = 11;
  optional string expires_at = 12;
  string updated_at = 13;
}

message ReactionView {
  string comment_id = 1;
  PrincipalRef principal = 2;
  string value = 3;
  string created_at = 4;
}

message FollowerView {
  PrincipalRef principal = 1;
  optional string mandatory_reason = 2;
  optional string muted_until = 3;
  optional string snoozed_until = 4;
}

message ThreadRetentionPolicyV2 {
  string parent_retain_until = 1;
  string comment_retain_until = 2;
  string jurisdiction_retain_until = 3;
  repeated string legal_hold_ids = 4;
}

enum CommentVisibilityV2 {
  COMMENT_VISIBILITY_V2_UNSPECIFIED = 0;
  COMMENT_VISIBILITY_V2_VISIBLE = 1;
  COMMENT_VISIBILITY_V2_TOMBSTONE = 2;
  COMMENT_VISIBILITY_V2_RESTRICTED = 3;
}

message CommentProjectionV2 {
  string comment_id = 1;
  PrincipalRef author = 2;
  uint64 revision = 3;
  CommentVisibilityV2 visibility = 4;
  // Phase 2 comments are plain text. Strings that look like @mentions remain
  // text and never trigger notification, assignment, or Agent invocation.
  optional string plain_text = 5;
  repeated AttachmentView attachments = 6;
  repeated ReactionView reactions = 7;
  string created_at = 8;
  string updated_at = 9;
  optional CommentDocument document = 10;
}

enum ThreadStateV2 {
  THREAD_STATE_V2_UNSPECIFIED = 0;
  THREAD_STATE_V2_OPEN = 1;
  THREAD_STATE_V2_RESOLVED = 2;
}

message ThreadProjectionV2 {
  string thread_id = 1;
  ThreadAnchor anchor = 2;
  Audience audience = 3;
  string classification = 4;
  ThreadStateV2 state = 5;
  bool pinned = 6;
  uint64 aggregate_version = 7;
  uint64 projection_checkpoint = 8;
  repeated CommentProjectionV2 comments = 9;
  repeated FollowerView followers = 10;
  ThreadRetentionPolicyV2 retention = 11;
}

message MentionTarget {
  PrincipalRef principal = 1;
  optional uint64 group_version = 2;
  repeated string recipient_snapshot_principal_ids = 3;
  optional string selected_agent_principal_id = 4;
}

message MentionToken {
  string mention_event_id = 1;
  MentionTarget target = 2;
}

message MutationReceipt {
  string thread_id = 1;
  uint64 aggregate_version = 2;
  uint64 last_event_cursor = 3;
  bool replayed = 4;
}

message CreateThreadRequest {
  CommandMetadata metadata = 1;
  string thread_id = 2;
  ThreadAnchor anchor = 3;
  Audience audience = 4;
  string classification = 5;
  string authorization_policy_id = 6;
  string parent_retain_until = 7;
  string comment_retain_until = 8;
  string jurisdiction_retain_until = 9;
  repeated string legal_hold_ids = 10;
}

message AddCommentRequest {
  CommandMetadata metadata = 1;
  string thread_id = 2;
  string comment_id = 3;
  CommentDocument document = 4;
  repeated AttachmentRef attachments = 5;
  repeated MentionToken mentions = 6;
}

message EditCommentRequest {
  CommandMetadata metadata = 1;
  string thread_id = 2;
  string comment_id = 3;
  CommentDocument document = 4;
  repeated AttachmentRef attachments = 5;
  repeated MentionToken new_mentions = 6;
}

message CommentIdentityRequest {
  CommandMetadata metadata = 1;
  string thread_id = 2;
  string comment_id = 3;
}

enum ThreadTransition {
  THREAD_TRANSITION_UNSPECIFIED = 0;
  THREAD_TRANSITION_RESOLVE = 1;
  THREAD_TRANSITION_REOPEN = 2;
  THREAD_TRANSITION_PIN = 3;
  THREAD_TRANSITION_UNPIN = 4;
}

message TransitionThreadRequest {
  CommandMetadata metadata = 1;
  string thread_id = 2;
  ThreadTransition transition = 3;
}

message ReactionRequest {
  CommandMetadata metadata = 1;
  string thread_id = 2;
  string comment_id = 3;
  string reaction = 4;
  bool remove = 5;
}

message FollowingRequest {
  CommandMetadata metadata = 1;
  string thread_id = 2;
  bool follow = 3;
  optional string mute_until = 4;
  optional string snooze_until = 5;
}

message WithdrawMentionRequest {
  CommandMetadata metadata = 1;
  string thread_id = 2;
  string mention_event_id = 3;
}

enum ModerationDecision {
  MODERATION_DECISION_UNSPECIFIED = 0;
  MODERATION_DECISION_REPORT = 1;
  MODERATION_DECISION_QUARANTINE = 2;
  MODERATION_DECISION_HIDE = 3;
  MODERATION_DECISION_RESTORE = 4;
  MODERATION_DECISION_REDACT = 5;
}

message ModerateCommentRequest {
  CommandMetadata metadata = 1;
  string thread_id = 2;
  string comment_id = 3;
  string moderation_case_id = 4;
  ModerationDecision decision = 5;
  string reason_code = 6;
  string encrypted_evidence_object_id = 7;
  bytes evidence_digest_sha256 = 8;
  uint32 evidence_key_version = 9;
}

message ProposeActionCardRequest {
  CommandMetadata metadata = 1;
  string thread_id = 2;
  string action_card_id = 3;
  string owner_context = 4;
  string typed_command = 5;
  bytes payload_digest_sha256 = 6;
  string expires_at = 7;
}

message ConfirmActionCardRequest {
  CommandMetadata metadata = 1;
  string thread_id = 2;
  string action_card_id = 3;
}

message AddRecordRelationRequest {
  CommandMetadata metadata = 1;
  string relation_id = 2;
  erpx.interface.RecordRef source = 3;
  erpx.interface.RecordRef target = 4;
  RecordRelationKind kind = 5;
  uint64 expected_source_version = 6;
}

message RevokeRecordRelationRequest {
  CommandMetadata metadata = 1;
  string relation_id = 2;
  erpx.interface.RecordRef source = 3;
  erpx.interface.RecordRef target = 4;
  uint64 expected_relation_version = 5;
}

message RelationMutationReceipt {
  RelationView relation = 1;
  bool replayed = 2;
}

message StartRecordThreadWithCommentRequest {
  CommandMetadata metadata = 1;
  string thread_id = 2;
  erpx.interface.RecordRef record = 3;
  string comment_id = 4;
  string plain_text = 5;
  repeated string attachment_ids = 6;
  optional CommentDocument document = 7;
  repeated MentionToken mentions = 8;
}

message PrepareAttachmentUploadRequest {
  CommandMetadata metadata = 1;
  string attachment_id = 2;
  erpx.interface.RecordRef anchor = 3;
  optional string thread_id = 4;
  string file_name = 5;
  string media_type = 6;
  uint64 size_bytes = 7;
  bytes digest_sha256 = 8;
}

message PrepareAttachmentUploadResponse {
  AttachmentView attachment = 1;
  string upload_token = 2;
  string upload_path = 3;
  string upload_expires_at = 4;
}

message FinalizeAttachmentUploadRequest {
  CommandMetadata metadata = 1;
  string attachment_id = 2;
  erpx.interface.RecordRef anchor = 3;
  optional string thread_id = 4;
  bytes digest_sha256 = 5;
  uint64 size_bytes = 6;
}

message GetThreadRequest {
  string holding_id = 1;
  erpx.interface.AuthorityScope authority_scope = 2;
  string actor_principal_id = 3;
  string thread_id = 4;
}

message GetThreadResponse {
  // JSON contains only the already-authorized projection. Moderated evidence
  // and restricted comment bodies are never carried in this field.
  optional bytes authorized_projection_json_utf8 = 1;
  bool stale = 2;
}

message SearchThreadsRequest {
  string holding_id = 1;
  erpx.interface.AuthorityScope authority_scope = 2;
  string actor_principal_id = 3;
  string query = 4;
  uint32 page_size = 5;
  optional string cursor = 6;
}

message SearchThreadsResponse {
  repeated bytes authorized_projection_json_utf8 = 1;
  optional string next_cursor = 2;
  uint64 authorized_count = 3;
}

// Lists only threads anchored to one already-resolved first-class record.
// The server authorizes the record before candidate lookup and authorizes each
// exact thread audience before a comment document enters this response.
message ListThreadsByRecordRequest {
  string holding_id = 1;
  erpx.interface.AuthorityScope authority_scope = 2;
  string actor_principal_id = 3;
  erpx.interface.RecordRef record = 4;
  uint32 page_size = 5;
  optional string cursor = 6;
}

message ListThreadsByRecordResponse {
  repeated bytes authorized_projection_json_utf8 = 1;
  optional string next_cursor = 2;
  // Count includes only threads visible under the current record, scope,
  // realm, audience, and principal policy. Hidden matches are never counted.
  uint64 authorized_count = 3;
  erpx.interface.DirectoryFreshness freshness = 4;
}

message GetThreadV2Response {
  optional ThreadProjectionV2 thread = 1;
  erpx.interface.DirectoryFreshness freshness = 2;
}

message ListThreadsByRecordV2Response {
  repeated ThreadProjectionV2 threads = 1;
  optional string next_cursor = 2;
  uint64 authorized_count = 3;
  erpx.interface.DirectoryFreshness freshness = 4;
}

message ListRecordRelationsRequest {
  string holding_id = 1;
  erpx.interface.AuthorityScope authority_scope = 2;
  string actor_principal_id = 3;
  erpx.interface.RecordRef source = 4;
  uint32 page_size = 5;
  optional string cursor = 6;
  bool include_revoked = 7;
}

message ListRecordRelationsResponse {
  repeated RelationView relations = 1;
  optional string next_cursor = 2;
  uint64 authorized_count = 3;
  erpx.interface.DirectoryFreshness freshness = 4;
  uint64 projection_checkpoint = 5;
}

message GetAttachmentDownloadRequest {
  string holding_id = 1;
  erpx.interface.AuthorityScope authority_scope = 2;
  string actor_principal_id = 3;
  string attachment_id = 4;
  erpx.interface.RecordRef anchor = 5;
  optional string thread_id = 6;
}

message GetAttachmentDownloadResponse {
  AttachmentView attachment = 1;
  string download_token = 2;
  string download_path = 3;
  string expires_at = 4;
}

message ListMentionInboxRequest {
  string holding_id = 1;
  erpx.interface.AuthorityScope authority_scope = 2;
  string actor_principal_id = 3;
  uint64 after_cursor = 4;
  uint32 page_size = 5;
}

message OpaqueMentionInboxFact {
  uint64 cursor = 1;
  string event_id = 2;
  string thread_id = 3;
  string mention_event_id = 4;
  string anchor_record_id = 5;
  string created_at = 6;
}

message ListMentionInboxResponse {
  repeated OpaqueMentionInboxFact items = 1;
}

// Unlike the generic data-plane stream request, a Collaboration subscription
// always identifies one authorized anchored thread. The server resolves its
// opaque anchor and applies record plus audience policy before reading a
// cursor or event row.
message CollaborationStreamRequest {
  string holding_id = 1;
  erpx.interface.AuthorityScope authority_scope = 2;
  string actor_principal_id = 3;
  string thread_id = 4;
  optional string cursor = 5;
  uint32 limit = 6;
}

service CollaborationCommandService {
  rpc CreateThread(CreateThreadRequest) returns (MutationReceipt);
  rpc AddComment(AddCommentRequest) returns (MutationReceipt);
  rpc EditComment(EditCommentRequest) returns (MutationReceipt);
  rpc TombstoneComment(CommentIdentityRequest) returns (MutationReceipt);
  rpc TransitionThread(TransitionThreadRequest) returns (MutationReceipt);
  rpc SetReaction(ReactionRequest) returns (MutationReceipt);
  rpc SetFollowing(FollowingRequest) returns (MutationReceipt);
  rpc WithdrawMention(WithdrawMentionRequest) returns (MutationReceipt);
  rpc ModerateComment(ModerateCommentRequest) returns (MutationReceipt);
  rpc ProposeActionCard(ProposeActionCardRequest) returns (MutationReceipt);
  rpc ConfirmActionCard(ConfirmActionCardRequest) returns (MutationReceipt);
  rpc AddRecordRelation(AddRecordRelationRequest) returns (RelationMutationReceipt);
  rpc RevokeRecordRelation(RevokeRecordRelationRequest) returns (RelationMutationReceipt);
  rpc StartRecordThreadWithComment(StartRecordThreadWithCommentRequest) returns (MutationReceipt);
  rpc PrepareAttachmentUpload(PrepareAttachmentUploadRequest) returns (PrepareAttachmentUploadResponse);
  rpc FinalizeAttachmentUpload(FinalizeAttachmentUploadRequest) returns (AttachmentView);
}

service CollaborationQueryService {
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc SearchThreads(SearchThreadsRequest) returns (SearchThreadsResponse);
  rpc ListThreadsByRecord(ListThreadsByRecordRequest) returns (ListThreadsByRecordResponse);
  rpc ListMentionInbox(ListMentionInboxRequest) returns (ListMentionInboxResponse);
  rpc ListRecordRelations(ListRecordRelationsRequest) returns (ListRecordRelationsResponse);
  rpc GetThreadV2(GetThreadRequest) returns (GetThreadV2Response);
  rpc ListThreadsByRecordV2(ListThreadsByRecordRequest) returns (ListThreadsByRecordV2Response);
  rpc GetAttachmentDownload(GetAttachmentDownloadRequest) returns (GetAttachmentDownloadResponse);
}

service CollaborationStreamService {
  rpc Subscribe(CollaborationStreamRequest) returns (stream erpx.interface.StreamEvent);
}
