syntax = "proto3";

package erpx.brand.v2;

import "erpx/common/v2/context.proto";

enum BrandBusinessUnitKind {
  BRAND_BUSINESS_UNIT_KIND_UNSPECIFIED = 0;
  BRAND_BUSINESS_UNIT_KIND_OPERATIONS = 1;
  BRAND_BUSINESS_UNIT_KIND_FINANCE = 2;
  BRAND_BUSINESS_UNIT_KIND_SALES = 3;
  BRAND_BUSINESS_UNIT_KIND_PROCUREMENT = 4;
  BRAND_BUSINESS_UNIT_KIND_INVENTORY = 5;
  BRAND_BUSINESS_UNIT_KIND_ASSETS = 6;
  BRAND_BUSINESS_UNIT_KIND_MAINTENANCE = 7;
  BRAND_BUSINESS_UNIT_KIND_QUALITY = 8;
  BRAND_BUSINESS_UNIT_KIND_MARKETING_CRM = 9;
  BRAND_BUSINESS_UNIT_KIND_HR_PAYROLL = 10;
  BRAND_BUSINESS_UNIT_KIND_POINT_OF_SALE = 11;
  BRAND_BUSINESS_UNIT_KIND_LEGAL = 12;
}

message BrandPlatformTarget {}
message BrandHoldingTarget {
  string tenant_id = 1;
  string holding_id = 2;
}
message BrandBusinessUnitTarget {
  string tenant_id = 1;
  string holding_id = 2;
  BrandBusinessUnitKind business_unit = 3;
}
message BrandTargetScope {
  oneof target {
    BrandPlatformTarget platform = 1;
    BrandHoldingTarget holding = 2;
    BrandBusinessUnitTarget business_unit = 3;
  }
}

enum BrandCategory {
  BRAND_CATEGORY_UNSPECIFIED = 0;
  BRAND_CATEGORY_IDENTITY = 1;
  BRAND_CATEGORY_COLOR = 2;
  BRAND_CATEGORY_TYPOGRAPHY = 3;
  BRAND_CATEGORY_SHAPE = 4;
  BRAND_CATEGORY_ELEVATION = 5;
  BRAND_CATEGORY_DENSITY = 6;
  BRAND_CATEGORY_NAVIGATION = 7;
  BRAND_CATEGORY_MOTION = 8;
}
enum BrandLifecycleState {
  BRAND_LIFECYCLE_STATE_UNSPECIFIED = 0;
  BRAND_LIFECYCLE_STATE_DRAFT = 1;
  BRAND_LIFECYCLE_STATE_PUBLISHED = 2;
}
enum BrandFontPack {
  BRAND_FONT_PACK_UNSPECIFIED = 0;
  BRAND_FONT_PACK_ERPX_SANS = 1;
  BRAND_FONT_PACK_CORPORATE_SANS = 2;
  BRAND_FONT_PACK_THAI_FORMAL = 3;
  BRAND_FONT_PACK_SYSTEM_UI = 4;
}
enum BrandDensity {
  BRAND_DENSITY_UNSPECIFIED = 0;
  BRAND_DENSITY_COMPACT = 1;
  BRAND_DENSITY_COMFORTABLE = 2;
  BRAND_DENSITY_SPACIOUS = 3;
}
enum BrandRadius {
  BRAND_RADIUS_UNSPECIFIED = 0;
  BRAND_RADIUS_SQUARE = 1;
  BRAND_RADIUS_SOFT = 2;
  BRAND_RADIUS_ROUNDED = 3;
}
enum BrandElevation {
  BRAND_ELEVATION_UNSPECIFIED = 0;
  BRAND_ELEVATION_FLAT = 1;
  BRAND_ELEVATION_SUBTLE = 2;
  BRAND_ELEVATION_ELEVATED = 3;
}
enum BrandNavigation {
  BRAND_NAVIGATION_UNSPECIFIED = 0;
  BRAND_NAVIGATION_SOLID = 1;
  BRAND_NAVIGATION_TINTED = 2;
}
enum BrandMotion {
  BRAND_MOTION_UNSPECIFIED = 0;
  BRAND_MOTION_NONE = 1;
  BRAND_MOTION_SUBTLE = 2;
  BRAND_MOTION_STANDARD = 3;
}
enum BrandAssetKindValue {
  BRAND_ASSET_KIND_VALUE_UNSPECIFIED = 0;
  BRAND_ASSET_KIND_VALUE_LOGO_MARK = 1;
  BRAND_ASSET_KIND_VALUE_WORDMARK = 2;
  BRAND_ASSET_KIND_VALUE_FAVICON = 3;
  BRAND_ASSET_KIND_VALUE_LOGIN_ARTWORK = 4;
}

message BrandCqrsPalette {
  string primary = 1;
  string on_primary = 2;
  string accent = 3;
  string on_accent = 4;
  string canvas = 5;
  string surface = 6;
  string surface_raised = 7;
  string border = 8;
  string text = 9;
  string text_muted = 10;
  string link = 11;
  string focus = 12;
}
message BrandCqrsTokenSet {
  BrandCqrsPalette light = 1;
  BrandCqrsPalette dark = 2;
  BrandFontPack font_pack = 3;
  uint32 heading_scale_percent = 4;
  uint32 body_scale_percent = 5;
  uint32 line_height_percent = 6;
  BrandDensity density = 7;
  BrandRadius radius = 8;
  BrandElevation elevation = 9;
  BrandNavigation navigation = 10;
  bool navigation_expanded_by_default = 11;
  BrandMotion motion = 12;
}
message BrandCqrsAssetReference {
  BrandAssetKindValue kind = 1;
  string object_key = 2;
  string sha256 = 3;
  string media_type = 4;
  uint64 byte_length = 5;
  optional uint32 width = 6;
  optional uint32 height = 7;
}
message BrandCqrsAssetManifest {
  optional BrandCqrsAssetReference logo_mark = 1;
  optional BrandCqrsAssetReference wordmark = 2;
  optional BrandCqrsAssetReference favicon = 3;
  optional BrandCqrsAssetReference login_artwork = 4;
}
message BrandDefinition {
  string display_name = 1;
  string short_name = 2;
  BrandCqrsTokenSet tokens = 3;
  BrandCqrsAssetManifest assets = 4;
  repeated BrandCategory overridden_categories = 5;
  repeated BrandCategory locked_categories = 6;
}
message BrandRevisionRecord {
  uint64 revision = 1;
  BrandLifecycleState lifecycle = 2;
  BrandDefinition definition = 3;
  optional uint64 parent_published_revision = 4;
  string updated_by = 5;
  string updated_at = 6;
}
message BrandProfileRecord {
  string profile_id = 1;
  uint64 aggregate_version = 2;
  BrandTargetScope scope = 3;
  optional BrandRevisionRecord draft = 4;
  optional BrandRevisionRecord published = 5;
  string created_at = 6;
  string updated_at = 7;
}
message ResolvedBrandRecord {
  BrandTargetScope scope = 1;
  uint64 published_revision = 2;
  BrandDefinition definition = 3;
  repeated BrandCategory inherited_categories = 4;
  repeated BrandCategory effective_locked_categories = 5;
  string digest = 6;
}

message CreateBrandDraftRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string profile_id = 2;
  BrandTargetScope scope = 3;
  BrandDefinition definition = 4;
  string reason = 5;
}
message CreateBrandDraftResponse {
  erpx.common.v2.CommandReceipt receipt = 1;
  BrandProfileRecord profile = 2;
}
message SaveBrandDraftRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string profile_id = 2;
  BrandDefinition definition = 3;
  string reason = 4;
}
message SaveBrandDraftResponse {
  erpx.common.v2.CommandReceipt receipt = 1;
  BrandProfileRecord profile = 2;
}
message PublishBrandDraftRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string profile_id = 2;
  string reason = 3;
}
message PublishBrandDraftResponse {
  erpx.common.v2.CommandReceipt receipt = 1;
  BrandProfileRecord profile = 2;
}
message RollbackBrandRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string profile_id = 2;
  uint64 source_revision = 3;
  string reason = 4;
}
message RollbackBrandResponse {
  erpx.common.v2.CommandReceipt receipt = 1;
  BrandProfileRecord profile = 2;
}
message SetBrandCategoryLocksRequest {
  erpx.common.v2.CommandRequestMetadata metadata = 1;
  string profile_id = 2;
  repeated BrandCategory locked_categories = 3;
  string reason = 4;
}
message SetBrandCategoryLocksResponse {
  erpx.common.v2.CommandReceipt receipt = 1;
  BrandProfileRecord profile = 2;
}

message GetBrandDraftRequest {
  erpx.common.v2.QueryRequestMetadata metadata = 1;
  BrandTargetScope scope = 2;
}
message GetBrandDraftResponse {
  optional BrandProfileRecord profile = 1;
  erpx.common.v2.QueryMetadata metadata = 2;
}
message GetResolvedBrandRequest {
  erpx.common.v2.QueryRequestMetadata metadata = 1;
  BrandTargetScope scope = 2;
}
message GetResolvedBrandResponse {
  optional ResolvedBrandRecord brand = 1;
  erpx.common.v2.QueryMetadata metadata = 2;
}
message ListBrandHistoryRequest {
  erpx.common.v2.QueryRequestMetadata metadata = 1;
  BrandTargetScope scope = 2;
  uint32 page_size = 3;
  optional string cursor = 4;
}
message BrandHistoryRecord {
  string profile_id = 1;
  uint64 revision = 2;
  BrandLifecycleState lifecycle = 3;
  BrandDefinition definition = 4;
  optional uint64 parent_published_revision = 5;
  string updated_by = 6;
  string reason = 7;
  string created_at = 8;
  optional string published_at = 9;
  optional string archived_at = 10;
}
message ListBrandHistoryResponse {
  repeated BrandHistoryRecord entries = 1;
  optional string next_cursor = 2;
  erpx.common.v2.QueryMetadata metadata = 3;
}

service BrandCommandService {
  rpc CreateDraft(CreateBrandDraftRequest) returns (CreateBrandDraftResponse);
  rpc SaveDraft(SaveBrandDraftRequest) returns (SaveBrandDraftResponse);
  rpc PublishDraft(PublishBrandDraftRequest)
      returns (PublishBrandDraftResponse);
  rpc Rollback(RollbackBrandRequest) returns (RollbackBrandResponse);
  rpc SetCategoryLocks(SetBrandCategoryLocksRequest)
      returns (SetBrandCategoryLocksResponse);
}

service BrandQueryService {
  rpc GetDraft(GetBrandDraftRequest) returns (GetBrandDraftResponse);
  rpc GetResolved(GetResolvedBrandRequest) returns (GetResolvedBrandResponse);
  rpc ListHistory(ListBrandHistoryRequest) returns (ListBrandHistoryResponse);
}
