syntax = "proto3";

package erpx.legal;

import "erpx/common/context.proto";

message SaveLegalContractRequest {
  string holding_id = 1;
  string data_profile_key = 2;
  bytes contract_json = 3;
  bool has_expected_version = 4;
  uint64 expected_version = 5;
  erpx.common.CommandContext context = 6;
}
message SaveLegalDocumentRequest {
  string holding_id = 1;
  string data_profile_key = 2;
  bytes document_json = 3;
  bool has_expected_version = 4;
  uint64 expected_version = 5;
  erpx.common.CommandContext context = 6;
}
message RecordLegalAccessRequest {
  string holding_id = 1;
  string data_profile_key = 2;
  bytes access_json = 3;
  erpx.common.CommandContext context = 4;
}
message LegalWriteReceipt {
  string aggregate_type = 1;
  string aggregate_id = 2;
  uint64 version = 3;
  string idempotency_key = 4;
  string event_id = 5;
  bool replayed = 6;
}
message SaveLegalContractResponse {
  LegalWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message SaveLegalDocumentResponse {
  LegalWriteReceipt receipt = 1;
  string correlation_id = 2;
}
message RecordLegalAccessResponse {
  LegalWriteReceipt receipt = 1;
  string correlation_id = 2;
}

message ListLegalContractsRequest {
  string data_profile_key = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  uint32 page_size = 6;
  string before_cursor = 7;
  erpx.common.QueryContext context = 8;
}
message LegalContractPartyReadRow {
  string party_id = 1;
  string role = 2;
}
message LegalContractReadRow {
  string contract_id = 1;
  string holding_id = 2;
  string company_id = 3;
  string branch_id = 4;
  string reference = 5;
  string title = 6;
  string object_ref = 7;
  string content_sha256 = 8;
  string retention_until = 9;
  string status = 10;
  string created_by = 11;
  string approved_by = 12;
  uint64 source_version = 13;
  string source_event_id = 14;
  string projected_at = 15;
  repeated LegalContractPartyReadRow parties = 16;
  string retention_state = 17;
  string source_correlation_id = 18;
}
message ListLegalContractsResponse {
  repeated LegalContractReadRow contracts = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}

message ListLegalDocumentsRequest {
  string data_profile_key = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  uint32 page_size = 6;
  string before_cursor = 7;
  erpx.common.QueryContext context = 8;
}
message LegalDocumentVersionReadRow {
  uint64 version = 1;
  string object_ref = 2;
  string content_sha256 = 3;
  string created_at = 4;
  string created_by = 5;
  uint64 source_version = 6;
  string source_event_id = 7;
}
message LegalDocumentReadRow {
  string document_id = 1;
  string holding_id = 2;
  string company_id = 3;
  string branch_id = 4;
  string title = 5;
  uint64 current_version = 6;
  bool archived = 7;
  uint64 source_version = 8;
  string source_event_id = 9;
  string projected_at = 10;
  repeated LegalDocumentVersionReadRow versions = 11;
  string source_correlation_id = 12;
}
message ListLegalDocumentsResponse {
  repeated LegalDocumentReadRow documents = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}

message ListLegalAccessHistoryRequest {
  string data_profile_key = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  string document_id = 6;
  uint32 page_size = 7;
  string before_cursor = 8;
  erpx.common.QueryContext context = 9;
}
message LegalAccessHistoryReadRow {
  string entry_id = 1;
  string document_id = 2;
  string holding_id = 3;
  string company_id = 4;
  string branch_id = 5;
  uint64 document_version = 6;
  string actor_ref = 7;
  string action = 8;
  string purpose = 9;
  string observed_at = 10;
  uint64 source_version = 11;
  string source_event_id = 12;
  string projected_at = 13;
  string source_correlation_id = 14;
}
message ListLegalAccessHistoryResponse {
  repeated LegalAccessHistoryReadRow entries = 1;
  bool has_more = 2;
  string next_cursor = 3;
  string correlation_id = 4;
}


// Typed Legal CQRS contract. Legacy JSON services remain only until the
// coordinated Server, Worker, and Console v2 cutover.

enum LegalContractStatus {
  LEGAL_CONTRACT_STATUS_UNSPECIFIED = 0;
  LEGAL_CONTRACT_STATUS_DRAFT = 1;
  LEGAL_CONTRACT_STATUS_REVIEW = 2;
  LEGAL_CONTRACT_STATUS_APPROVED = 3;
  LEGAL_CONTRACT_STATUS_ACTIVE = 4;
  LEGAL_CONTRACT_STATUS_EXPIRED = 5;
  LEGAL_CONTRACT_STATUS_TERMINATED = 6;
  LEGAL_CONTRACT_STATUS_ARCHIVED = 7;
}

enum LegalContractTransition {
  LEGAL_CONTRACT_TRANSITION_UNSPECIFIED = 0;
  LEGAL_CONTRACT_TRANSITION_SUBMIT_FOR_REVIEW = 1;
  LEGAL_CONTRACT_TRANSITION_APPROVE = 2;
  LEGAL_CONTRACT_TRANSITION_ACTIVATE = 3;
  LEGAL_CONTRACT_TRANSITION_EXPIRE = 4;
  LEGAL_CONTRACT_TRANSITION_TERMINATE = 5;
  LEGAL_CONTRACT_TRANSITION_ARCHIVE = 6;
}

message LegalContractPartyRecord {
  string party_id = 1;
  string role = 2;
}

message LegalContractRecord {
  string contract_id = 1;
  uint64 source_version = 2;
  erpx.common.AuthorityScope scope = 3;
  string reference = 4;
  string title = 5;
  string object_ref = 6;
  string content_sha256 = 7;
  string retention_until = 8;
  LegalContractStatus status = 9;
  repeated LegalContractPartyRecord parties = 10;
  string created_by = 11;
  optional string approved_by = 12;
  string created_at = 13;
  string updated_at = 14;
  string projected_at = 15;
}

message LegalDocumentVersionRecord {
  uint64 version = 1;
  string object_ref = 2;
  string content_sha256 = 3;
  string created_at = 4;
  string created_by = 5;
}

message LegalDocumentRecord {
  string document_id = 1;
  uint64 source_version = 2;
  erpx.common.AuthorityScope scope = 3;
  string title = 4;
  repeated LegalDocumentVersionRecord versions = 5;
  uint64 current_version = 6;
  bool archived = 7;
  string created_at = 8;
  string updated_at = 9;
  string projected_at = 10;
}

message LegalAccessEntryRecord {
  string access_entry_id = 1;
  uint64 source_version = 2;
  erpx.common.AuthorityScope scope = 3;
  string document_id = 4;
  uint64 document_version = 5;
  string actor_ref = 6;
  string action = 7;
  string purpose = 8;
  string observed_at = 9;
  string projected_at = 10;
}

message CreateLegalContractRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string contract_id = 2;
  erpx.common.AuthorityScope target_scope = 3;
  string reference = 4;
  string title = 5;
  string object_ref = 6;
  string content_sha256 = 7;
  string retention_until = 8;
}

message AddLegalContractPartyRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string contract_id = 2;
  LegalContractPartyRecord party = 3;
}

message TransitionLegalContractRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string contract_id = 2;
  LegalContractTransition transition = 3;
}

message LegalContractMutationResponse {
  erpx.common.CommandReceipt receipt = 1;
  LegalContractRecord contract = 2;
}

message CreateLegalDocumentRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string document_id = 2;
  erpx.common.AuthorityScope target_scope = 3;
  string title = 4;
}

message AddLegalDocumentVersionRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string document_id = 2;
  string object_ref = 3;
  string content_sha256 = 4;
}

message ArchiveLegalDocumentRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string document_id = 2;
}

message LegalDocumentMutationResponse {
  erpx.common.CommandReceipt receipt = 1;
  LegalDocumentRecord document = 2;
}

message RecordLegalDocumentAccessRequest {
  erpx.common.CommandRequestMetadata metadata = 1;
  string access_entry_id = 2;
  string document_id = 3;
  uint64 document_version = 4;
  string action = 5;
  string purpose = 6;
  string observed_at = 7;
}

message LegalAccessMutationResponse {
  erpx.common.CommandReceipt receipt = 1;
  LegalAccessEntryRecord access_entry = 2;
}

message GetLegalContractRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  string contract_id = 2;
}

message GetLegalContractResponse {
  optional LegalContractRecord contract = 1;
  erpx.common.QueryMetadata metadata = 2;
}

message ListTypedLegalContractsRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  optional LegalContractStatus status = 2;
  uint32 page_size = 3;
  optional string cursor = 4;
}

message ListTypedLegalContractsResponse {
  repeated LegalContractRecord contracts = 1;
  optional string next_cursor = 2;
  erpx.common.QueryMetadata metadata = 3;
}

message GetLegalDocumentRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  string document_id = 2;
}

message GetLegalDocumentResponse {
  optional LegalDocumentRecord document = 1;
  erpx.common.QueryMetadata metadata = 2;
}

message ListTypedLegalDocumentsRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  optional bool archived = 2;
  uint32 page_size = 3;
  optional string cursor = 4;
}

message ListTypedLegalDocumentsResponse {
  repeated LegalDocumentRecord documents = 1;
  optional string next_cursor = 2;
  erpx.common.QueryMetadata metadata = 3;
}

message ListTypedLegalAccessHistoryRequest {
  erpx.common.QueryRequestMetadata metadata = 1;
  optional string document_id = 2;
  uint32 page_size = 3;
  optional string cursor = 4;
}

message ListTypedLegalAccessHistoryResponse {
  repeated LegalAccessEntryRecord access_entries = 1;
  optional string next_cursor = 2;
  erpx.common.QueryMetadata metadata = 3;
}

service LegalCommandService {
  rpc CreateContract(CreateLegalContractRequest) returns (LegalContractMutationResponse);
  rpc AddContractParty(AddLegalContractPartyRequest) returns (LegalContractMutationResponse);
  rpc TransitionContract(TransitionLegalContractRequest) returns (LegalContractMutationResponse);
  rpc CreateDocument(CreateLegalDocumentRequest) returns (LegalDocumentMutationResponse);
  rpc AddDocumentVersion(AddLegalDocumentVersionRequest) returns (LegalDocumentMutationResponse);
  rpc ArchiveDocument(ArchiveLegalDocumentRequest) returns (LegalDocumentMutationResponse);
  rpc RecordDocumentAccess(RecordLegalDocumentAccessRequest)
      returns (LegalAccessMutationResponse);
}

service LegalQueryService {
  rpc GetContract(GetLegalContractRequest) returns (GetLegalContractResponse);
  rpc ListContracts(ListTypedLegalContractsRequest) returns (ListTypedLegalContractsResponse);
  rpc GetDocument(GetLegalDocumentRequest) returns (GetLegalDocumentResponse);
  rpc ListDocuments(ListTypedLegalDocumentsRequest) returns (ListTypedLegalDocumentsResponse);
  rpc ListAccessHistory(ListTypedLegalAccessHistoryRequest)
      returns (ListTypedLegalAccessHistoryResponse);
}
