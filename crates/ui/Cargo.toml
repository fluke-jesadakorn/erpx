[package]
name = "erpx-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "ui_domains"
path = "tests/ui_domains.rs"

[[test]]
name = "ui_platform"
path = "tests/ui_platform.rs"

[dependencies]
chrono.workspace = true
dioxus = { workspace = true, features = ["html", "hooks", "macro", "signals"] }
erpx-domain.workspace = true

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
security-framework.workspace = true
security-framework-sys.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
erpx-android-bridge.workspace = true
jni.workspace = true

[lints]
workspace = true
