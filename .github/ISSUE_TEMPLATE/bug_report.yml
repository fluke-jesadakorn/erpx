name: Bug report
description: Report a reproducible problem using fictional data.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md and request a private channel.
        Do not include credentials, customer data or private logs in this form.
  - type: input
    id: revision
    attributes:
      label: Commit or version
      description: The exact revision and affected app or owner.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal fictional example and identify relevant environment versions.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks and sanitized evidence
      description: Describe checks already attempted; remove personal data and secrets.
