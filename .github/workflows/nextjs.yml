name: nextjs
on:
  push:
    branches: [development]
  pull_request: {}
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      candidate:
        description: Clean commit for an intentionally requested production acceptance run
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('manual-acceptance-{0}', github.run_id) || format('development-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  ERPX_TEST_ADMIN_URL: postgresql://erpx_test_admin:erpx-ci-only@127.0.0.1:5432/postgres
  ERPX_TEST_PG_BIN: /usr/lib/postgresql/18/bin
  ERPX_CLAMD_SOCKET: /tmp/erpx-clamav/clamd.sock
  ERPX_CLAMAV_DATABASE_DIR: /var/lib/clamav
  ERPX_HEIF_ENC: /usr/bin/heif-enc
  ERPX_HEIF_CONVERT: /usr/bin/heif-convert
  ERPX_PDFTOPPM_BIN: /usr/bin/pdftoppm
jobs:
  verification:
    name: Affected development verification
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erpx-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d postgres'
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/test-runtime
        with:
          browser: 'true'
      - name: Install the pinned Rust verification toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          sudo apt-get install -y libssl-dev pkg-config
      - name: Resolve the exact event candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MERGE_BASE" ;;
            push) base="$PUSH_BASE" ;;
            *) exit 2 ;;
          esac
          if [ -z "$base" ] || [ "${base//0/}" = "" ]; then
            echo 'An exact candidate base is required.' >&2
            exit 2
          fi
          echo "ERPX_CI_BASE=$(git rev-parse --verify "$base^{commit}")" >> "$GITHUB_ENV"
          echo "ERPX_CI_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run affected checks and development smoke
        shell: bash
        run: bun run test:ci --base="$ERPX_CI_BASE" --head="$ERPX_CI_HEAD"
      - name: Retain development-only receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-verification-${{ github.sha }}
          path: |
            .scratch/dev/test-suites/workspaces/
            .scratch/dev/test-suites/browser/
          if-no-files-found: warn
  acceptance:
    name: Explicit production candidate acceptance
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erpx-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d postgres'
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
      - uses: ./.github/actions/test-runtime
        with:
          browser: 'true'
      - name: Install the pinned Rust acceptance toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          sudo apt-get install -y libssl-dev pkg-config
      - name: Accept the explicitly selected clean candidate
        env:
          CANDIDATE: ${{ inputs.candidate }}
        shell: bash
        run: bun run release:acceptance --candidate="$CANDIDATE"
