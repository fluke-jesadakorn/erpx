name: ERPX target checks

on:
  push:
    paths:
      - "erpx/**"
      - ".github/workflows/erpx-targets.yml"
  pull_request:
    paths:
      - "erpx/**"
      - ".github/workflows/erpx-targets.yml"

jobs:
  mobile-targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-ios
          - os: ubuntu-24.04
            target: aarch64-linux-android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.1
          target: ${{ matrix.target }}
      - name: Check shared Dioxus mobile target
        working-directory: erpx
        run: cargo check -p erpx-console --target ${{ matrix.target }} --no-default-features --features mobile
