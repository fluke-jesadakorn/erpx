name: ERPX checks

on:
  push:
    paths:
      - "apps/**"
      - "crates/**"
      - "fixtures/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/erpx-targets.yml"
  pull_request:
    paths:
      - "apps/**"
      - "crates/**"
      - "fixtures/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/erpx-targets.yml"

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude erpx-android-bridge --all-targets --locked --offline -- -D warnings
      - run: cargo test --workspace --exclude erpx-android-bridge --locked --offline --no-fail-fast
      - name: Check Dioxus Web client
        run: cargo check -p erpx-console --no-default-features --features web --locked --offline
      - name: Check Dioxus Web server
        run: cargo check -p erpx-console --no-default-features --features server --locked --offline
