name: ERPX checks

on:
  push:
    paths:
      - "apps/**"
      - "crates/**"
      - "fixtures/**"
      - "xtask/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/erpx-targets.yml"
  pull_request:
    paths:
      - "apps/**"
      - "crates/**"
      - "fixtures/**"
      - "xtask/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/erpx-targets.yml"

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Install the pinned Dioxus CLI
        run: cargo xtask web-toolchain
      - name: Advisory, license, and source policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.0.12
        with:
          command: check
          command-arguments: advisories licenses sources
      - name: Offline core verification
        run: cargo xtask verify-core

  postgres-acceptance:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: erpx
          POSTGRES_PASSWORD: erpx-ci-only
          POSTGRES_DB: folio_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erpx -d folio_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: erpx
      POSTGRES_PASSWORD: erpx-ci-only
      POSTGRES_DB: folio_db
      ERPX_DEV_LEGACY_MINIO_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.93.1
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: PostgreSQL acceptance verification
        run: cargo xtask verify-sqlx
