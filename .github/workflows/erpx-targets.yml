name: ERPX checks

on:
  push:
    paths:
      - "apps/**"
      - "crates/**"
      - "fixtures/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/erpx-targets.yml"
  pull_request:
    paths:
      - "apps/**"
      - "crates/**"
      - "fixtures/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/erpx-targets.yml"

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --offline -- -D warnings
      - run: cargo test --workspace --offline --no-fail-fast

  mobile-targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-ios
          - os: ubuntu-24.04
            target: aarch64-linux-android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.1
          target: ${{ matrix.target }}
      - name: Check shared Dioxus mobile target
        run: cargo check -p erpx-console --target ${{ matrix.target }} --no-default-features --features mobile
