[package]
name = "erpx-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[package.metadata.erpx]
verification-roots = ["../../tests/support/files/system-scan-facts.rs", "../../tests/support/files/files-held-tool.rs", "../../scripts/docs/export-finance-journal-read-contracts.rs", "../../scripts/docs/generate-finance-journal-read-contracts.ts", "../../packages/contracts/src/finance-journal-read.generated.ts", "../../docs/contracts/next/finance-journal-read.openapi.generated.json", "../../tests/support/finance/native-journal-client.mjs"]

[features]
files-scan-worker = ["erpx-server-files/preview-provider"]
directory-ldaps = ["erpx-server-identity-access/directory-ldaps"]
contracts = ["dep:ts-rs", "dep:utoipa", "erpx-server-finance/contracts"]
private-development-api = []
business-http = ["legal-queue"]
legal-queue = []
legal-pdf-worker = ["erpx-server-legal/pdf-verifier"]
legal-document-worker = ["erpx-server-legal/document-provider"]
legal-processing-worker = ["legal-pdf-worker","legal-document-worker"]

[[bin]]
name = "erpx-server"
path = "src/main.rs"

[dependencies]
erpx-server-assets.workspace = true
erpx-server-collaboration.workspace = true
erpx-server-commerce.workspace = true
erpx-server-inventory.workspace = true
erpx-server-maintenance.workspace = true
ts-rs = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
erpx-server-people-payroll.workspace = true
erpx-server-runtime.workspace = true
erpx-server-workflow.workspace = true
erpx-server-shared.workspace = true
erpx-server-identity-access.workspace = true
erpx-server-legal.workspace = true
erpx-server-files.workspace = true
erpx-server-finance.workspace = true
erpx-server-commercial.workspace = true
erpx-server-platform-administration.workspace = true
erpx-server-pms.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
sqlx.workspace = true
axum.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
nix.workspace = true

[dev-dependencies]
tracing.workspace = true
bytes.workspace = true
ldap3_proto.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
tower.workspace = true
time.workspace = true
tempfile.workspace = true

[[test]]
name = "composition"
path = "../../tests/unit/shared.architecture/rust-composition.test.rs"

[[test]]
name = "legal_queued_authority"
path = "../../tests/integration/legal/rust-queued-authority-composition.test.rs"
required-features = ["legal-pdf-worker", "legal-document-worker", "legal-queue"]

[[test]]
name = "legal_worker_bootstrap"
path = "../../tests/unit/legal/rust-worker-bootstrap.test.rs"
required-features = ["legal-document-worker"]

[[test]]
name = "legal_worker_provider"
path = "../../tests/provider/legal/rust-worker-bootstrap.test.rs"
required-features = ["legal-pdf-worker", "legal-document-worker", "legal-queue"]

[lints]
workspace = true

[[test]]
name = "finance_journal_review"
path = "../../tests/integration/finance/rust-journal-review-composition.test.rs"

[[test]]
name = "business_http_postgres"
path = "../../tests/integration/finance/rust-business-http-postgres.test.rs"
required-features = ["business-http"]

[[test]]
name = "private_development_api"
path = "../../tests/unit/identity_access/rust-private-development-api.test.rs"
required-features = ["private-development-api"]

[[test]]
name = "private_session_api_postgres"
path = "../../tests/integration/identity_access/rust-private-session-api-postgres.test.rs"
required-features = ["private-development-api"]

[[test]]
name = "private_session_http_provider"
path = "../../tests/provider/identity_access/rust-native-session-http.test.rs"
required-features = ["private-development-api"]

[[example]]
name = "export-finance-journal-read-contracts"
path = "../../scripts/docs/export-finance-journal-read-contracts.rs"
required-features = ["contracts"]

[[test]]
name = "finance_journal_detail_postgres"
path = "../../tests/integration/finance/rust-journal-detail-postgres.test.rs"
required-features = ["business-http"]

[[test]]
name = "finance_journal_detail_http_provider"
path = "../../tests/provider/finance/rust-journal-detail-http.test.rs"
required-features = ["business-http"]

[[test]]
name = "finance_directory_composition"
path = "../../tests/integration/finance/rust-directory-journal-composition.test.rs"
required-features = ["business-http", "directory-ldaps"]

[[test]]
name = "work_source"
path = "../../tests/integration/maintenance/rust-work-source-postgres.test.rs"

[[test]]
name = "issue_part_command"
path = "../../tests/integration/maintenance/rust-issue-part-command-postgres.test.rs"

[[test]]
name = "directory_source_admin_postgres"
path = "../../tests/integration/identity_access/rust-directory-source-admin-postgres.test.rs"
required-features = ["directory-ldaps"]

[[test]]
name = "finance_maintenance_parts_postgres"
path = "../../tests/integration/finance/rust-maintenance-parts-postgres.test.rs"

[[test]]
name = "files_system_scan_postgres"
path = "../../tests/integration/files/rust-system-scan-postgres.test.rs"

[[test]]
name = "files_system_scan_provider"
path = "../../tests/provider/files/rust-system-scan-provider.test.rs"
required-features = ["files-scan-worker", "contracts"]

[[bin]]
name = "erpx-files-scan-held-tool"
path = "../../tests/support/files/files-held-tool.rs"
required-features = ["files-scan-worker", "contracts"]

[[test]]
name = "maintenance_transitions"
path = "../../tests/integration/maintenance/rust-transitions-command-postgres.test.rs"
